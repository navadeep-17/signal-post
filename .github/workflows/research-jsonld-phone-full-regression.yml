name: Research JSON-LD Phone Full Regression

on:
  push:
    branches:
      - research/bulk-exact-org-recall
    paths:
      - .github/workflows/research-jsonld-phone-full-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run complete test suite
        run: uv run --with pytest pytest -q
