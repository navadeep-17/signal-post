name: Q7 Innovation Norway Reach

on:
  workflow_dispatch:
  push:
    branches:
      - audit/q7-innovation-norway-reach
    paths:
      - '.github/workflows/q7-innovation-norway-reach.yml'
      - 'scripts/screen_q7_innovation_norway_reach.py'
      - 'tests/test_q7_innovation_norway_reach.py'

permissions:
  contents: read
  actions: read

jobs:
  consumed-reach:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source-screen head
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Download already-consumed Phase 11 replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p consumed source q7-innovation-norway
          gh run download 37314396820 \
            --repo navadeep-17/signal-post \
            --name phase11-owner-veto-consumed-replay \
            --dir consumed

      - name: Download current published Innovation Norway CSV
        run: |
          curl --fail --location --retry 3 \
            'https://data.innovasjonnorge.no/api/files?filename=Tildelinger.csv&container=innovasjonnorge&subfolder=tildelinger/csv' \
            --output source/Tildelinger.csv
          test -s source/Tildelinger.csv
          wc -c source/Tildelinger.csv
          sha256sum source/Tildelinger.csv | tee q7-innovation-norway/source.sha256

      - name: Screen exact organisation-number reach
        run: |
          PROFILE_PATH="$(find consumed -type f -path '*/work/profiles.jsonl' | head -n 1)"
          if [ -z "$PROFILE_PATH" ]; then
            echo 'Consumed profiles.jsonl not found' >&2
            exit 1
          fi
          uv run python scripts/screen_q7_innovation_norway_reach.py \
            --targets "$PROFILE_PATH" \
            --dataset source/Tildelinger.csv \
            --report q7-innovation-norway/report.json \
            --as-of 2026-10-05 \
            --recent-years 5

      - name: Verify reach-probe integrity
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('q7-innovation-norway/report.json').read_text(encoding='utf-8'))
          assert report['audit']['target_companies'] == 100, report
          assert report['audit']['rows_scanned'] > 0, report
          assert report['source']['dataset_bytes'] > 0, report
          assert len(report['source']['dataset_sha256']) == 64, report
          assert report['schema']['organisation_number_column'], report
          assert report['source']['production_rights_qualified'] is False, report
          assert report['publication_enabled'] is False, report
          assert report['fresh_cohort_consumed'] is False, report
          for key in ('any_financing_decision', 'recent_financing_decision'):
              row = report['coverage'][key]
              assert 0 <= row['companies'] <= 100, report
              assert row['total_companies'] == 100, report
          print(json.dumps(report['coverage'], indent=2, ensure_ascii=False))
          print(json.dumps(report['schema'], indent=2, ensure_ascii=False))
          PY

      - name: Upload source-screen report
        uses: actions/upload-artifact@v4
        with:
          name: q7-innovation-norway-reach
          path: q7-innovation-norway/*
          if-no-files-found: error
