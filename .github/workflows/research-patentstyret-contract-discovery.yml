name: Research Patentstyret API Contract Discovery

on:
  push:
    branches:
      - research/bulk-exact-org-recall
    paths:
      - .github/workflows/research-patentstyret-contract-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch official developer pages
        run: |
          mkdir -p out/patentstyret/js
          for SPEC in \
            'home|https://developer.patentstyret.no/' \
            'apis|https://developer.patentstyret.no/apis' \
            'docs|https://developer.patentstyret.no/docs-open-data'; do
            NAME="${SPEC%%|*}"
            URL="${SPEC#*|}"
            curl --fail --location --compressed \
              --user-agent 'Signalpost-research-source-screen/1.0' \
              "$URL" --output "out/patentstyret/${NAME}.html"
          done

      - name: Inspect official page links and tolerate stale sample assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import re, subprocess

          refs = set()
          hrefs = set()
          for html_path in Path('out/patentstyret').glob('*.html'):
              html = html_path.read_text(encoding='utf-8', errors='replace')
              refs.update(re.findall(r'(?:src|href)=["\']([^"\']+\.js(?:\?[^"\']*)?)', html, flags=re.I))
              hrefs.update(re.findall(r'href=["\']([^"\']+)["\']', html, flags=re.I))
              print('\n=== HREFS', html_path.name, '===')
              for href in sorted(hrefs):
                  if any(token in href.lower() for token in ['api', 'open-data', 'register', 'product', 'operation']):
                      print('HREF', urljoin('https://developer.patentstyret.no/', href))

          print('js-ref-count:', len(refs))
          for i, ref in enumerate(sorted(refs)):
              url = urljoin('https://developer.patentstyret.no/', ref)
              dest = Path('out/patentstyret/js') / f'{i:03d}.js'
              print('fetch', url)
              proc = subprocess.run([
                  'curl','--silent','--show-error','--location','--compressed',
                  '--user-agent','Signalpost-research-source-screen/1.0',
                  '--write-out','%{http_code}',
                  url,'--output',str(dest)
              ], text=True, capture_output=True)
              print('status', proc.stdout.strip(), 'returncode', proc.returncode)
              if proc.returncode != 0 or proc.stdout.strip() != '200':
                  dest.unlink(missing_ok=True)
          PY

      - name: Search official portal assets for endpoint contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = [*Path('out/patentstyret').glob('*.html'), *Path('out/patentstyret/js').glob('*.js')]
          needles = [
              'IprCasesByCompany',
              'subscription-key',
              'Ocp-Apim-Subscription-Key',
              'organizationNumber',
              'organisationNumber',
              'organization',
              '/register/v1',
              'api-url',
              'backend',
          ]
          for path in files:
              text = path.read_text(encoding='utf-8', errors='replace')
              low = text.lower()
              matched = [n for n in needles if n.lower() in low]
              if not matched:
                  continue
              print('\n===', path, 'bytes=', path.stat().st_size, 'matched=', matched, '===')
              for needle in needles:
                  start = 0
                  shown = 0
                  while shown < 12:
                      idx = low.find(needle.lower(), start)
                      if idx < 0:
                          break
                      print('\n---', needle, '---')
                      print(text[max(0, idx-900):min(len(text), idx+2200)])
                      shown += 1
                      start = idx + len(needle)
              urls = sorted(set(re.findall(r'https?://[^"\'<>\\s]+', text)))
              for url in urls:
                  if any(k in url.lower() for k in ['patent', 'api', 'azure']):
                      print('URL', url[:1000])
          PY

      - name: Remove fetched portal payloads
        if: always()
        run: rm -rf out/patentstyret
