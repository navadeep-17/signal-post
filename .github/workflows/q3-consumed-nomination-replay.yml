name: Q3 Consumed Nomination Replay

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/q3-search-assisted-discovery-rebase
    paths:
      - '.github/workflows/q3-consumed-nomination-replay.yml'
      - 'scripts/replay_q3_candidate_nominations.py'
      - 'scripts/run_model_search_discovery.py'
      - 'src/norway_company_agent/model_web_search.py'
      - 'tests/fixtures/q3-consumed-nominations.json'
      - 'tests/fixtures/q3-consumed-search-proxy-20.json'

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout experiment head
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Download already-consumed Phase 11 replay artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p consumed
          gh run download 37314396820 \
            --repo navadeep-17/signal-post \
            --name phase11-owner-veto-consumed-replay \
            --dir consumed
          find consumed -maxdepth 6 -type f | sort

      - name: Replay adversarial frozen nominations through current exact-company gate
        run: |
          PROFILE_PATH="$(find consumed -type f -path '*/work/profiles.jsonl' | head -n 1)"
          if [ -z "$PROFILE_PATH" ]; then
            echo 'Consumed profiles.jsonl not found' >&2
            exit 1
          fi
          uv run python scripts/replay_q3_candidate_nominations.py \
            --input "$PROFILE_PATH" \
            --nominations tests/fixtures/q3-consumed-nominations.json \
            --report q3-consumed-replay/adversarial-report.json \
            --timeout 15 \
            --candidate-limit 2

      - name: Replay deterministic 20-company public-search proxy
        run: |
          PROFILE_PATH="$(find consumed -type f -path '*/work/profiles.jsonl' | head -n 1)"
          uv run python scripts/replay_q3_candidate_nominations.py \
            --input "$PROFILE_PATH" \
            --nominations tests/fixtures/q3-consumed-search-proxy-20.json \
            --report q3-consumed-replay/search-proxy-20-report.json \
            --timeout 15 \
            --candidate-limit 2

      - name: Verify replay reports are terminal
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          adversarial = json.loads(Path('q3-consumed-replay/adversarial-report.json').read_text(encoding='utf-8'))
          assert adversarial['nominated_companies'] == 4, adversarial
          assert len(adversarial['outcomes']) == 4, adversarial
          assert adversarial['accepted'] + adversarial['quarantined'] + adversarial['unavailable'] == 4, adversarial

          proxy = json.loads(Path('q3-consumed-replay/search-proxy-20-report.json').read_text(encoding='utf-8'))
          assert proxy['nominated_companies'] == 20, proxy
          assert len(proxy['outcomes']) == 20, proxy
          assert proxy['accepted'] + proxy['quarantined'] + proxy['unavailable'] == 20, proxy
          assert proxy['metadata']['selection_org_list_sha256'] == '5c378da42b78ce4c4dfe4b71d0b074f912bde6ea704ebaf5f5b6abddf4d20269', proxy

          terminal = {'accepted', 'quarantined', 'profile_missing', 'already_has_publishable_website', 'no_candidate_after_filter'}
          assert all(item['status'] in terminal for item in adversarial['outcomes']), adversarial
          assert all(item['status'] in terminal for item in proxy['outcomes']), proxy

          print('ADVERSARIAL')
          print(json.dumps(adversarial, indent=2, ensure_ascii=False))
          print('SEARCH_PROXY_20')
          print(json.dumps(proxy, indent=2, ensure_ascii=False))
          PY

      - name: Upload consumed replay reports
        uses: actions/upload-artifact@v4
        with:
          name: q3-consumed-nomination-replay
          path: q3-consumed-replay/*.json
          if-no-files-found: error
