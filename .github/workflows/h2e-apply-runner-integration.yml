name: H2e Apply Runner Integration

on:
  workflow_dispatch:
  push:
    branches:
      - "experiment/h2e-official-workforce"
    paths:
      - "scripts/apply_h2e_runner_integration.py"
      - ".github/workflows/h2e-apply-runner-integration.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Apply deterministic integration patch
        run: |
          python scripts/apply_h2e_runner_integration.py
          git diff --check
          git diff -- scripts/run_signalpost_final.py

      - name: Run focused and full regressions
        run: |
          uv sync --locked
          uv run --with pytest pytest -q tests/test_h2e_registry_workforce.py
          uv run --with pytest pytest -q

      - name: Commit integrated runner
        run: |
          test -n "$(git status --porcelain scripts/run_signalpost_final.py)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_signalpost_final.py
          git commit -m "feat(h2e): integrate zero-request registry workforce"
          git push origin HEAD:experiment/h2e-official-workforce
