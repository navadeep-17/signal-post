name: Phase 7 V8 Consumed Requalification

on:
  push:
    branches:
      - feature/stotteregisteret-support-awards
    paths:
      - .github/workflows/phase7-v8-consumed-requalification.yml

permissions:
  contents: read

jobs:
  qualify-v8-consumed-100:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          command -v pdftoppm
          command -v tesseract

      - name: Sync exact wrapper/support regressions
        run: |
          uv sync --locked
          uv run --with pytest pytest -q \
            tests/test_phase5_support_registry.py \
            tests/test_phase5_support_runner_budget.py \
            tests/test_phase7_support_evidence_provenance.py \
            tests/test_v7_m4c1_evaluator_wrapper.py \
            tests/test_v8_dynamic_batch_wrapper.py

      - name: Download current BRREG snapshot
        run: |
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 240 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          test -s brreg-enheter.csv
          sha256sum brreg-enheter.csv > brreg-enheter.sha256

      - name: Freeze consumed certified chunk 0
        run: |
          echo '80e8f5c88b2d2facc1a00c20677a0930240f40fc75a36a27bee16c54efa2de26  submission/final-release-1000.jsonl' | sha256sum -c -
          head -n 100 submission/final-release-1000.jsonl > phase7-consumed-100.jsonl
          test "$(wc -l < phase7-consumed-100.jsonl)" -eq 100
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(line) for line in Path('phase7-consumed-100.jsonl').read_text().splitlines() if line.strip()]
          assert len(rows)==100
          assert len({str(row['organisation_number']) for row in rows})==100
          PY
          sha256sum phase7-consumed-100.jsonl > phase7-consumed-100.sha256

      - name: Run actual V8 evaluator path
        run: |
          mkdir -p out
          uv run python scripts/run_signalpost_v8.py \
            --organisations phase7-consumed-100.jsonl \
            --bulk brreg-enheter.csv \
            --output out/phase7-v8-consumed-output.jsonl \
            --report out/phase7-v8-consumed-report.json \
            --product-output out/signalpost-v8-support.html \
            --work-dir out/phase7-v8-work \
            --run-id phase7-v8-consumed-requalification-100 \
            --expected-count 100 \
            --workers 8 \
            --site-timeout 6 \
            --wikidata-timeout 8 \
            --max-challenge-requests 2000 \
            --max-third-party-cost-usd 0 \
            --max-wall-runtime-seconds 2400 \
            --annual-workforce-workers 4 \
            --annual-workforce-timeout 60 \
            --annual-workforce-min-start-interval 2.1 \
            --annual-workforce-ocr-pages 8 \
            --annual-workforce-ocr-dpi 110 \
            --support-registry-timeout 420 \
            --support-lookback-days 365 \
            --support-events-per-company 5

      - name: Verify exact-head support, integrity, budget and product gates
        env:
          QUALIFICATION_SHA: ${{ github.sha }}
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          from norway_company_agent.canonical_projection import validate_canonical_projection
          from norway_company_agent.output_contract import validate_contract_object
          from norway_company_agent.synthesis import validate_company_synthesis

          output_path = Path('out/phase7-v8-consumed-output.jsonl')
          report_path = Path('out/phase7-v8-consumed-report.json')
          product_path = Path('out/signalpost-v8-support.html')
          rows = [json.loads(line) for line in output_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          report = json.loads(report_path.read_text(encoding='utf-8'))
          html = product_path.read_text(encoding='utf-8')

          assert report['passed'] is True, report
          assert len(rows) == 100
          assert len({str(row['organisation_number']) for row in rows}) == 100
          assert all((row.get('run') or {}).get('terminal_status') == 'completed' for row in rows)

          support_report = report.get('support_registry') or {}
          assert support_report.get('status') == 'available', support_report
          assert int(support_report.get('requests') or 0) == 1, support_report
          assert int(support_report.get('observations') or 0) > 0, support_report
          assert len(str(support_report.get('source_snapshot_sha256') or '')) == 64, support_report

          request_budget = report.get('request_budget') or {}
          assert int(request_budget.get('v2_max_challenge_requests_after_support_reservation') or 0) == 1998, request_budget
          assert int(request_budget.get('base_runner_max_challenge_requests_after_v5_reservation') or 0) == 1996, request_budget
          assert int(request_budget.get('support_registry_observed_logical_requests') or 0) == 1, request_budget
          assert int(request_budget.get('brreg_change_feed_observed_logical_requests') or 0) <= 1, request_budget
          assert int(request_budget.get('observed_conservative_challenge_request_charge') or 0) <= 2000, request_budget
          assert int(request_budget.get('theoretical_challenge_request_charge_ceiling') or 0) == 2000, request_budget

          assert not (report.get('canonical_projection') or {}).get('validation_errors'), report.get('canonical_projection')
          assert not (report.get('synthesis') or {}).get('validation_errors'), report.get('synthesis')
          assert not (report.get('registry_change_feed') or {}).get('integrity_errors'), report.get('registry_change_feed')
          support_errors = report.get('support_projection_errors') or {}
          assert not support_errors.get('contract'), support_errors
          assert not support_errors.get('canonical'), support_errors
          assert not support_errors.get('synthesis'), support_errors
          assert float((report.get('source_policy') or {}).get('third_party_cost_usd') or 0.0) == 0.0
          assert int((report.get('source_policy') or {}).get('search_api_requests') or 0) == 0
          assert float((report.get('runtime') or {}).get('wall_runtime_seconds') or 0) <= 2400

          contract_errors = []
          canonical_errors = []
          synthesis_errors = []
          support_claims = []
          support_facts = []
          audited = []
          for row in rows:
              org = str(row.get('organisation_number') or '')
              contract_errors.extend((org, err) for err in validate_contract_object(row))
              canonical_errors.extend((org, err) for err in validate_canonical_projection(row))
              synthesis_errors.extend((org, err) for err in validate_company_synthesis(row))
              evidence = {
                  str(item.get('id')): item
                  for item in (row.get('evidence') or [])
                  if isinstance(item, dict) and item.get('id')
              }
              for claim in row.get('claims') or []:
                  if not isinstance(claim, dict) or claim.get('field') != 'official.support_award':
                      continue
                  support_claims.append((org, claim))
                  value = claim.get('value') or {}
                  assert value.get('kind') == 'support_award'
                  assert value.get('awarded_at')
                  if value.get('amount') is not None:
                      assert value.get('currency'), (org, value)
                  if value.get('amount_interval_from') is not None or value.get('amount_interval_to') is not None:
                      assert value.get('amount_interval_currency'), (org, value)
                  refs = claim.get('evidence_ids') or []
                  assert len(refs) == 1, (org, refs)
                  ev = evidence[refs[0]]
                  assert len(str(ev.get('content_sha256') or '')) == 64, ev
                  assert len(str(ev.get('source_snapshot_sha256') or '')) == 64, ev
                  assert ev.get('source_row_number') is not None, ev
                  assert ev.get('source_row_key'), ev
                  assert ev.get('retrieved_at'), ev
                  assert ev.get('effective_at') == value.get('awarded_at'), (ev, value)
                  span = str(ev.get('claim_span') or '')
                  assert f'recipient org: {org}' in span, (org, span)
                  audited.append({
                      'organisation_number': org,
                      'recipient_name': value.get('recipient_name'),
                      'awarded_at': value.get('awarded_at'),
                      'support_measure_number': value.get('support_measure_number'),
                      'row_sha256': ev.get('content_sha256'),
                      'snapshot_sha256': ev.get('source_snapshot_sha256'),
                      'source_row_number': ev.get('source_row_number'),
                      'source_row_key': ev.get('source_row_key'),
                      'claim_span': span,
                  })
              for fact in row.get('canonical_facts') or []:
                  if isinstance(fact, dict) and fact.get('canonical_field') == 'public.official_support_award':
                      support_facts.append((org, fact))

          assert not contract_errors, contract_errors[:5]
          assert not canonical_errors, canonical_errors[:5]
          assert not synthesis_errors, synthesis_errors[:5]
          assert support_claims, 'expected at least one support claim on consumed cohort'
          assert len(support_claims) == len(support_facts), (len(support_claims), len(support_facts))
          projection = (report.get('canonical_projection') or {}).get('support_award_projection') or {}
          assert int(projection.get('published_claims') or 0) == len(support_claims), projection
          assert int(projection.get('published_canonical_facts') or 0) == len(support_facts), projection
          assert 'public.official_support_award' in html

          parent_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          summary = {
              'schema_version': 'signalpost-phase7-v8-consumed-requalification-v1',
              'qualification_sha': os.environ['QUALIFICATION_SHA'],
              'production_parent_sha': parent_sha,
              'input_companies': 100,
              'terminal_completed': 100,
              'support_companies': len({org for org, _ in support_claims}),
              'support_claims': len(support_claims),
              'support_canonical_facts': len(support_facts),
              'support_snapshot_sha256': support_report.get('source_snapshot_sha256'),
              'support_requests': int(support_report.get('requests') or 0),
              'brreg_change_feed_requests': int(request_budget.get('brreg_change_feed_observed_logical_requests') or 0),
              'observed_conservative_request_charge': int(request_budget.get('observed_conservative_challenge_request_charge') or 0),
              'theoretical_conservative_request_ceiling': int(request_budget.get('theoretical_challenge_request_charge_ceiling') or 0),
              'wall_runtime_seconds': float((report.get('runtime') or {}).get('wall_runtime_seconds') or 0),
              'third_party_api_cost_usd': float((report.get('source_policy') or {}).get('third_party_cost_usd') or 0.0),
              'search_api_requests': int((report.get('source_policy') or {}).get('search_api_requests') or 0),
              'contract_errors': len(contract_errors),
              'canonical_errors': len(canonical_errors),
              'synthesis_errors': len(synthesis_errors),
              'support_projection_errors': sum(len(v or []) for v in support_errors.values()),
              'support_evidence_rows_audited': len(audited),
              'product_bytes': len(html.encode('utf-8')),
              'output_sha256': digest(output_path),
              'report_sha256': digest(report_path),
              'product_sha256': digest(product_path),
              'passed': True,
          }
          Path('out/phase7-v8-consumed-audit.json').write_text(json.dumps(audited, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('out/phase7-v8-consumed-summary.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY

      - name: Hash qualification deliverables
        run: |
          sha256sum \
            out/phase7-v8-consumed-output.jsonl \
            out/phase7-v8-consumed-report.json \
            out/signalpost-v8-support.html \
            out/phase7-v8-consumed-audit.json \
            out/phase7-v8-consumed-summary.json \
            > out/phase7-v8-consumed.sha256

      - name: Upload consumed V8 qualification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-v8-consumed-requalification-100
          retention-days: 90
          if-no-files-found: error
          path: |
            phase7-consumed-100.jsonl
            phase7-consumed-100.sha256
            brreg-enheter.sha256
            out/phase7-v8-consumed-output.jsonl
            out/phase7-v8-consumed-report.json
            out/signalpost-v8-support.html
            out/phase7-v8-consumed-audit.json
            out/phase7-v8-consumed-summary.json
            out/phase7-v8-consumed.sha256
