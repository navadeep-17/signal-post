name: H1c Zero-Cost Domain Audit

on:
  workflow_dispatch:
  push:
    branches:
      - feature/company-site-signals
    paths:
      - '.github/workflows/h1c-zero-cost-domain.yml'
      - 'src/norway_company_agent/zero_cost_discovery.py'
      - 'src/norway_company_agent/zero_cost_registry_guard.py'
      - 'scripts/run_zero_cost_domain_discovery.py'
      - 'scripts/apply_zero_cost_registry_guard.py'
      - 'tests/test_zero_cost_discovery.py'
      - 'tests/test_zero_cost_registry_guard.py'

permissions:
  contents: read

jobs:
  h1c-frozen-100:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Run H1c and full regressions
        run: |
          uv run --with pytest pytest -q tests/test_zero_cost_discovery.py tests/test_zero_cost_registry_guard.py
          uv run --with pytest pytest -q

      - name: Download official BRREG bulk registry
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          test -s brreg-enheter.csv
          sha256sum brreg-enheter.csv > brreg-enheter.sha256

      - name: Download Builderr frozen universe
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://builderr.ai/signalpost-company-universe-2025.jsonl.gz' \
            --output signalpost-universe.jsonl.gz
          test -s signalpost-universe.jsonl.gz
          gzip -t signalpost-universe.jsonl.gz
          sha256sum signalpost-universe.jsonl.gz > signalpost-universe.sha256

      - name: Recreate frozen 100-company development corpus
        run: |
          uv run python select_entry_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --count 1000 \
            --seed 20260823 \
            --output entry-companies.jsonl
          head -n 100 entry-companies.jsonl > benchmark-dev-100.jsonl
          test "$(wc -l < benchmark-dev-100.jsonl)" -eq 100
          DEV_SHA="$(sha256sum benchmark-dev-100.jsonl | cut -d' ' -f1)"
          test "$DEV_SHA" = '51a96f25f79532b9ba285304d540887e0f17410907909dbe6c85c0b41b8341d3'
          printf '%s  %s\n' "$DEV_SHA" benchmark-dev-100.jsonl > benchmark-dev-100.sha256

      - name: Run official baseline plus H1a
        run: |
          mkdir -p out
          uv run python scripts/run_competition_batch.py \
            --organisations benchmark-dev-100.jsonl \
            --bulk brreg-enheter.csv \
            --profiles-output out/h1a-profiles.jsonl \
            --output out/h1a-envelopes.jsonl \
            --report out/h1a-report.json \
            --run-id h1c-parent-h1a-100 \
            --expected-count 100 \
            --enable-email-domain-discovery \
            --email-domain-timeout 8 \
            --email-domain-retry-timeout 15

      - name: Run H1c deterministic zero-cost discovery
        run: |
          uv run python scripts/run_zero_cost_domain_discovery.py \
            --input out/h1a-profiles.jsonl \
            --output out/h1c-pre-guard-profiles.jsonl \
            --report out/h1c-report.json \
            --timeout 6 \
            --max-candidates 2 \
            --workers 8 \
            --promote-verified

      - name: Apply H1c registry-risk guard
        run: |
          uv run python scripts/apply_zero_cost_registry_guard.py \
            --input out/h1c-pre-guard-profiles.jsonl \
            --output out/h1c-hardened-profiles.jsonl \
            --report out/h1c-registry-guard-report.json

      - name: Build hardened H1c comparison
        run: |
          uv run python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          def read_jsonl(path):
              return [json.loads(line) for line in Path(path).read_text(encoding='utf-8').splitlines() if line.strip()]

          before = read_jsonl('out/h1a-profiles.jsonl')
          preliminary = read_jsonl('out/h1c-pre-guard-profiles.jsonl')
          after = read_jsonl('out/h1c-hardened-profiles.jsonl')
          h1a = json.loads(Path('out/h1a-report.json').read_text())
          h1c = json.loads(Path('out/h1c-report.json').read_text())
          guard = json.loads(Path('out/h1c-registry-guard-report.json').read_text())
          assert len(before) == 100 == len(preliminary) == len(after)
          assert h1c['third_party_cost_usd'] == 0.0
          assert h1c['search_api_requests'] == 0
          assert guard['third_party_cost_usd'] == 0.0
          assert guard['search_api_requests'] == 0
          assert guard['network_requests'] == 0

          def exact_count(rows):
              total = 0
              states = Counter()
              for profile in rows:
                  website = (profile.get('evidence') or {}).get('website') or {}
                  assessment = (website.get('value') or {}).get('identity_assessment') or {}
                  state = assessment.get('status') if website.get('status') == 'available' else f"website_{website.get('status') or 'missing'}"
                  states[str(state)] += 1
                  total += int(website.get('status') == 'available' and assessment.get('publishable') and assessment.get('status') == 'exact')
              return total, dict(states)

          before_exact, before_states = exact_count(before)
          preliminary_exact, preliminary_states = exact_count(preliminary)
          after_exact, after_states = exact_count(after)
          total_requests = int(h1a['operations']['requests']) + int(h1c['counts'].get('requests', 0))
          summary = {
              'corpus': {
                  'count': 100,
                  'manifest_sha256': Path('benchmark-dev-100.sha256').read_text().split()[0],
              },
              'h1a_parent': {
                  'requests': h1a['operations']['requests'],
                  'exact_websites': before_exact,
                  'identity_states': before_states,
              },
              'h1c_preliminary': {
                  **h1c,
                  'exact_websites': preliminary_exact,
                  'identity_states': preliminary_states,
              },
              'registry_risk_guard': guard,
              'combined': {
                  'requests': total_requests,
                  'under_2000_request_gate': total_requests < 2000,
                  'third_party_cost_usd': 0.0,
                  'search_api_requests': 0,
                  'exact_websites_before_h1c': before_exact,
                  'exact_websites_preliminary': preliminary_exact,
                  'exact_websites_after_guard': after_exact,
                  'hardened_exact_website_uplift': after_exact - before_exact,
                  'identity_states_after_guard': after_states,
              },
          }
          Path('out/h1c-comparison.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Verify zero-cost and precision invariants
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('out/h1c-comparison.json').read_text())
          assert summary['combined']['third_party_cost_usd'] == 0.0, summary
          assert summary['combined']['search_api_requests'] == 0, summary
          assert summary['combined']['under_2000_request_gate'] is True, summary
          assert summary['combined']['hardened_exact_website_uplift'] >= 0, summary
          assert summary['registry_risk_guard']['counts'].get('quarantined', 0) >= 1, summary
          assert summary['combined']['exact_websites_after_guard'] <= summary['combined']['exact_websites_preliminary'], summary
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          PY

      - name: Upload H1c audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h1c-zero-cost-domain-100
          if-no-files-found: error
          retention-days: 30
          path: |
            benchmark-dev-100.jsonl
            benchmark-dev-100.sha256
            brreg-enheter.sha256
            signalpost-universe.sha256
            out/h1a-profiles.jsonl
            out/h1a-report.json
            out/h1c-pre-guard-profiles.jsonl
            out/h1c-hardened-profiles.jsonl
            out/h1c-report.json
            out/h1c-registry-guard-report.json
            out/h1c-comparison.json
