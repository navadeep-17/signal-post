name: Live Baseline Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - chore/phase0-live-smoke
    paths:
      - '.github/workflows/live-smoke.yml'

permissions:
  contents: read

jobs:
  smoke-10:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Download official BRREG bulk registry
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          test -s brreg-enheter.csv
          ls -lh brreg-enheter.csv

      - name: Download Builderr frozen universe
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://builderr.ai/signalpost-company-universe-2025.jsonl.gz' \
            --output signalpost-universe.jsonl.gz
          test -s signalpost-universe.jsonl.gz
          gzip -t signalpost-universe.jsonl.gz
          ls -lh signalpost-universe.jsonl.gz

      - name: Select valid 1,000-company entry manifest
        run: |
          uv run python select_entry_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --count 1000 \
            --output entry-companies.jsonl
          test "$(wc -l < entry-companies.jsonl)" -eq 1000

      - name: Create 10-company private smoke slice
        run: |
          head -n 10 entry-companies.jsonl > smoke-companies.jsonl
          test "$(wc -l < smoke-companies.jsonl)" -eq 10

      - name: Run untouched 10-company competition baseline
        run: |
          mkdir -p out
          uv run python scripts/run_competition_batch.py \
            --organisations smoke-companies.jsonl \
            --bulk brreg-enheter.csv \
            --profiles-output out/smoke-profiles.jsonl \
            --output out/smoke-envelopes.jsonl \
            --report out/smoke-report.json \
            --run-id phase0-smoke-001 \
            --expected-count 10

      - name: Verify terminal-output invariant
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          envelopes_path = Path('out/smoke-envelopes.jsonl')
          rows = [json.loads(line) for line in envelopes_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          assert len(rows) == 10, f'expected 10 terminal envelopes, got {len(rows)}'
          orgs = [str(row.get('organisation_number') or '') for row in rows]
          assert len(set(orgs)) == 10, f'duplicate organisation numbers: {orgs}'
          assert all(row.get('run', {}).get('terminal_status') for row in rows), 'missing terminal status'

          report = json.loads(Path('out/smoke-report.json').read_text(encoding='utf-8'))
          print('Smoke terminal statuses:')
          for row in rows:
              print(row['organisation_number'], row['run']['terminal_status'])
          print('Run report:')
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-live-smoke
          if-no-files-found: warn
          retention-days: 14
          path: |
            entry-companies.jsonl
            smoke-companies.jsonl
            out/smoke-profiles.jsonl
            out/smoke-envelopes.jsonl
            out/smoke-report.json
