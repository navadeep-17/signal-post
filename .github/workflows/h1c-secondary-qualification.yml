name: H1c Secondary Identity Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/h1c-secondary-identity-corroboration"
    paths:
      - "src/norway_company_agent/final_site_discovery.py"
      - "tests/test_h1c_secondary_identity.py"
      - ".github/workflows/h1c-secondary-qualification.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync and test
        run: |
          uv sync --locked
          uv run --with pytest pytest -q
      - name: Download official BRREG bulk registry
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          test -s brreg-enheter.csv
          sha256sum brreg-enheter.csv > brreg-enheter.sha256
      - name: Download Builderr frozen universe
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://builderr.ai/signalpost-company-universe-2025.jsonl.gz' \
            --output signalpost-universe.jsonl.gz
          test -s signalpost-universe.jsonl.gz
          gzip -t signalpost-universe.jsonl.gz
          sha256sum signalpost-universe.jsonl.gz > signalpost-universe.sha256
      - name: Recreate original 1000 and known validation 300
        run: |
          uv run python select_entry_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --count 1000 \
            --seed 20260823 \
            --output entry-companies.jsonl
          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude entry-companies.jsonl \
            --count 300 \
            --seed 20260915 \
            --output known-validation-300.jsonl \
            --report known-validation-selection.json
          uv run python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = '4248438faa42508f7721bdb83002fe15c81735dbf3f97878eba271078864fda5'
          actual = hashlib.sha256(Path('known-validation-300.jsonl').read_bytes()).hexdigest()
          report = json.loads(Path('known-validation-selection.json').read_text())
          assert actual == expected, (actual, expected)
          assert report['overlap_count'] == 0, report
          print(json.dumps({'known_validation_sha256': actual, 'overlap': 0}, indent=2))
          PY
      - name: Replay known 300 as regression only
        run: |
          uv run python scripts/run_signalpost_final.py \
            --organisations known-validation-300.jsonl \
            --bulk brreg-enheter.csv \
            --output out/known-final.jsonl \
            --report out/known-run-report.json \
            --work-dir out/known-work \
            --run-id h1c-secondary-known-regression \
            --expected-count 300 \
            --workers 8 \
            --site-timeout 6 \
            --max-challenge-requests 5400 \
            --max-third-party-cost-usd 0 \
            --max-wall-runtime-seconds 2400
      - name: Require known false positive to be quarantined
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(line) for line in Path('out/known-work/profiles.jsonl').read_text().splitlines() if line.strip()]
          target = next(row for row in rows if row['organisation_number'] == '933200353')
          website = (target.get('evidence') or {}).get('website') or {}
          identity = (website.get('value') or {}).get('identity_assessment') or {}
          published_wrong = website.get('status') == 'available' and bool(identity.get('publishable')) and 'oslomikrosement.no' in str((website.get('value') or {}).get('final_url') or website.get('source_url') or '')
          assert not published_wrong, json.dumps(target, ensure_ascii=False)[:4000]
          report = json.loads(Path('out/known-run-report.json').read_text())
          assert report['passed'] is True, report
          assert report['request_budget']['observed_conservative_challenge_request_charge'] <= 5400
          print(json.dumps({'org': '933200353', 'wrong_domain_quarantined': True, 'known_run_passed': True}, indent=2))
          PY
      - name: Select fresh 300 excluding all previous 1300
        run: |
          cat entry-companies.jsonl known-validation-300.jsonl > exclude-1300.jsonl
          test "$(wc -l < exclude-1300.jsonl)" -eq 1300
          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude exclude-1300.jsonl \
            --count 300 \
            --seed 20260916 \
            --evaluation-split h1c_secondary_confirmation \
            --sample-slice fresh_external_precision_validation \
            --output fresh-validation-300.jsonl \
            --report fresh-validation-selection.json
          uv run python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('fresh-validation-selection.json').read_text())
          assert report['count'] == 300, report
          assert report['excluded_rows'] == 1300, report
          assert report['overlap_count'] == 0, report
          print(json.dumps(report, indent=2))
          PY
      - name: Run evaluator on fresh disjoint 300
        run: |
          uv run python scripts/run_signalpost_final.py \
            --organisations fresh-validation-300.jsonl \
            --bulk brreg-enheter.csv \
            --output out/fresh-final.jsonl \
            --report out/fresh-run-report.json \
            --work-dir out/fresh-work \
            --run-id h1c-secondary-fresh-validation \
            --expected-count 300 \
            --workers 8 \
            --site-timeout 6 \
            --max-challenge-requests 5400 \
            --max-third-party-cost-usd 0 \
            --max-wall-runtime-seconds 2400
      - name: Extract fresh verified-site audit list and verify gates
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          selection = json.loads(Path('fresh-validation-selection.json').read_text())
          report = json.loads(Path('out/fresh-run-report.json').read_text())
          profiles = [json.loads(line) for line in Path('out/fresh-work/profiles.jsonl').read_text().splitlines() if line.strip()]
          final_rows = [json.loads(line) for line in Path('out/fresh-final.jsonl').read_text().splitlines() if line.strip()]
          assert selection['overlap_count'] == 0
          assert len(final_rows) == 300
          assert len({row['organisation_number'] for row in final_rows}) == 300
          assert all(row['run']['terminal_status'] == 'completed' for row in final_rows)
          assert report['passed'] is True, report
          assert report['request_budget']['observed_conservative_challenge_request_charge'] <= 5400
          assert report['request_budget']['theoretical_challenge_request_charge_ceiling'] == 5400
          assert report['source_policy']['third_party_cost_usd'] == 0.0
          assert report['source_policy']['search_api_requests'] == 0
          assert report['source_policy']['experimental_connectors_enabled'] is False
          assert report['contract_errors'] == []
          assert report['change_errors'] == []
          assert report['budget_errors'] == []
          audit = []
          for profile in profiles:
              website = (profile.get('evidence') or {}).get('website') or {}
              value = website.get('value') or {}
              identity = value.get('identity_assessment') or {}
              if website.get('status') != 'available' or not identity.get('publishable'):
                  continue
              audit.append({
                  'organisation_number': profile.get('organisation_number'),
                  'name': profile.get('name'),
                  'municipality': profile.get('municipality'),
                  'website': value.get('final_url') or website.get('source_url'),
                  'source_type': website.get('source_type'),
                  'content_sha256': website.get('content_sha256'),
                  'identity_assessment': identity,
                  'secondary_identity_page': value.get('secondary_identity_page'),
              })
          Path('out/fresh-verified-sites.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, separators=(',', ':')) + '\n' for row in audit),
              encoding='utf-8',
          )
          summary = {
              'validation_companies': 300,
              'excluded_previous_companies': selection['excluded_rows'],
              'entry_manifest_overlap': selection['overlap_count'],
              'verified_sites': len(audit),
              'observed_logical_requests': report['request_budget']['observed_logical_requests'],
              'observed_conservative_requests': report['request_budget']['observed_conservative_challenge_request_charge'],
              'normalized_conservative_requests_per_100': round(report['request_budget']['observed_conservative_challenge_request_charge'] / 3, 3),
              'wall_runtime_seconds': report['runtime']['wall_runtime_seconds'],
              'third_party_cost_usd': report['source_policy']['third_party_cost_usd'],
              'contract_errors': len(report['contract_errors']),
              'budget_errors': len(report['budget_errors']),
          }
          Path('out/fresh-summary.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY
      - name: Upload H1c secondary qualification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h1c-secondary-qualification
          if-no-files-found: error
          retention-days: 30
          path: |
            signalpost-universe.sha256
            brreg-enheter.sha256
            entry-companies.jsonl
            known-validation-300.jsonl
            known-validation-selection.json
            exclude-1300.jsonl
            fresh-validation-300.jsonl
            fresh-validation-selection.json
            out/known-run-report.json
            out/known-work/profiles.jsonl
            out/fresh-final.jsonl
            out/fresh-run-report.json
            out/fresh-work/profiles.jsonl
            out/fresh-verified-sites.jsonl
            out/fresh-summary.json
