name: Phase 1 Fresh Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - phase1/lost-claim-registry-live
    paths:
      - "src/norway_company_agent/official.py"
      - "src/norway_company_agent/v2_registry_projection.py"
      - "src/norway_company_agent/registry_narrative.py"
      - "src/norway_company_agent/canonical_projection.py"
      - "scripts/verify_phase1_fresh.py"
      - ".github/workflows/phase1-fresh-qualification.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-fresh-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-fresh-100:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          command -v pdftoppm
          command -v tesseract

      - name: Sync and regressions
        run: |
          uv sync --locked
          uv run --with pytest pytest -q

      - name: Download frozen universe and current BRREG snapshot
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://builderr.ai/signalpost-company-universe-2025.jsonl.gz' \
            --output signalpost-universe.jsonl.gz
          gzip -t signalpost-universe.jsonl.gz
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 240 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          test -s brreg-enheter.csv

      - name: Restore historical qualification manifests through C12 M5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p archived/h2e archived/h2g1 archived/h2g2 archived/v4screen archived/v4narrative archived/v5 archived/c12m5
          gh run download 35051402737 --repo navadeep-17/signal-post --name h2e-registry-workforce-qualification --dir archived/h2e
          gh run download 35092456045 --repo navadeep-17/signal-post --name h2g-annual-workforce-qualification --dir archived/h2g1
          gh run download 35104937900 --repo navadeep-17/signal-post --name h2g-annual-workforce-qualification-v2 --dir archived/h2g2
          gh run download 36873654739 --repo navadeep-17/signal-post --name v4-official-source-screen --dir archived/v4screen
          gh run download 36884650475 --repo navadeep-17/signal-post --name v4-registry-narrative-fresh-qualification --dir archived/v4narrative
          gh run download 36892430561 --repo navadeep-17/signal-post --name v5-brreg-change-production-qualification --dir archived/v5
          gh run download 37183847186 --repo navadeep-17/signal-post --name c12-m5-combined-measurement-100 --dir archived/c12m5
          echo 'fdf402093fa87e65103c9e5b9e8d26db15b0027da4a4504deb7f575117afa5bb  archived/v4screen/v4-source-screen-20.jsonl' | sha256sum -c -
          echo '9fe3953a1978e73281d0159a1886aaf81397b29106d9c6b19df085b18cca6ffe  archived/v4narrative/v4-registry-fresh-100.jsonl' | sha256sum -c -
          echo 'a7a18aab77f9c7192ba5e55b31e5dd225718a20b6b0f6d036fb78a2a524d412d  archived/v5/v5-change-fresh-100.jsonl' | sha256sum -c -
          echo '5bfb49418a1ae692b3145d2d2afe22e598067e5f6dfbcd31b0ecb35845a77ac0  archived/c12m5/c12-m5-fresh-100.jsonl' | sha256sum -c -

      - name: Recreate historical exclusions through V4
        run: |
          set -euo pipefail
          uv run python scripts/freeze_final_release_1000.py \
            --universe signalpost-universe.jsonl.gz \
            --h1e-recovered validation/h1e-fresh-300-exclusion.jsonl \
            --h2e archived/h2e/fresh-h2e-300.jsonl \
            --h2g1 archived/h2g1/fresh-h2g-300.jsonl \
            --h2g2 archived/h2g2/fresh-h2g-v2-300.jsonl \
            --output-dir release-freeze \
            --release-seed 20261002
          echo '80e8f5c88b2d2facc1a00c20677a0930240f40fc75a36a27bee16c54efa2de26  release-freeze/final-release-1000.jsonl' | sha256sum -c -
          cat release-freeze/exclude-5900.jsonl release-freeze/final-release-1000.jsonl > exclude-6900.jsonl

          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz --exclude exclude-6900.jsonl \
            --count 100 --seed 20261003 \
            --evaluation-split v3_annual_description_zero_overlap \
            --sample-slice fresh_annual_report_intelligence_validation \
            --output v3-tuning-100.jsonl --report v3-tuning-100-selection.json
          echo '2da901382ea417ebbfb73fc935295b6a8fa76b2d48e6be8f7efe5ba24671d43e  v3-tuning-100.jsonl' | sha256sum -c -
          cat exclude-6900.jsonl v3-tuning-100.jsonl > exclude-7000.jsonl

          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz --exclude exclude-7000.jsonl \
            --count 100 --seed 20261004 \
            --evaluation-split v3_annual_description_confirmation \
            --sample-slice fresh_annual_report_intelligence_transfer \
            --output v3-confirmation-100.jsonl --report v3-confirmation-100-selection.json
          echo '9571c54439db6d1cc1f79e03e48bc4f6c400be4899fdfbf37b1be97ee3b86d1f  v3-confirmation-100.jsonl' | sha256sum -c -
          cat exclude-7000.jsonl v3-confirmation-100.jsonl > exclude-7100.jsonl

          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz --exclude exclude-7100.jsonl \
            --count 100 --seed 20261005 \
            --evaluation-split v3_annual_description_final_confirmation \
            --sample-slice fresh_annual_report_intelligence_final_transfer \
            --output v3-final-100.jsonl --report v3-final-100-selection.json
          echo 'a9e093f6c1dfdc13010c7ca684db17a75cd827542fd7f7fc5ba8fe4b5db5a118  v3-final-100.jsonl' | sha256sum -c -
          cat exclude-7100.jsonl v3-final-100.jsonl > exclude-7200.jsonl
          cat exclude-7200.jsonl archived/v4screen/v4-source-screen-20.jsonl > exclude-7220.jsonl
          cat exclude-7220.jsonl archived/v4narrative/v4-registry-fresh-100.jsonl > exclude-7320.jsonl
          test "$(wc -l < exclude-7320.jsonl)" -eq 7320
          UNIQUE_COUNT="$(python -c "import json,pathlib; rows=[json.loads(x) for x in pathlib.Path('exclude-7320.jsonl').read_text().splitlines() if x.strip()]; print(len({str(r['organisation_number']) for r in rows}))")"
          test "$UNIQUE_COUNT" -eq 7320

      - name: Union V5 and C12 M5 consumed cohorts into exclusion manifest
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          sources = {
              'through_v4': Path('exclude-7320.jsonl'),
              'v5': Path('archived/v5/v5-change-fresh-100.jsonl'),
              'c12_m5': Path('archived/c12m5/c12-m5-fresh-100.jsonl'),
          }
          sets = {}
          rows = {}
          for label, path in sources.items():
              orgs = set()
              for line in path.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  item = json.loads(line)
                  org = ''.join(ch for ch in str(item.get('organisation_number') or '') if ch.isdigit())
                  if len(org) != 9:
                      raise SystemExit(f'invalid organisation number in {path}: {item!r}')
                  orgs.add(org)
                  rows.setdefault(org, {'organisation_number': org})
              sets[label] = orgs
          assert len(sets['through_v4']) == 7320, len(sets['through_v4'])
          assert len(sets['v5']) == 100, len(sets['v5'])
          assert len(sets['c12_m5']) == 100, len(sets['c12_m5'])
          assert not (sets['through_v4'] & sets['v5']), 'V5 qualification must be disjoint from through-V4 exclusions'
          assert not (sets['v5'] & sets['c12_m5']), 'V5 and C12 M5 explicit cohorts unexpectedly overlap'
          union = set().union(*sets.values())
          Path('phase1-fresh-exclude.jsonl').write_text(
              ''.join(json.dumps(rows[org], separators=(',', ':')) + '\n' for org in sorted(union)),
              encoding='utf-8',
          )
          report = {
              'through_v4': len(sets['through_v4']),
              'v5': len(sets['v5']),
              'c12_m5': len(sets['c12_m5']),
              'c12_overlap_through_v4': len(sets['c12_m5'] & sets['through_v4']),
              'v5_overlap_c12_m5': len(sets['v5'] & sets['c12_m5']),
              'union_unique': len(union),
          }
          assert 7420 <= len(union) <= 7520, report
          Path('phase1-fresh-exclusion-report.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY

      - name: Freeze untouched Phase 1 qualification 100
        run: |
          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude phase1-fresh-exclude.jsonl \
            --count 100 \
            --seed 20261009 \
            --evaluation-split phase1_lost_claim_recovery_confirmation \
            --sample-slice fresh_exact_live_registry_recall_transfer \
            --output phase1-fresh-100.jsonl \
            --report phase1-fresh-100-selection.json
          uv run python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('phase1-fresh-100-selection.json').read_text())
          assert report['count'] == 100, report
          assert report['overlap_count'] == 0, report
          assert report['seed'] == 20261009, report
          print(json.dumps(report, indent=2))
          PY
          sha256sum phase1-fresh-100.jsonl > phase1-fresh-100.sha256

      - name: Run actual V8 evaluator path on untouched cohort
        run: |
          mkdir -p out
          uv run python scripts/run_signalpost_v8.py \
            --organisations phase1-fresh-100.jsonl \
            --bulk brreg-enheter.csv \
            --output out/phase1-fresh-output.jsonl \
            --report out/phase1-fresh-report.json \
            --product-output out/phase1-fresh-product.html \
            --work-dir out/phase1-fresh-work \
            --run-id phase1-fresh-qualification-100 \
            --workers 8 \
            --site-timeout 6 \
            --wikidata-timeout 8 \
            --max-challenge-requests 2000 \
            --max-third-party-cost-usd 0 \
            --max-wall-runtime-seconds 2400 \
            --annual-workforce-workers 4 \
            --annual-workforce-timeout 60 \
            --annual-workforce-min-start-interval 2.1 \
            --annual-workforce-ocr-pages 8 \
            --annual-workforce-ocr-dpi 110

      - name: Verify exact evidence transfer and hard gates
        run: |
          uv run python scripts/verify_phase1_fresh.py \
            --input out/phase1-fresh-output.jsonl \
            --report out/phase1-fresh-report.json \
            --output out/phase1-fresh-summary.json \
            --audit out/phase1-fresh-manual-audit.jsonl

      - name: Hash qualification deliverables
        run: |
          sha256sum \
            phase1-fresh-exclude.jsonl \
            phase1-fresh-exclusion-report.json \
            phase1-fresh-100.jsonl \
            phase1-fresh-100.sha256 \
            phase1-fresh-100-selection.json \
            out/phase1-fresh-output.jsonl \
            out/phase1-fresh-report.json \
            out/phase1-fresh-product.html \
            out/phase1-fresh-work/profiles.jsonl \
            out/phase1-fresh-summary.json \
            out/phase1-fresh-manual-audit.jsonl \
            > out/phase1-fresh-deliverables.sha256

      - name: Upload fresh qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-fresh-qualification-100
          retention-days: 90
          if-no-files-found: warn
          path: |
            phase1-fresh-exclusion-report.json
            phase1-fresh-100.jsonl
            phase1-fresh-100.sha256
            phase1-fresh-100-selection.json
            out/phase1-fresh-output.jsonl
            out/phase1-fresh-report.json
            out/phase1-fresh-product.html
            out/phase1-fresh-work/profiles.jsonl
            out/phase1-fresh-summary.json
            out/phase1-fresh-manual-audit.jsonl
            out/phase1-fresh-deliverables.sha256
