name: V2 Manifest Sidecar

on:
  push:
    branches:
      - revision/v2-canonical-product
    paths:
      - submission/manifest.json
      - .github/workflows/v2-manifest-sidecar.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revision/v2-canonical-product
          fetch-depth: 0
      - name: Refresh manifest SHA-256 sidecar
        run: |
          sha256sum submission/manifest.json | sed 's#submission/##' > submission/manifest.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission/manifest.sha256
          if git diff --cached --quiet; then
            echo "Sidecar already current."
            exit 0
          fi
          git commit -m "build(v2): refresh submission manifest sidecar"
          git push origin HEAD:revision/v2-canonical-product
