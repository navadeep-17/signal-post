name: Research Patentstyret Anonymous Org Query Probe

on:
  push:
    branches:
      - research/bulk-exact-org-recall
    paths:
      - .github/workflows/research-patentstyret-anonymous-org-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Probe public common-search with known organisation numbers
        run: |
          mkdir -p out
          BASE='https://search.patentstyret.no/api/search/common'
          for SPEC in \
            'known-example|912355683' \
            'patentstyret-self|971526157' \
            'two-org-or|912355683%20OR%20971526157'; do
            NAME="${SPEC%%|*}"
            QUERY="${SPEC#*|}"
            URL="${BASE}?query=${QUERY}"
            CODE="$(curl --silent --show-error --location --compressed \
              --user-agent 'Signalpost-research-source-screen/1.0' \
              --header 'Accept: application/json' \
              --connect-timeout 10 --max-time 30 \
              --write-out '%{http_code}' "$URL" -o "out/${NAME}.json" || true)"
            echo "=== ${NAME} http=${CODE} ==="
            python - "${NAME}" <<'PY'
          import json, sys
          from pathlib import Path
          name=sys.argv[1]
          p=Path(f'out/{name}.json')
          if not p.exists():
              print('no-body')
              raise SystemExit
          text=p.read_text(encoding='utf-8',errors='replace')
          print('bytes=',len(text))
          try:
              data=json.loads(text)
          except Exception:
              print(text[:16000])
              raise SystemExit
          print(json.dumps(data,ensure_ascii=False,indent=2)[:30000])
          PY
          done

      - name: Cleanup
        if: always()
        run: rm -rf out
