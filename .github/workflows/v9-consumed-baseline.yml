name: V9 Consumed Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/v9-external-recall
    paths:
      - scripts/build_v9_baseline.py
      - tests/test_v9_baseline.py
      - docs/V9_EXTERNAL_RECALL_HANDOFF.md
      - .github/workflows/v9-consumed-baseline.yml

permissions:
  contents: read
  actions: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      CONSUMED_RUN_ID: '37314396820'
      CONSUMED_ARTIFACT: 'phase11-owner-veto-consumed-replay'
      CONSUMED_MANIFEST_SHA256: '394eaae1b43fbe5e951fc4a61c7185c068bfa6dad1d37a7223cefc507429dd99'
      V9_BASELINE_SEED: 'v9-baseline-20261006'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr unzip

      - name: Sync and run V9 baseline tests
        run: |
          uv sync --locked
          uv run --with pytest pytest -q tests/test_v9_baseline.py tests/test_v8_dynamic_batch_wrapper.py

      - name: Recover already-consumed 100-company manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p consumed
          gh run download "${CONSUMED_RUN_ID}"             --repo navadeep-17/signal-post             --name "${CONSUMED_ARTIFACT}"             --dir consumed
          MANIFEST="$(find consumed -type f -name 'phase11-fresh-100.jsonl' | head -n 1)"
          if [ -z "$MANIFEST" ]; then
            echo 'Consumed Phase 11 manifest not found' >&2
            exit 1
          fi
          cp "$MANIFEST" v9-consumed-100.jsonl
          test "$(wc -l < v9-consumed-100.jsonl)" -eq 100
          echo "${CONSUMED_MANIFEST_SHA256}  v9-consumed-100.jsonl" | sha256sum -c -

      - name: Download current BRREG snapshot
        run: |
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 240             'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv'             --output brreg-enheter.csv
          test -s brreg-enheter.csv
          sha256sum brreg-enheter.csv > brreg-enheter.sha256

      - name: Run frozen V8 evaluator on consumed cohort
        run: |
          mkdir -p out/v9-baseline
          uv run python scripts/run_signalpost_v8.py             --organisations v9-consumed-100.jsonl             --bulk brreg-enheter.csv             --output out/v9-baseline/output.jsonl             --report out/v9-baseline/run-report.json             --product-output out/v9-baseline/product.html             --work-dir out/v9-baseline/work             --run-id v9-consumed-baseline             --expected-count 100             --workers 8             --site-timeout 6             --wikidata-timeout 8             --max-challenge-requests 2000             --max-third-party-cost-usd 0             --max-wall-runtime-seconds 2400             --annual-workforce-workers 4             --annual-workforce-timeout 60             --annual-workforce-min-start-interval 2.1             --annual-workforce-ocr-pages 8             --annual-workforce-ocr-dpi 110             --support-registry-timeout 420             --support-lookback-days 365             --support-events-per-company 5

      - name: Build deterministic V9 unresolved-site baseline
        run: |
          uv run python scripts/build_v9_baseline.py             --output-contract out/v9-baseline/output.jsonl             --manifest v9-consumed-100.jsonl             --run-report out/v9-baseline/run-report.json             --report out/v9-baseline/baseline.json             --unresolved-manifest out/v9-baseline/unresolved-sites.jsonl             --gate-a-manifest out/v9-baseline/gate-a-20.jsonl             --seed "${V9_BASELINE_SEED}"             --gate-a-size 20             --expected-companies 100

      - name: Verify Phase 0 / WP1 invariants
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from norway_company_agent.output_contract import validate_contract_object

          rows = [
              json.loads(line)
              for line in Path('out/v9-baseline/output.jsonl').read_text().splitlines()
              if line.strip()
          ]
          report = json.loads(Path('out/v9-baseline/run-report.json').read_text())
          baseline = json.loads(Path('out/v9-baseline/baseline.json').read_text())
          gate_a = [
              json.loads(line)
              for line in Path('out/v9-baseline/gate-a-20.jsonl').read_text().splitlines()
              if line.strip()
          ]

          assert report['passed'] is True, report
          assert len(rows) == 100
          assert len({row['organisation_number'] for row in rows}) == 100
          assert all((row.get('run') or {}).get('terminal_status') == 'completed' for row in rows)
          assert not [
              (row['organisation_number'], errors)
              for row in rows
              if (errors := validate_contract_object(row))
          ]

          policy = baseline['corpus_policy']
          assert policy['kind'] == 'consumed_dev', policy
          assert policy['fresh_qualification_credit'] is False, policy
          assert policy['source_company_count'] == 100, policy
          assert policy['gate_a_company_count'] == 20, policy
          assert policy['unresolved_company_count'] >= 20, policy
          assert len(gate_a) == 20

          gate_metrics = baseline['gate_a_unresolved_metrics']
          assert gate_metrics['verified_website_companies'] == 0, gate_metrics

          ops = baseline['operations']
          assert ops['observed_conservative_requests'] <= 2000, ops
          assert ops['theoretical_conservative_request_ceiling'] <= 2000, ops
          assert ops['wall_runtime_seconds'] <= 2400, ops
          assert ops['third_party_api_cost_usd'] == 0.0, ops
          assert ops['search_api_requests'] == 0, ops

          print(json.dumps(baseline, ensure_ascii=False, indent=2))
          PY

      - name: Upload V9 consumed baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-consumed-baseline
          retention-days: 90
          if-no-files-found: error
          path: |
            v9-consumed-100.jsonl
            brreg-enheter.sha256
            out/v9-baseline/output.jsonl
            out/v9-baseline/run-report.json
            out/v9-baseline/baseline.json
            out/v9-baseline/unresolved-sites.jsonl
            out/v9-baseline/gate-a-20.jsonl
            out/v9-baseline/product.html
            out/v9-baseline/work/profiles.jsonl
