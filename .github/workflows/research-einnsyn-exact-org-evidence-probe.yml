name: Research eInnsyn Exact-Org Evidence Probe

on:
  push:
    branches:
      - research/bulk-exact-org-recall
    paths:
      - .github/workflows/research-einnsyn-exact-org-evidence-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Locate exact org evidence paths and recent filtering
        run: |
          mkdir -p out
          python - <<'PY'
          import datetime as dt
          import json
          import urllib.parse
          import urllib.request
          import urllib.error
          from pathlib import Path

          ORG="923609016"
          BASE="https://api.einnsyn.no/search"
          CUTOFF=(dt.date(2026,10,6)-dt.timedelta(days=365)).isoformat()

          def fetch(params):
              url=BASE+"?"+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={
                  "Accept":"application/json",
                  "User-Agent":"Signalpost-research-source-screen/1.0",
              })
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read(); status=r.status
              except urllib.error.HTTPError as e:
                  raw=e.read(); status=e.code
              try: data=json.loads(raw.decode("utf-8-sig")) if raw else {}
              except Exception: data={}
              return status,data,len(raw)

          def paths(obj,target,path="root"):
              out=[]
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      out += paths(v,target,f"{path}.{k}")
              elif isinstance(obj,list):
                  for i,v in enumerate(obj):
                      out += paths(v,target,f"{path}[{i}]")
              elif isinstance(obj,str) and target in obj:
                  out.append((path,obj[:500]))
              return out

          cases={
              "all":{
                  "query":f'"{ORG}"',"entity":"Journalpost","limit":"5",
                  "sortBy":"publisertDato","sortOrder":"desc",
              },
              "recent365":{
                  "query":f'"{ORG}"',"entity":"Journalpost","limit":"5",
                  "sortBy":"publisertDato","sortOrder":"desc",
                  "publisertDatoFrom":CUTOFF,
              },
          }
          report={"screen_type":"einnsyn_exact_org_evidence_path_probe","cutoff":CUTOFF,"cases":{}}
          for name,params in cases.items():
              status,data,nbytes=fetch(params)
              items=data.get("items") if isinstance(data,dict) else []
              if not isinstance(items,list): items=[]
              evidence=[]
              dates=[]
              entities=[]
              for item in items:
                  if not isinstance(item,dict): continue
                  entities.append(str(item.get("entity") or ""))
                  for p,val in paths(item,ORG):
                      evidence.append({"path":p,"value_class":"contains_exact_org","value_length":len(val)})
                  for key in ("publisertDato","journaldato","dokumentetsDato","oppdatertDato"):
                      if item.get(key):
                          dates.append({"field":key,"value":str(item.get(key))[:80]})
              report["cases"][name]={
                  "http_status":status,
                  "bytes":nbytes,
                  "items":len(items),
                  "has_next":bool(data.get("next")) if isinstance(data,dict) else False,
                  "entities":sorted(set(entities)),
                  "exact_org_evidence_paths":evidence,
                  "date_fields":dates,
              }
          Path("out/report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: research-einnsyn-exact-org-evidence-probe
          retention-days: 30
          path: out/report.json
