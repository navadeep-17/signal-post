name: Phase 1 Fresh Disjoint 100

on:
  workflow_dispatch:
  push:
    branches:
      - phase1/lost-claim-registry-live
    paths:
      - ".github/workflows/phase1-fresh-disjoint-100.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-fresh-disjoint-100-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-fresh-100:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      HISTORICAL_EXCLUDE_SHA256: 5f5560498fa22a15a24a74ab05ebbba820cc20cf9a164cd5fa007ee898deb17c
      CAREERS_TRANSFER_SHA256: 1d50c3eddb91004c6413ffd263e25b166b9ec822cceae9c9bb8c0908edd997b3
      C12_M5_FRESH_SHA256: 5bfb49418a1ae692b3145d2d2afe22e598067e5f6dfbcd31b0ecb35845a77ac0
      C12_M5_EXCLUDE_SHA256: 7ee37918ef5958c12ced721d7c8cf4342541fc71844b8894ccf7aa3a5c676086
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          command -v pdftoppm
          command -v tesseract

      - name: Sync and run regressions
        run: |
          uv sync --locked
          uv run --with pytest pytest -q

      - name: Download public universe and current BRREG bulk
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 240 \
            'https://builderr.ai/signalpost-company-universe-2025.jsonl.gz' \
            --output signalpost-universe.jsonl.gz
          gzip -t signalpost-universe.jsonl.gz
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 240 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          test -s brreg-enheter.csv

      - name: Restore frozen historical manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p archived/h2e archived/h2g1 archived/h2g2 archived/v4screen archived/v4narrative archived/v5 archived/v6rejected archived/v6c archived/v6ddev archived/v6dtransfer archived/v6e archived/v6i archived/m2c archived/c12m5
          gh run download 35051402737 --repo navadeep-17/signal-post --name h2e-registry-workforce-qualification --dir archived/h2e
          gh run download 35092456045 --repo navadeep-17/signal-post --name h2g-annual-workforce-qualification --dir archived/h2g1
          gh run download 35104937900 --repo navadeep-17/signal-post --name h2g-annual-workforce-qualification-v2 --dir archived/h2g2
          gh run download 36873654739 --repo navadeep-17/signal-post --name v4-official-source-screen --dir archived/v4screen
          gh run download 36884650475 --repo navadeep-17/signal-post --name v4-registry-narrative-fresh-qualification --dir archived/v4narrative
          gh run download 36892430561 --repo navadeep-17/signal-post --name v5-brreg-change-production-qualification --dir archived/v5
          gh run download 36912683196 --repo navadeep-17/signal-post --name v6-domain-recall-development --dir archived/v6rejected
          gh run download 36963913555 --repo navadeep-17/signal-post --name v6c-candidate-ranking-development --dir archived/v6c
          gh run download 36967544569 --repo navadeep-17/signal-post --name v6d-first-party-depth-development --dir archived/v6ddev
          gh run download 36978734059 --repo navadeep-17/signal-post --name v6d-first-party-depth-transfer --dir archived/v6dtransfer
          gh run download 36995728296 --repo navadeep-17/signal-post --name v6e-zero-network-social-transfer --dir archived/v6e
          gh run download 37050077407 --repo navadeep-17/signal-post --name v6i-registry-contact-transfer --dir archived/v6i
          gh run download 37094118245 --repo navadeep-17/signal-post --name v7-m2c-homepage-careers-transfer --dir archived/m2c
          gh run download 37183847186 --repo navadeep-17/signal-post --name c12-m5-combined-measurement-100 --dir archived/c12m5
          gh api repos/navadeep-17/signal-post/git/blobs/00f2470f9d8c9eb102cf4d0c19be37534fdbffef --jq '.content' | tr -d '\n' | base64 --decode > historical-h1e-fresh-300-exclusion.jsonl
          test "$(git hash-object historical-h1e-fresh-300-exclusion.jsonl)" = "00f2470f9d8c9eb102cf4d0c19be37534fdbffef"
          uv run python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('historical-h1e-fresh-300-exclusion.jsonl').read_text().splitlines() if x.strip()]
          orgs=[str(row['organisation_number']) for row in rows]
          assert len(rows)==300 and len(set(orgs))==300, (len(rows),len(set(orgs)))
          PY
          echo "$CAREERS_TRANSFER_SHA256  archived/m2c/v7-m2c-transfer-100.jsonl" | sha256sum -c -
          echo "$C12_M5_FRESH_SHA256  archived/c12m5/c12-m5-fresh-100.jsonl" | sha256sum -c -
          echo "$C12_M5_EXCLUDE_SHA256  archived/c12m5/c12-m5-exclude.jsonl" | sha256sum -c -

      - name: Recreate exact 8020-company historical exclusion chain
        run: |
          set -euo pipefail
          uv run python scripts/freeze_final_release_1000.py \
            --universe signalpost-universe.jsonl.gz \
            --h1e-recovered historical-h1e-fresh-300-exclusion.jsonl \
            --h2e archived/h2e/fresh-h2e-300.jsonl \
            --h2g1 archived/h2g1/fresh-h2g-300.jsonl \
            --h2g2 archived/h2g2/fresh-h2g-v2-300.jsonl \
            --output-dir release-freeze --release-seed 20261002
          echo '80e8f5c88b2d2facc1a00c20677a0930240f40fc75a36a27bee16c54efa2de26  release-freeze/final-release-1000.jsonl' | sha256sum -c -
          cat release-freeze/exclude-5900.jsonl release-freeze/final-release-1000.jsonl > exclude-6900.jsonl
          uv run python scripts/select_disjoint_validation_batch.py --universe signalpost-universe.jsonl.gz --exclude exclude-6900.jsonl --count 100 --seed 20261003 --evaluation-split v3a --sample-slice v3a --output v3a.jsonl --report v3a.json
          cat exclude-6900.jsonl v3a.jsonl > exclude-7000.jsonl
          uv run python scripts/select_disjoint_validation_batch.py --universe signalpost-universe.jsonl.gz --exclude exclude-7000.jsonl --count 100 --seed 20261004 --evaluation-split v3b --sample-slice v3b --output v3b.jsonl --report v3b.json
          cat exclude-7000.jsonl v3b.jsonl > exclude-7100.jsonl
          uv run python scripts/select_disjoint_validation_batch.py --universe signalpost-universe.jsonl.gz --exclude exclude-7100.jsonl --count 100 --seed 20261005 --evaluation-split v3c --sample-slice v3c --output v3c.jsonl --report v3c.json
          cat exclude-7100.jsonl v3c.jsonl > exclude-7200.jsonl
          cat exclude-7200.jsonl archived/v4screen/v4-source-screen-20.jsonl > exclude-7220.jsonl
          cat exclude-7220.jsonl archived/v4narrative/v4-registry-fresh-100.jsonl > exclude-7320.jsonl
          cat exclude-7320.jsonl archived/v5/v5-change-fresh-100.jsonl > exclude-7420.jsonl
          cat exclude-7420.jsonl archived/v6rejected/v6-dev-50.jsonl > exclude-7470.jsonl
          cat exclude-7470.jsonl archived/v6c/v6c-dev-50.jsonl > exclude-7520.jsonl
          cat exclude-7520.jsonl archived/v6ddev/v6d-dev-100.jsonl > exclude-7620.jsonl
          cat exclude-7620.jsonl archived/v6dtransfer/v6d-transfer-100.jsonl > exclude-7720.jsonl
          cat exclude-7720.jsonl archived/v6e/v6e-transfer-100.jsonl > exclude-7820.jsonl
          cat exclude-7820.jsonl archived/v6i/v6i-transfer-100.jsonl > exclude-7920.jsonl
          echo "$HISTORICAL_EXCLUDE_SHA256  exclude-7920.jsonl" | sha256sum -c -
          cat exclude-7920.jsonl archived/m2c/v7-m2c-transfer-100.jsonl > exclude-8020.jsonl
          uv run python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('exclude-8020.jsonl').read_text().splitlines() if x.strip()]
          orgs=[str(row['organisation_number']) for row in rows]
          assert len(rows)==8020 and len(set(orgs))==8020, (len(rows),len(set(orgs)))
          PY

      - name: Build de-duplicated all-touched exclusion union
        run: |
          uv run python - <<'PY'
          import hashlib, json
          from pathlib import Path
          sources = [
              Path('exclude-8020.jsonl'),
              Path('archived/c12m5/c12-m5-exclude.jsonl'),
              Path('archived/c12m5/c12-m5-fresh-100.jsonl'),
          ]
          rows = {}
          source_counts = {}
          for path in sources:
              source_orgs = set()
              for line in path.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  item = json.loads(line)
                  org = ''.join(ch for ch in str(item.get('organisation_number') or '') if ch.isdigit())
                  assert len(org) == 9, (path, item)
                  source_orgs.add(org)
                  rows.setdefault(org, {'organisation_number': org})
              source_counts[str(path)] = len(source_orgs)
          out = Path('phase1-fresh-exclude.jsonl')
          out.write_text(''.join(json.dumps(rows[org], separators=(',', ':')) + '\n' for org in sorted(rows)), encoding='utf-8')
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          report = {
              'source_unique_counts': source_counts,
              'union_unique_companies': len(rows),
              'sha256': digest,
          }
          assert source_counts['exclude-8020.jsonl'] == 8020, report
          assert source_counts['archived/c12m5/c12-m5-exclude.jsonl'] == 2305, report
          assert source_counts['archived/c12m5/c12-m5-fresh-100.jsonl'] == 100, report
          assert 8020 <= len(rows) <= 10425, report
          Path('phase1-fresh-exclude-report.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY

      - name: Freeze fresh disjoint Phase 1 cohort
        run: |
          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude phase1-fresh-exclude.jsonl \
            --count 100 \
            --seed 20261101 \
            --evaluation-split phase1_fresh_disjoint_qualification \
            --sample-slice exact_registry_claim_transfer \
            --output phase1-fresh-100.jsonl \
            --report phase1-fresh-selection.json
          uv run python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('phase1-fresh-selection.json').read_text())
          assert report['count']==100, report
          assert report['overlap_count']==0, report
          assert report['seed']==20261101, report
          rows=[json.loads(x) for x in Path('phase1-fresh-100.jsonl').read_text().splitlines() if x.strip()]
          orgs=[str(x['organisation_number']) for x in rows]
          assert len(rows)==100 and len(set(orgs))==100, (len(rows),len(set(orgs)))
          excluded={str(json.loads(x)['organisation_number']) for x in Path('phase1-fresh-exclude.jsonl').read_text().splitlines() if x.strip()}
          assert not (set(orgs) & excluded)
          print(json.dumps(report, indent=2))
          PY
          sha256sum phase1-fresh-100.jsonl > phase1-fresh-100.sha256

      - name: Run actual V8 evaluator path
        run: |
          mkdir -p out
          uv run python scripts/run_signalpost_v8.py \
            --organisations phase1-fresh-100.jsonl \
            --bulk brreg-enheter.csv \
            --output out/phase1-output.jsonl \
            --report out/phase1-report.json \
            --product-output out/phase1-product.html \
            --work-dir out/phase1-work \
            --run-id phase1-fresh-disjoint-100 \
            --workers 8 \
            --site-timeout 6 \
            --wikidata-timeout 8 \
            --max-third-party-cost-usd 0 \
            --annual-workforce-workers 4 \
            --annual-workforce-timeout 60 \
            --annual-workforce-min-start-interval 2.1 \
            --annual-workforce-ocr-pages 8 \
            --annual-workforce-ocr-dpi 110

      - name: Summarize evaluator-visible Phase 1 coverage
        run: |
          uv run python scripts/summarize_phase1_e2e.py \
            --input out/phase1-output.jsonl \
            --run-report out/phase1-report.json \
            --summary out/phase1-summary.json
          uv run python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('out/phase1-summary.json').read_text())
          assert summary['passed'] is True, summary
          assert summary['claim_company_coverage']['registration_date'] >= 95, summary
          assert summary['claim_company_coverage']['registered_address'] >= 95, summary
          assert summary['claim_company_coverage']['company_description'] >= 95, summary
          assert summary['claim_company_coverage']['registered_purpose'] >= 90, summary
          assert summary['claim_company_coverage']['registered_contact_email'] >= 20, summary
          assert summary['claim_company_coverage']['registered_phone'] >= 10, summary
          assert summary['claim_company_coverage']['registered_mobile'] >= 10, summary
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Verify exact live BRREG evidence on fresh cohort
        run: |
          uv run python scripts/verify_phase1_fresh.py \
            --input out/phase1-output.jsonl \
            --report out/phase1-report.json \
            --output out/phase1-fresh-verification.json \
            --audit out/phase1-fresh-evidence-audit.jsonl

      - name: Hash deliverables
        run: |
          sha256sum \
            phase1-fresh-exclude.jsonl \
            phase1-fresh-exclude-report.json \
            phase1-fresh-100.jsonl \
            phase1-fresh-selection.json \
            out/phase1-output.jsonl \
            out/phase1-report.json \
            out/phase1-product.html \
            out/phase1-work/profiles.jsonl \
            out/phase1-summary.json \
            out/phase1-fresh-verification.json \
            out/phase1-fresh-evidence-audit.jsonl \
            > out/phase1-fresh-e2e.sha256

      - name: Upload Phase 1 fresh qualification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-fresh-disjoint-100
          retention-days: 30
          if-no-files-found: warn
          path: |
            phase1-fresh-exclude.jsonl
            phase1-fresh-exclude-report.json
            phase1-fresh-100.jsonl
            phase1-fresh-100.sha256
            phase1-fresh-selection.json
            out/phase1-output.jsonl
            out/phase1-report.json
            out/phase1-product.html
            out/phase1-work/profiles.jsonl
            out/phase1-summary.json
            out/phase1-fresh-verification.json
            out/phase1-fresh-evidence-audit.jsonl
            out/phase1-fresh-e2e.sha256
