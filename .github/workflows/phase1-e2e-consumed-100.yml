name: Phase 1 E2E Consumed 100

on:
  workflow_dispatch:
  push:
    branches:
      - phase1/lost-claim-registry-live
    paths:
      - "src/norway_company_agent/official.py"
      - "src/norway_company_agent/v2_registry_projection.py"
      - "src/norway_company_agent/registry_narrative.py"
      - "src/norway_company_agent/canonical_projection.py"
      - "scripts/summarize_phase1_e2e.py"
      - ".github/workflows/phase1-e2e-consumed-100.yml"

permissions:
  contents: read

concurrency:
  group: phase1-e2e-consumed-100-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-consumed-100:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          command -v pdftoppm
          command -v tesseract

      - name: Sync and run regressions
        run: |
          uv sync --locked
          uv run --with pytest pytest -q

      - name: Download official BRREG snapshot and Builderr universe
        run: |
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 240 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://builderr.ai/signalpost-company-universe-2025.jsonl.gz' \
            --output signalpost-universe.jsonl.gz
          test -s brreg-enheter.csv
          test -s signalpost-universe.jsonl.gz
          gzip -t signalpost-universe.jsonl.gz

      - name: Recreate already-consumed C12 M5 cohort
        run: |
          uv run python select_entry_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --count 1000 \
            --seed 20260823 \
            --output entry-companies.jsonl
          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude entry-companies.jsonl \
            --count 300 \
            --seed 20260915 \
            --output prior-validation-300.jsonl \
            --report prior-validation-300-selection.json
          uv run python - <<'PY'
          import json
          from pathlib import Path

          rows = {}
          for path in (
              Path('entry-companies.jsonl'),
              Path('prior-validation-300.jsonl'),
              Path('submission/final-release-1000.jsonl'),
          ):
              for line in path.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  item = json.loads(line)
                  org = ''.join(ch for ch in str(item.get('organisation_number') or '') if ch.isdigit())
                  if len(org) == 9:
                      rows.setdefault(org, {'organisation_number': org})
          for org in ('811730912', '813396092', '838797172', '938702675', '982897327'):
              rows.setdefault(org, {'organisation_number': org})
          Path('phase1-consumed-exclude.jsonl').write_text(
              ''.join(json.dumps(rows[org], separators=(',', ':')) + '\n' for org in sorted(rows)),
              encoding='utf-8',
          )
          PY
          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude phase1-consumed-exclude.jsonl \
            --count 100 \
            --seed 20261004 \
            --evaluation-split c12_m5_fresh_validation \
            --sample-slice combined_m1_m4_transfer \
            --output phase1-consumed-100.jsonl \
            --report phase1-consumed-selection.json
          uv run python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('phase1-consumed-selection.json').read_text())
          assert report['count'] == 100, report
          assert report['overlap_count'] == 0, report
          assert report['seed'] == 20261004, report
          assert report['output_sha256'] == '5bfb49418a1ae692b3145d2d2afe22e598067e5f6dfbcd31b0ecb35845a77ac0', report
          PY

      - name: Run actual V8 evaluator path
        run: |
          mkdir -p out
          uv run python scripts/run_signalpost_v8.py \
            --organisations phase1-consumed-100.jsonl \
            --bulk brreg-enheter.csv \
            --output out/phase1-output.jsonl \
            --report out/phase1-report.json \
            --product-output out/phase1-product.html \
            --work-dir out/phase1-work \
            --run-id phase1-e2e-consumed-100 \
            --workers 8 \
            --site-timeout 6 \
            --wikidata-timeout 8 \
            --max-third-party-cost-usd 0 \
            --annual-workforce-workers 4 \
            --annual-workforce-timeout 60 \
            --annual-workforce-min-start-interval 2.1 \
            --annual-workforce-ocr-pages 8 \
            --annual-workforce-ocr-dpi 110

      - name: Summarize evaluator-visible coverage gain
        run: |
          uv run python scripts/summarize_phase1_e2e.py \
            --input out/phase1-output.jsonl \
            --run-report out/phase1-report.json \
            --summary out/phase1-summary.json
          uv run python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('out/phase1-summary.json').read_text())
          assert summary['passed'] is True, summary
          assert summary['claim_company_coverage']['registration_date'] >= 95, summary
          assert summary['claim_company_coverage']['registered_address'] >= 95, summary
          assert summary['claim_company_coverage']['company_description'] >= 95, summary
          assert summary['claim_company_coverage']['registered_purpose'] >= 90, summary
          assert summary['claim_company_coverage']['registered_contact_email'] >= 20, summary
          assert summary['claim_company_coverage']['registered_phone'] >= 10, summary
          assert summary['claim_company_coverage']['registered_mobile'] >= 10, summary
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Hash deliverables
        run: |
          sha256sum \
            phase1-consumed-100.jsonl \
            phase1-consumed-selection.json \
            out/phase1-output.jsonl \
            out/phase1-report.json \
            out/phase1-product.html \
            out/phase1-work/profiles.jsonl \
            out/phase1-summary.json \
            > out/phase1-e2e.sha256

      - name: Upload Phase 1 end-to-end result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-e2e-consumed-100
          retention-days: 30
          if-no-files-found: warn
          path: |
            phase1-consumed-100.jsonl
            phase1-consumed-selection.json
            out/phase1-output.jsonl
            out/phase1-report.json
            out/phase1-product.html
            out/phase1-work/profiles.jsonl
            out/phase1-summary.json
            out/phase1-e2e.sha256
