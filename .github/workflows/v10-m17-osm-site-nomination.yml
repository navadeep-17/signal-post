name: V10 M17 OSM Site Nomination Screen

on:
  push:
    branches:
      - experiment/v10-m17-osm-site-nomination
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v10-m17-osm-site-nomination
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}/src
  FROZEN_CONSUMED_SOURCE_SHA256: 80e8f5c88b2d2facc1a00c20677a0930240f40fc75a36a27bee16c54efa2de26
  BRREG_SNAPSHOT_SHA256: 1145bc28c54c6fe10be3a89e529a35832fd67cb34cd9933c0f4418d446512615
  NOMINATIM_USER_AGENT: "Signalpost-Hackathon-Research/1.0 (https://github.com/navadeep-17/signal-post)"

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install locked runtime and OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          uv sync --locked

      - name: Run focused M17 tests and compile
        run: |
          uv run --with pytest pytest -q tests/test_v10_m17_osm_site_nomination.py
          python -m py_compile \
            src/norway_company_agent/osm_site_nomination.py \
            scripts/build_v10_m17_consumed_cohort.py \
            scripts/screen_v10_m17_osm_site_nomination.py

      - name: Verify immutable upstream artifacts
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10508036929" --jq .digest)" = \
            'sha256:2f0fbb29ccb7c71b6b593f7e041b3ba4353256674cb404dfc2ebf56f50964a47'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11393772677" --jq .digest)" = \
            'sha256:b7dd01b666470d155d2c70274bb8d1cb2695abc9d2f331d6a41eafe447c023f8'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11459496712" --jq .digest)" = \
            'sha256:01e100b09c5e71d630facaab2fdcc006767c3c241d0e3450ac8d8075cbf21e98'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11478129358" --jq .digest)" = \
            'sha256:fb33af0c411848cb2f9a8a37610dc8953afe12e1c9c19d5636767002a0e12f69'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11482816122" --jq .digest)" = \
            'sha256:e89e9f2d7294dea39168743e246ac680ed32dc9e5aad7039f01ff7ee54ff90fb'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11483268561" --jq .digest)" = \
            'sha256:3e25ab6b869eaf87d7e213d00378e19a4413dd0dcf01ad0058a942324213ae32'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11495058383" --jq .digest)" = \
            'sha256:5cb2fefbf99933316b529fec15d0839ae86e0e6a4280b6b95ba5feb5bb1e00b7'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11496698758" --jq .digest)" = \
            'sha256:7d6f04be0d5f15afe9707389475b63bdbf8ee0289aaa9092ac53348ee0a539a3'

      - name: Recover frozen consumed source, BRREG snapshot and prior cohorts
        run: |
          set -euo pipefail
          mkdir -p frozen/source frozen/pr137 frozen/m10 frozen/m13 frozen/m14 frozen/m14b frozen/m15 frozen/m16

          gh run download 35246833190 --repo "$GITHUB_REPOSITORY" \
            --name final-release-manifest-1000 --dir frozen/source
          SOURCE="$(find frozen/source -type f -name 'final-release-1000.jsonl' | head -n 1)"
          test -n "$SOURCE"
          cp "$SOURCE" frozen/consumed-1000.jsonl
          test "$(sha256sum frozen/consumed-1000.jsonl | awk '{print $1}')" = "$FROZEN_CONSUMED_SOURCE_SHA256"

          gh run download 37421325313 --repo "$GITHUB_REPOSITORY" \
            --name v9-consumed-baseline --dir frozen/pr137
          PR137="$(find frozen/pr137 -type f -name 'gate-a-20.jsonl' | head -n 1)"
          test -n "$PR137"
          cp "$PR137" frozen/pr137-gate-a-20.jsonl

          gh run download 37567829642 --repo "$GITHUB_REPOSITORY" \
            --name v9-m10-gate-b-frozen-inputs --dir frozen/m10
          BULK="$(find frozen/m10 -type f -name 'brreg-enheter.csv' | head -n 1)"
          M10="$(find frozen/m10 -type f -name 'gate-b-100.jsonl' | head -n 1)"
          test -n "$BULK"
          test -n "$M10"
          cp "$BULK" frozen/brreg-enheter.csv
          cp "$M10" frozen/m10-gate-b-100.jsonl
          test "$(sha256sum frozen/brreg-enheter.csv | awk '{print $1}')" = "$BRREG_SNAPSHOT_SHA256"

          gh run download 37612496445 --repo "$GITHUB_REPOSITORY" \
            --name v9-m13-frozen-cohort --dir frozen/m13
          M13="$(find frozen/m13 -type f -name 'm13-consumed-100.jsonl' | head -n 1)"
          test -n "$M13"
          cp "$M13" frozen/m13-consumed-100.jsonl

          gh run download 37622216471 --repo "$GITHUB_REPOSITORY" \
            --name v9-m14-frozen-inputs --dir frozen/m14
          M14="$(find frozen/m14 -type f -name 'm14-consumed-100.jsonl' | head -n 1)"
          test -n "$M14"
          cp "$M14" frozen/m14-consumed-100.jsonl

          gh run download 37624617561 --repo "$GITHUB_REPOSITORY" \
            --name v9-m14b-frozen-inputs --dir frozen/m14b
          M14B="$(find frozen/m14b -type f -name 'm14b-consumed-100.jsonl' | head -n 1)"
          test -n "$M14B"
          cp "$M14B" frozen/m14b-consumed-100.jsonl

          gh run download 37648478667 --repo "$GITHUB_REPOSITORY" \
            --name v10-m15-consumed-annual-report-site-screen --dir frozen/m15
          M15="$(find frozen/m15 -type f -name 'm15-consumed-20.jsonl' | head -n 1)"
          test -n "$M15"
          cp "$M15" frozen/m15-consumed-20.jsonl

          gh run download 37650996920 --repo "$GITHUB_REPOSITORY" \
            --name v10-m16-consumed-annual-report-bare-domain --dir frozen/m16
          M16="$(find frozen/m16 -type f -name 'm16-consumed-20.jsonl' | head -n 1)"
          test -n "$M16"
          cp "$M16" frozen/m16-consumed-20.jsonl

      - name: Freeze disjoint consumed M17 20 before any OSM query
        run: |
          uv run python scripts/build_v10_m17_consumed_cohort.py \
            --source-manifest frozen/consumed-1000.jsonl \
            --bulk frozen/brreg-enheter.csv \
            --m13b-base-exclude frozen/pr137-gate-a-20.jsonl \
            --m13b-base-exclude frozen/m13-consumed-100.jsonl \
            --m13b-base-exclude frozen/m14-consumed-100.jsonl \
            --m13b-base-exclude frozen/m14b-consumed-100.jsonl \
            --extra-exclude frozen/m10-gate-b-100.jsonl \
            --extra-exclude frozen/m15-consumed-20.jsonl \
            --extra-exclude frozen/m16-consumed-20.jsonl \
            --output frozen/m17-consumed-20.jsonl \
            --report frozen/m17-cohort-report.json \
            --count 20

          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("frozen/m17-cohort-report.json").read_text())
          assert r["selected_companies"] == 20, r
          assert r["fresh_companies_used"] == 0, r
          assert r["eligible_after_exclusions"] >= 20, r
          assert r["reconstructed_m13b_companies_excluded"] == 100, r
          assert r["reconstructed_m13b_manifest_sha256"] == "eddd8ed807f1116a3fd2d780b21796d546717fd3a27ee7983d8a89d14d891cbe", r
          print({
              "selected_companies": r["selected_companies"],
              "eligible_after_exclusions": r["eligible_after_exclusions"],
              "fresh_companies_used": r["fresh_companies_used"],
              "target_manifest_sha256": r["target_manifest_sha256"],
              "registry_snapshot_sha256": r["registry_snapshot_sha256"],
          })
          PY

      - name: Run exact qualified V8 baseline on identical 20
        run: |
          mkdir -p baseline/work
          uv run python scripts/run_signalpost_v8.py \
            --organisations frozen/m17-consumed-20.jsonl \
            --bulk frozen/brreg-enheter.csv \
            --output baseline/output.jsonl \
            --report baseline/report.json \
            --product-output baseline/product.html \
            --work-dir baseline/work \
            --run-id v10-m17-baseline \
            --expected-count 20 \
            --workers 8 --site-timeout 6 --wikidata-timeout 8 \
            --max-challenge-requests 2000 \
            --max-third-party-cost-usd 0 \
            --max-wall-runtime-seconds 2400 \
            --annual-workforce-workers 4 \
            --annual-workforce-timeout 60 \
            --annual-workforce-min-start-interval 2.1 \
            --annual-workforce-ocr-pages 8 \
            --annual-workforce-ocr-dpi 110 \
            --support-registry-timeout 420 \
            --support-lookback-days 365 \
            --support-events-per-company 5

      - name: Screen OSM/Nominatim website nominations
        env:
          NOMINATIM_BASE_URL: https://nominatim.openstreetmap.org
        run: |
          mkdir -p result
          uv run python scripts/screen_v10_m17_osm_site_nomination.py \
            --manifest frozen/m17-consumed-20.jsonl \
            --bulk frozen/brreg-enheter.csv \
            --baseline-output baseline/output.jsonl \
            --output result/m17-screen.jsonl \
            --report result/m17-report.json \
            --nominatim-audit result/m17-nominatim-audit.jsonl \
            --manual-audit result/m17-manual-audit.jsonl \
            --nominatim-min-interval-seconds 1.05 \
            --nominatim-timeout 12 \
            --site-timeout 6

      - name: Enforce predeclared M17 decision contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("result/m17-report.json").read_text())
          assert r["companies"] == 20, r
          assert r["fresh_companies_used"] == 0, r
          assert r["minimum_net_new_verified_website_companies"] == 2, r
          assert r["third_party_api_cost_usd"] == 0, r
          assert r["search_engine_api_requests"] == 0, r
          assert r["nominatim_single_threaded"] is True, r
          assert r["nominatim_min_interval_seconds"] >= 1.0, r
          assert r["nominatim_results_cached_in_artifact"] is True, r
          assert r["nominatim_provider_switchable"] is True, r
          assert r["nominatim_attribution"], r
          assert not r["source_errors"], r
          assert not r["evidence_defects"], r
          assert r["publication_authorized"] is False, r
          assert r["production_promotion_authorized"] is False, r
          assert r["fresh_qualification_authorized"] is False, r
          assert r["production_policy_review_required"] is True, r
          assert r["machine_decision"] in {"SHELVE_LOW_YIELD", "MANUAL_AUDIT_REQUIRED"}, r
          print(json.dumps(r, indent=2, sort_keys=True))
          PY

      - name: Remove baseline UI/cache
        if: always()
        run: |
          rm -f baseline/product.html
          rm -rf baseline/work/internal-envelopes.jsonl

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v10-m17-consumed-osm-site-screen
          retention-days: 30
          if-no-files-found: warn
          path: |
            frozen/m17-consumed-20.jsonl
            frozen/m17-cohort-report.json
            result/
            baseline/report.json
