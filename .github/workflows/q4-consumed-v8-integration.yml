name: Q4 Consumed V8 Integration Replay

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/q4-first-party-feed-activity
    paths:
      - '.github/workflows/q4-consumed-v8-integration.yml'
      - 'scripts/run_signalpost_v8.py'
      - 'src/norway_company_agent/first_party_feed.py'
      - 'src/norway_company_agent/first_party_feed_contract.py'
      - 'src/norway_company_agent/h1g_hyphenated_no_recall.py'
      - 'tests/test_q4_first_party_feed.py'
      - 'tests/test_q4_feed_projection_hardening.py'

permissions:
  contents: read
  actions: read

jobs:
  replay-consumed-100:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr unzip

      - name: Sync and run Q4 regressions
        run: |
          uv sync --locked
          uv run --with pytest pytest -q \
            tests/test_q4_first_party_feed.py \
            tests/test_q4_feed_projection_hardening.py \
            tests/test_h1g_hyphenated_no_recall.py \
            tests/test_h1g_final_runner_integration.py \
            tests/test_v8_dynamic_batch_wrapper.py

      - name: Recover already-consumed Phase 11 cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p consumed
          gh run download 37314396820 \
            --repo navadeep-17/signal-post \
            --name phase11-owner-veto-consumed-replay \
            --dir consumed
          MANIFEST="$(find consumed -type f -name 'phase11-fresh-100.jsonl' | head -n 1)"
          if [ -z "$MANIFEST" ]; then
            echo 'Consumed Phase 11 manifest not found' >&2
            exit 1
          fi
          cp "$MANIFEST" phase11-consumed-100.jsonl
          test "$(wc -l < phase11-consumed-100.jsonl)" -eq 100
          echo '394eaae1b43fbe5e951fc4a61c7185c068bfa6dad1d37a7223cefc507429dd99  phase11-consumed-100.jsonl' | sha256sum -c -

      - name: Download current BRREG snapshot
        run: |
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 240 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          test -s brreg-enheter.csv

      - name: Run current V8 with Q4 on consumed cohort
        run: |
          mkdir -p out/q4-replay
          uv run python scripts/run_signalpost_v8.py \
            --organisations phase11-consumed-100.jsonl \
            --bulk brreg-enheter.csv \
            --output out/q4-replay/output.jsonl \
            --report out/q4-replay/report.json \
            --product-output out/q4-replay/product.html \
            --work-dir out/q4-replay/work \
            --run-id q4-consumed-v8-integration \
            --expected-count 100 \
            --workers 8 \
            --site-timeout 6 \
            --wikidata-timeout 8 \
            --max-challenge-requests 2000 \
            --max-third-party-cost-usd 0 \
            --max-wall-runtime-seconds 2400 \
            --annual-workforce-workers 4 \
            --annual-workforce-timeout 60 \
            --annual-workforce-min-start-interval 2.1 \
            --annual-workforce-ocr-pages 8 \
            --annual-workforce-ocr-dpi 110 \
            --support-registry-timeout 420 \
            --support-lookback-days 365 \
            --support-events-per-company 5

      - name: Verify Q4 production integration and evidence
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          rows = [json.loads(line) for line in Path('out/q4-replay/output.jsonl').read_text().splitlines() if line.strip()]
          profiles = [json.loads(line) for line in Path('out/q4-replay/work/profiles.jsonl').read_text().splitlines() if line.strip()]
          report = json.loads(Path('out/q4-replay/report.json').read_text())

          assert report['passed'] is True, report
          assert len(rows) == 100
          assert len({row['organisation_number'] for row in rows}) == 100
          assert all((row.get('run') or {}).get('terminal_status') == 'completed' for row in rows)
          assert report['request_budget']['theoretical_challenge_request_charge_ceiling'] == 2000, report['request_budget']
          assert report['request_budget']['observed_conservative_challenge_request_charge'] <= 2000, report['request_budget']
          assert report['source_policy']['third_party_cost_usd'] == 0.0
          assert report['q4_feed_activity']['max_site_logical_requests_per_profile_unchanged'] == 4
          assert report['q4_feed_activity']['published_claims'] >= 1, report['q4_feed_activity']
          assert report['q4_feed_activity']['companies_with_published_claims'] >= 1, report['q4_feed_activity']
          assert report['checks']['q4_feed_projection_contract_valid'] is True
          assert report['checks']['canonical_projection_valid'] is True
          assert report['checks']['synthesis_valid'] is True
          assert report['checks']['q4_workspace_rebuild_valid'] is True

          org = '936252494'  # PUBSPILL AS, positive consumed Q4 screen control.
          row = next(item for item in rows if str(item.get('organisation_number')) == org)
          profile = next(item for item in profiles if str(item.get('organisation_number')) == org)
          feed = (profile.get('evidence') or {}).get('website_activity_feed') or {}
          assert feed.get('status') == 'available', feed
          assert str(feed.get('source_url') or '').rstrip('/') == 'https://www.pubspill.no/feed', feed
          assert len(str(feed.get('content_sha256') or '')) == 64, feed

          claims = [
              claim for claim in row.get('claims') or []
              if claim.get('field') == 'external.company_update' and claim.get('availability') == 'available'
          ]
          assert claims, row
          evidence_by_id = {item.get('id'): item for item in row.get('evidence') or []}
          for claim in claims:
              value = claim.get('value') or {}
              assert value.get('title'), claim
              assert value.get('url'), claim
              assert value.get('published_date'), claim
              for evidence_id in claim.get('evidence_ids') or []:
                  evidence = evidence_by_id[evidence_id]
                  if evidence.get('extraction_method') != 'verified_same_site_rss_atom_entry_v1':
                      continue
                  assert str(evidence.get('source_url') or '').rstrip('/') == 'https://www.pubspill.no/feed', evidence
                  assert len(str(evidence.get('content_sha256') or '')) == 64, evidence
                  assert evidence.get('effective_at') == value.get('published_date'), (evidence, value)
                  assert (evidence.get('identity_proof') or {}).get('publishable') is True, evidence

          canonical = row.get('canonical_profile') or {}
          public_activity = ((canonical.get('public_activity') or {}).get('company_updates') or [])
          assert public_activity, canonical

          summary = {
              'status': 'PASS_CONSUMED_ONLY',
              'fresh_qualification': False,
              'companies': len(rows),
              'q4_published_claims': report['q4_feed_activity']['published_claims'],
              'q4_published_companies': report['q4_feed_activity']['companies_with_published_claims'],
              'pubspill_claims': len(claims),
              'observed_conservative_requests': report['request_budget']['observed_conservative_challenge_request_charge'],
              'theoretical_conservative_ceiling': report['request_budget']['theoretical_challenge_request_charge_ceiling'],
              'third_party_cost_usd': report['source_policy']['third_party_cost_usd'],
          }
          Path('out/q4-replay/summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload Q4 consumed integration replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q4-consumed-v8-integration-replay
          retention-days: 30
          if-no-files-found: error
          path: |
            phase11-consumed-100.jsonl
            out/q4-replay/output.jsonl
            out/q4-replay/report.json
            out/q4-replay/summary.json
            out/q4-replay/product.html
            out/q4-replay/work/profiles.jsonl
