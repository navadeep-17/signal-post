name: Research Mattilsynet Smilefjes Schema Probe

on:
  push:
    branches:
      - research/bulk-exact-org-recall
    paths:
      - .github/workflows/research-mattilsynet-smilefjes-schema-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download current complete Smilefjes CSV once
        run: |
          mkdir -p out
          curl --fail --location --compressed \
            --header 'Accept: text/csv,*/*' \
            --user-agent 'Signalpost-research-source-screen/1.0' \
            'https://smilefjes.mattilsynet.no/api/tilsyn.csv' \
            --output out/tilsyn.csv
          test -s out/tilsyn.csv
          wc -c out/tilsyn.csv
          sha256sum out/tilsyn.csv

      - name: Inspect encoding delimiter and bounded rows
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, io, re

          raw = Path('out/tilsyn.csv').read_bytes()
          print('bytes:', len(raw))
          print('bom-prefix:', raw[:4])

          encodings = ['utf-8-sig', 'utf-8', 'latin-1']
          decoded = None
          used = None
          for enc in encodings:
              try:
                  decoded = raw.decode(enc)
                  used = enc
                  break
              except UnicodeDecodeError:
                  pass
          if decoded is None:
              raise SystemExit('could not decode source')
          print('encoding:', used)

          sample = decoded[:200000]
          try:
              dialect = csv.Sniffer().sniff(sample, delimiters=';,\t|')
              delimiter = dialect.delimiter
          except csv.Error:
              delimiter = ';'
          print('delimiter:', repr(delimiter))

          reader = csv.DictReader(io.StringIO(decoded), delimiter=delimiter)
          print('headers:', reader.fieldnames)
          rows = []
          org_candidates = set()
          date_like = set()
          for i, row in enumerate(reader):
              if i < 8:
                  rows.append(row)
              for key, value in row.items():
                  v = str(value or '').strip()
                  if re.fullmatch(r'\d{9}', re.sub(r'\D', '', v)) and re.search(r'org|bedrift|foretak', str(key), flags=re.I):
                      org_candidates.add((str(key), v))
                  if re.search(r'dato|date', str(key), flags=re.I) and v:
                      date_like.add((str(key), v))
              if i >= 5000:
                  break
          print('bounded-org-candidates:', sorted(org_candidates)[:50])
          print('bounded-date-fields:', sorted(date_like)[:50])
          for idx, row in enumerate(rows, start=1):
              print('ROW', idx, row)
          PY

      - name: Remove source payload
        if: always()
        run: rm -f out/tilsyn.csv
