name: Phase A2 Consumed E2E

on:
  workflow_dispatch:
  push:
    branches:
      - feature/phaseb-idle-contact-enrichment
    paths:
      - "src/norway_company_agent/official.py"
      - "src/norway_company_agent/company_site_contact.py"
      - "src/norway_company_agent/external_contract.py"
      - "src/norway_company_agent/canonical_projection.py"
      - "src/norway_company_agent/v2_registry_projection.py"
      - "src/norway_company_agent/wikidata_discovery.py"
      - "tests/test_company_site_contact.py"
      - "tests/test_h2c_external_contract.py"
      - "tests/test_phase1b_postal_address_projection.py"
      - "tests/test_phasea2_exact_live_registry_recovery.py"
      - ".github/workflows/phaseb-consumed-e2e.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: phasea2-consumed-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumed-phase1-100:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          command -v pdftoppm
          command -v tesseract

      - name: Sync and run regressions
        run: |
          uv sync --locked
          uv run --with pytest pytest -q

      - name: Restore frozen consumed Phase 1 cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p consumed
          gh run download 37192494569 \
            --repo navadeep-17/signal-post \
            --name phase1-fresh-disjoint-100 \
            --dir consumed
          test -s consumed/phase1-fresh-100.jsonl
          echo '92fc871ee9c94a928908cf00f007aef67eea02fe788caf70e8e734e82bd76b5d  consumed/phase1-fresh-100.jsonl' | sha256sum -c -

      - name: Download current BRREG bulk
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 240 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          test -s brreg-enheter.csv

      - name: Run actual V8 evaluator path on consumed cohort
        run: |
          mkdir -p out
          uv run python scripts/run_signalpost_v8.py \
            --organisations consumed/phase1-fresh-100.jsonl \
            --bulk brreg-enheter.csv \
            --output out/phasea2-output.jsonl \
            --report out/phasea2-report.json \
            --product-output out/phasea2-product.html \
            --work-dir out/phasea2-work \
            --run-id phasea2-consumed-phase1-100 \
            --workers 8 \
            --site-timeout 6 \
            --wikidata-timeout 8 \
            --max-third-party-cost-usd 0 \
            --annual-workforce-workers 4 \
            --annual-workforce-timeout 60 \
            --annual-workforce-min-start-interval 2.1 \
            --annual-workforce-ocr-pages 8 \
            --annual-workforce-ocr-dpi 110

      - name: Verify Phase A2 coverage, evidence and unchanged request theorem
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          def read_jsonl(path):
              return [json.loads(line) for line in Path(path).read_text(encoding='utf-8').splitlines() if line.strip()]

          rows=read_jsonl('out/phasea2-output.jsonl')
          profiles=read_jsonl('out/phasea2-work/profiles.jsonl')
          report=json.loads(Path('out/phasea2-report.json').read_text(encoding='utf-8'))
          assert len(rows)==100 and len(profiles)==100, (len(rows),len(profiles))
          assert report['passed'] is True, report.get('checks')
          assert not report.get('contract_errors'), report.get('contract_errors')
          assert not (report.get('canonical_projection') or {}).get('validation_errors'), report.get('canonical_projection')
          assert not (report.get('synthesis') or {}).get('validation_errors'), report.get('synthesis')

          rb=report['request_budget']
          assert rb['official_logical_requests_per_profile_ceiling']==5, rb
          assert rb['site_logical_requests_per_profile_ceiling']==4, rb
          assert rb['total_logical_requests_per_profile_ceiling']==9, rb
          assert rb['theoretical_challenge_request_charge_ceiling'] <= 2000, rb
          assert rb['max_challenge_requests']==2000, rb
          assert rb['observed_conservative_challenge_request_charge'] <= 2000, rb
          assert report['source_policy']['third_party_cost_usd']==0.0, report['source_policy']
          assert report['source_policy']['search_api_requests']==0, report['source_policy']

          exact_fields={
              'foundation_date':('/stiftelsesdato','foundation_date','company.foundation_date'),
              'registered_in_enterprise_register':('/registrertIForetaksregisteret','registered_in_enterprise_register','company.registered_in_enterprise_register'),
              'enterprise_register_date':('/registreringsdatoForetaksregisteret','enterprise_register_date','company.enterprise_register_date'),
              'institutional_sector':('/institusjonellSektorkode','institutional_sector','company.institutional_sector'),
              'registered_capital':('/kapital','registered_capital','company.registered_capital'),
              'registered_in_vat_register':('/registrertIMvaregisteret','registered_in_vat_register','company.registered_in_vat_register'),
              'vat_registration_date':('/registreringsdatoMerverdiavgiftsregisteret','vat_registration_date','company.vat_registration_date'),
              'postal_address':('/postadresse','postal_address','company.postal_address'),
          }
          coverage={field:set() for field in exact_fields}
          external_phone_companies=set()
          external_email_companies=set()
          registered_phone_companies=set()
          evidence_errors=[]

          for row in rows:
              org=str(row['organisation_number'])
              evidence={str(item.get('id')):item for item in row.get('evidence') or [] if item.get('id')}
              canonical_facts=row.get('canonical_facts') or []
              for claim in row.get('claims') or []:
                  if claim.get('availability')!='available':
                      continue
                  field=str(claim.get('field') or '')
                  if field=='external.contact_phone':
                      external_phone_companies.add(org)
                  if field=='external.contact_email':
                      external_email_companies.add(org)
                  if field in {'registered_phone','registered_mobile'}:
                      registered_phone_companies.add(org)
                  if field not in exact_fields:
                      continue
                  coverage[field].add(org)
                  source_path,fact_type,canonical_field=exact_fields[field]
                  refs=claim.get('evidence_ids') or []
                  if len(refs)!=1:
                      evidence_errors.append((org,field,'expected exactly one evidence id'))
                      continue
                  item=evidence.get(str(refs[0]))
                  if not item:
                      evidence_errors.append((org,field,'missing evidence object'))
                      continue
                  if item.get('source_class')!='official':
                      evidence_errors.append((org,field,'non-official source class'))
                  if item.get('source_field')!=source_path:
                      evidence_errors.append((org,field,f"source path {item.get('source_field')!r}"))
                  if item.get('source_row_key')!=org:
                      evidence_errors.append((org,field,'source row mismatch'))
                  if not str(item.get('source_url') or '').endswith('/'+org):
                      evidence_errors.append((org,field,'source URL is not exact-org entity endpoint'))
                  if len(str(item.get('content_sha256') or ''))!=64:
                      evidence_errors.append((org,field,'missing content hash'))
                  matches=[fact for fact in canonical_facts if fact.get('type')==fact_type]
                  if len(matches)!=1:
                      evidence_errors.append((org,field,f'canonical count {len(matches)}'))
                  else:
                      fact=matches[0]
                      if fact.get('canonical_field')!=canonical_field or fact.get('value')!=claim.get('value'):
                          evidence_errors.append((org,field,'canonical value/field mismatch'))

          assert not evidence_errors, evidence_errors[:20]
          # These are the broad fields the Phase-A audit found in the already-fetched exact
          # BRREG entity response. We require broad transfer on this consumed cohort, not a
          # single benchmark-specific hit.
          assert len(coverage['foundation_date']) >= 90, len(coverage['foundation_date'])
          assert len(coverage['registered_in_enterprise_register']) >= 95, len(coverage['registered_in_enterprise_register'])
          assert len(coverage['enterprise_register_date']) >= 90, len(coverage['enterprise_register_date'])
          assert len(coverage['institutional_sector']) >= 90, len(coverage['institutional_sector'])
          assert len(coverage['registered_capital']) >= 80, len(coverage['registered_capital'])
          assert len(coverage['registered_in_vat_register']) >= 95, len(coverage['registered_in_vat_register'])
          assert len(coverage['vat_registration_date']) >= 35, len(coverage['vat_registration_date'])
          assert len(coverage['postal_address']) >= 20, len(coverage['postal_address'])

          combined_phone=registered_phone_companies | external_phone_companies
          summary={
              'schema':'signalpost-phasea2-consumed-e2e-v1',
              'companies':len(rows),
              'terminal_companies':report['final_objects'],
              'phasea2_company_coverage':{field:len(orgs) for field,orgs in sorted(coverage.items())},
              'external_contact_phone_companies':len(external_phone_companies),
              'external_contact_email_companies':len(external_email_companies),
              'registered_phone_or_mobile_companies':len(registered_phone_companies),
              'combined_phone_family_companies':len(combined_phone),
              'evidence_errors':len(evidence_errors),
              'contract_errors':len(report.get('contract_errors') or []),
              'canonical_errors':len((report.get('canonical_projection') or {}).get('validation_errors') or []),
              'synthesis_errors':len((report.get('synthesis') or {}).get('validation_errors') or []),
              'request_budget':{
                  'observed_logical_requests':rb['observed_logical_requests'],
                  'observed_conservative_charge':rb['observed_conservative_challenge_request_charge'],
                  'theoretical_charge_ceiling':rb['theoretical_challenge_request_charge_ceiling'],
              },
              'runtime_seconds':report['runtime']['wall_runtime_seconds'],
              'third_party_cost_usd':0.0,
              'search_api_requests':0,
              'passed':True,
          }
          Path('out/phasea2-summary.json').write_text(json.dumps(summary,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,indent=2))
          PY

      - name: Hash deliverables
        run: |
          sha256sum \
            consumed/phase1-fresh-100.jsonl \
            out/phasea2-output.jsonl \
            out/phasea2-report.json \
            out/phasea2-work/profiles.jsonl \
            out/phasea2-summary.json \
            > out/phasea2-consumed-e2e.sha256

      - name: Upload consumed E2E result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phasea2-consumed-e2e
          retention-days: 30
          if-no-files-found: warn
          path: |
            consumed/phase1-fresh-100.jsonl
            out/phasea2-output.jsonl
            out/phasea2-report.json
            out/phasea2-work/profiles.jsonl
            out/phasea2-summary.json
            out/phasea2-consumed-e2e.sha256
