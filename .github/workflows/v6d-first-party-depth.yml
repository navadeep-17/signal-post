name: V6d First Party Depth Development

on:
  workflow_dispatch:
  push:
    branches:
      - "experiment/v6d-first-party-depth"
    paths:
      - "src/norway_company_agent/verified_site_depth.py"
      - "scripts/run_v6d_first_party_depth.py"
      - "tests/test_v6d_verified_site_depth.py"
      - ".github/workflows/v6d-first-party-depth.yml"

permissions:
  contents: read
  actions: read

jobs:
  exact-site-depth-fresh-100:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      BASELINE_SHA: 97af39c7943d6e72e3bcc45b649e111744e5673d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies and run V6d regressions
        run: |
          uv sync --locked
          uv run --with pytest pytest -q tests/test_v6d_verified_site_depth.py

      - name: Install OCR runtime and download public inputs
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://builderr.ai/signalpost-company-universe-2025.jsonl.gz' \
            --output signalpost-universe.jsonl.gz
          gzip -t signalpost-universe.jsonl.gz
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          test -s brreg-enheter.csv

      - name: Restore historical touched-company manifests through V6c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p archived/h2e archived/h2g1 archived/h2g2 archived/v4screen archived/v4narrative archived/v5 archived/v6rejected archived/v6c
          gh run download 35051402737 --repo navadeep-17/signal-post --name h2e-registry-workforce-qualification --dir archived/h2e
          gh run download 35092456045 --repo navadeep-17/signal-post --name h2g-annual-workforce-qualification --dir archived/h2g1
          gh run download 35104937900 --repo navadeep-17/signal-post --name h2g-annual-workforce-qualification-v2 --dir archived/h2g2
          gh run download 36873654739 --repo navadeep-17/signal-post --name v4-official-source-screen --dir archived/v4screen
          gh run download 36884650475 --repo navadeep-17/signal-post --name v4-registry-narrative-fresh-qualification --dir archived/v4narrative
          gh run download 36892430561 --repo navadeep-17/signal-post --name v5-brreg-change-production-qualification --dir archived/v5
          gh run download 36912683196 --repo navadeep-17/signal-post --name v6-domain-recall-development --dir archived/v6rejected
          gh run download 36963913555 --repo navadeep-17/signal-post --name v6c-candidate-ranking-development --dir archived/v6c
          git show 2c745ed22232a443fe2c9e8fc3f49a66c725be0e:validation/h1e-fresh-300-exclusion.jsonl > historical-h1e-fresh-300-exclusion.jsonl
          test -s archived/v6rejected/v6-dev-50.jsonl
          test -s archived/v6c/v6c-dev-50.jsonl

      - name: Recreate exact exclusion chain through V6c
        run: |
          set -euo pipefail
          uv run python scripts/freeze_final_release_1000.py \
            --universe signalpost-universe.jsonl.gz \
            --h1e-recovered historical-h1e-fresh-300-exclusion.jsonl \
            --h2e archived/h2e/fresh-h2e-300.jsonl \
            --h2g1 archived/h2g1/fresh-h2g-300.jsonl \
            --h2g2 archived/h2g2/fresh-h2g-v2-300.jsonl \
            --output-dir release-freeze \
            --release-seed 20261002
          echo '80e8f5c88b2d2facc1a00c20677a0930240f40fc75a36a27bee16c54efa2de26  release-freeze/final-release-1000.jsonl' | sha256sum -c -
          cat release-freeze/exclude-5900.jsonl release-freeze/final-release-1000.jsonl > exclude-6900.jsonl

          uv run python scripts/select_disjoint_validation_batch.py --universe signalpost-universe.jsonl.gz --exclude exclude-6900.jsonl --count 100 --seed 20261003 --evaluation-split v3a --sample-slice v3a --output v3a.jsonl --report v3a.json
          cat exclude-6900.jsonl v3a.jsonl > exclude-7000.jsonl
          uv run python scripts/select_disjoint_validation_batch.py --universe signalpost-universe.jsonl.gz --exclude exclude-7000.jsonl --count 100 --seed 20261004 --evaluation-split v3b --sample-slice v3b --output v3b.jsonl --report v3b.json
          cat exclude-7000.jsonl v3b.jsonl > exclude-7100.jsonl
          uv run python scripts/select_disjoint_validation_batch.py --universe signalpost-universe.jsonl.gz --exclude exclude-7100.jsonl --count 100 --seed 20261005 --evaluation-split v3c --sample-slice v3c --output v3c.jsonl --report v3c.json
          cat exclude-7100.jsonl v3c.jsonl > exclude-7200.jsonl
          cat exclude-7200.jsonl archived/v4screen/v4-source-screen-20.jsonl > exclude-7220.jsonl
          cat exclude-7220.jsonl archived/v4narrative/v4-registry-fresh-100.jsonl > exclude-7320.jsonl
          cat exclude-7320.jsonl archived/v5/v5-change-fresh-100.jsonl > exclude-7420.jsonl
          cat exclude-7420.jsonl archived/v6rejected/v6-dev-50.jsonl > exclude-7470.jsonl
          cat exclude-7470.jsonl archived/v6c/v6c-dev-50.jsonl > exclude-7520.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('exclude-7520.jsonl').read_text().splitlines() if x.strip()]
          orgs=[str(r['organisation_number']) for r in rows]
          assert len(rows)==7520 and len(set(orgs))==7520, (len(rows), len(set(orgs)))
          print({'excluded':len(rows),'unique':len(set(orgs))})
          PY

      - name: Freeze untouched V6d development 100
        run: |
          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude exclude-7520.jsonl \
            --count 100 --seed 20261011 \
            --evaluation-split v6d_first_party_depth_development \
            --sample-slice unseen_exact_site_depth \
            --output v6d-dev-100.jsonl --report v6d-dev-100-selection.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('v6d-dev-100-selection.json').read_text())
          assert report['count']==100 and report['overlap_count']==0 and report['excluded_rows']==7520, report
          print(json.dumps(report, indent=2))
          PY
          sha256sum v6d-dev-100.jsonl > v6d-dev-100.sha256

      - name: Run frozen V5 incumbent on exact V6d cohort
        run: |
          git worktree add baseline "$BASELINE_SHA"
          (cd baseline && uv sync --locked)
          mkdir -p out/v5
          (cd baseline && uv run python scripts/run_signalpost_v2.py \
            --organisations "$GITHUB_WORKSPACE/v6d-dev-100.jsonl" \
            --bulk "$GITHUB_WORKSPACE/brreg-enheter.csv" \
            --output "$GITHUB_WORKSPACE/out/v5/output.jsonl" \
            --report "$GITHUB_WORKSPACE/out/v5/report.json" \
            --work-dir "$GITHUB_WORKSPACE/out/v5/work" \
            --run-id v6d-dev100-v5 \
            --expected-count 100 --workers 8 --site-timeout 6 --wikidata-timeout 8 \
            --max-challenge-requests 2000 --max-third-party-cost-usd 0 --max-wall-runtime-seconds 1200 \
            --annual-workforce-workers 4 --annual-workforce-timeout 60 \
            --annual-workforce-min-start-interval 2.1 --annual-workforce-ocr-pages 8 --annual-workforce-ocr-dpi 110)

      - name: Compute bounded V6d request headroom
        id: budget
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r=json.load(open('out/v5/report.json'))
          baseline=int((r.get('request_budget') or {}).get('observed_conservative_challenge_request_charge') or 0)
          if baseline <= 0:
              raise SystemExit('Cannot resolve V5 conservative request charge')
          added=max(0,min(180,(2000-baseline)//2))
          if added < 2:
              raise SystemExit(f'No safe V6d request headroom: baseline_charge={baseline}')
          print(f'baseline_charge={baseline}')
          print(f'added_logical={added}')
          PY
          cat "$GITHUB_OUTPUT"

      - name: Run bounded V6d exact-site depth challenger
        run: |
          mkdir -p out/v6d
          uv run python scripts/run_v6d_first_party_depth.py \
            --input-profiles out/v5/work/profiles.jsonl \
            --report out/v6d/report.json \
            --new-facts out/v6d/new-facts.jsonl \
            --site-audit out/v6d/site-audit.jsonl \
            --timeout 6 \
            --max-added-logical-requests '${{ steps.budget.outputs.added_logical }}' \
            --max-requests-per-site 10 \
            --max-section-pages 4 \
            --max-detail-pages 2

      - name: Verify V6d evidence and compare production efficiency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from norway_company_agent.verified_site_depth import _same_registered_domain

          def rows(path):
              return [json.loads(x) for x in Path(path).read_text().splitlines() if x.strip()]

          profiles={str(r['organisation_number']):r for r in rows('out/v5/work/profiles.jsonl')}
          facts=rows('out/v6d/new-facts.jsonl')
          report=json.loads(Path('out/v6d/report.json').read_text())
          baseline_charge=int('${{ steps.budget.outputs.baseline_charge }}')
          combined=baseline_charge+int(report['conservative_request_charge_added'])
          assert combined <= 2000, (baseline_charge, report['conservative_request_charge_added'])
          assert report['third_party_api_cost_usd'] == 0.0
          assert report['automatic_identity_conflicts_published'] == 0
          for fact in facts:
              profile=profiles[fact['organisation_number']]
              website=(profile.get('evidence') or {}).get('website') or {}
              identity=((website.get('value') or {}).get('identity_assessment') or {})
              verified=((website.get('value') or {}).get('final_url') or website.get('source_url') or '')
              assert website.get('status')=='available' and identity.get('publishable')
              assert _same_registered_domain(str(fact['source_url']), str(verified)), fact
              assert len(str(fact['content_sha256']))==64, fact
              assert fact['requires_manual_audit_before_promotion'] is True
          summary={
              'cohort_count':100,
              'baseline_conservative_charge':baseline_charge,
              'combined_conservative_charge':combined,
              'v6d':report,
              'manual_audit_fact_count':len(facts),
              'decision_metric':'net-new accepted decision-useful facts / added conservative request charge',
              'promotion_rule':'No promotion until every new fact is manually audited and precision, request budget and material gain gates pass.',
          }
          Path('out/v6d-comparison.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Upload complete V6d experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6d-first-party-depth-development
          retention-days: 90
          if-no-files-found: warn
          path: |
            v6d-dev-100.jsonl
            v6d-dev-100.sha256
            v6d-dev-100-selection.json
            out/v5/output.jsonl
            out/v5/report.json
            out/v5/work/profiles.jsonl
            out/v6d/report.json
            out/v6d/new-facts.jsonl
            out/v6d/site-audit.jsonl
            out/v6d-comparison.json
