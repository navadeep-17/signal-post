name: V4 Official Source Reach Screen

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/v4-official-activity-sources"
    paths:
      - "scripts/screen_support_registry_reach.py"
      - "tests/test_v4_support_registry_screen.py"
      - ".github/workflows/v4-official-source-screen.yml"
      - "docs/V4_OFFICIAL_SOURCE_SCREEN.md"

permissions:
  contents: read
  actions: read

jobs:
  screen-support-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync and regressions
        run: |
          uv sync --locked
          uv run --with pytest pytest -q tests/test_v4_support_registry_screen.py

      - name: Download frozen universe
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://builderr.ai/signalpost-company-universe-2025.jsonl.gz' \
            --output signalpost-universe.jsonl.gz
          gzip -t signalpost-universe.jsonl.gz
          sha256sum signalpost-universe.jsonl.gz > signalpost-universe.sha256

      - name: Download archived qualification manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p archived/h2e archived/h2g1 archived/h2g2
          gh run download 35051402737 --repo navadeep-17/signal-post --name h2e-registry-workforce-qualification --dir archived/h2e
          gh run download 35092456045 --repo navadeep-17/signal-post --name h2g-annual-workforce-qualification --dir archived/h2g1
          gh run download 35104937900 --repo navadeep-17/signal-post --name h2g-annual-workforce-qualification-v2 --dir archived/h2g2

      - name: Recreate pre-V3 exclusion chain
        run: |
          uv run python scripts/freeze_final_release_1000.py \
            --universe signalpost-universe.jsonl.gz \
            --h1e-recovered validation/h1e-fresh-300-exclusion.jsonl \
            --h2e archived/h2e/fresh-h2e-300.jsonl \
            --h2g1 archived/h2g1/fresh-h2g-300.jsonl \
            --h2g2 archived/h2g2/fresh-h2g-v2-300.jsonl \
            --output-dir release-freeze \
            --release-seed 20261002
          echo '80e8f5c88b2d2facc1a00c20677a0930240f40fc75a36a27bee16c54efa2de26  release-freeze/final-release-1000.jsonl' | sha256sum -c -
          cat release-freeze/exclude-5900.jsonl release-freeze/final-release-1000.jsonl > exclude-6900.jsonl
          test "$(wc -l < exclude-6900.jsonl)" -eq 6900

      - name: Recreate all consumed V3 cohorts
        run: |
          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude exclude-6900.jsonl \
            --count 100 \
            --seed 20261003 \
            --evaluation-split v3_annual_description_zero_overlap \
            --sample-slice fresh_annual_report_intelligence_validation \
            --output v3-tuning-100.jsonl \
            --report v3-tuning-100-selection.json
          echo '2da901382ea417ebbfb73fc935295b6a8fa76b2d48e6be8f7efe5ba24671d43e  v3-tuning-100.jsonl' | sha256sum -c -
          cat exclude-6900.jsonl v3-tuning-100.jsonl > exclude-7000.jsonl

          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude exclude-7000.jsonl \
            --count 100 \
            --seed 20261004 \
            --evaluation-split v3_annual_description_confirmation \
            --sample-slice fresh_annual_report_intelligence_transfer \
            --output v3-confirmation-consumed-100.jsonl \
            --report v3-confirmation-consumed-100-selection.json
          echo '9571c54439db6d1cc1f79e03e48bc4f6c400be4899fdfbf37b1be97ee3b86d1f  v3-confirmation-consumed-100.jsonl' | sha256sum -c -
          cat exclude-7000.jsonl v3-confirmation-consumed-100.jsonl > exclude-7100.jsonl

          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude exclude-7100.jsonl \
            --count 100 \
            --seed 20261005 \
            --evaluation-split v3_annual_description_final_confirmation \
            --sample-slice fresh_annual_report_intelligence_final_transfer \
            --output v3-final-consumed-100.jsonl \
            --report v3-final-consumed-100-selection.json
          echo 'a9e093f6c1dfdc13010c7ca684db17a75cd827542fd7f7fc5ba8fe4b5db5a118  v3-final-consumed-100.jsonl' | sha256sum -c -
          cat exclude-7100.jsonl v3-final-consumed-100.jsonl > exclude-7200.jsonl
          test "$(wc -l < exclude-7200.jsonl)" -eq 7200
          UNIQUE_COUNT="$(python -c "import json,pathlib; rows=[json.loads(x) for x in pathlib.Path('exclude-7200.jsonl').read_text().splitlines() if x.strip()]; print(len({str(r['organisation_number']) for r in rows}))")"
          test "$UNIQUE_COUNT" -eq 7200

      - name: Freeze fresh V4 source-screen cohort
        run: |
          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude exclude-7200.jsonl \
            --count 20 \
            --seed 20261006 \
            --evaluation-split v4_official_source_screen \
            --sample-slice official_public_activity_source_reach \
            --output v4-source-screen-20.jsonl \
            --report v4-source-screen-20-selection.json
          test "$(wc -l < v4-source-screen-20.jsonl)" -eq 20
          python -c "import json,pathlib; r=json.loads(pathlib.Path('v4-source-screen-20-selection.json').read_text()); assert r['count']==20 and r['overlap_count']==0 and r['excluded_rows']==7200, r; print(json.dumps(r, indent=2))"
          sha256sum v4-source-screen-20.jsonl > v4-source-screen-20.sha256

      - name: Download official Støtteregisteret bulk JSON
        run: |
          mkdir -p out
          curl --fail --location --retry 3 --retry-delay 3 --compressed \
            'https://stotte.brreg.no/nb/oppslag/stoettetildeling/totalbestand/json' \
            --output out/stotte-total.json
          test -s out/stotte-total.json
          sha256sum out/stotte-total.json > out/stotte-total.sha256
          du -h out/stotte-total.json

      - name: Measure exact-org source reach
        run: |
          uv run python scripts/screen_support_registry_reach.py \
            --companies v4-source-screen-20.jsonl \
            --support-json out/stotte-total.json \
            --rows-output out/v4-support-screen-rows.jsonl \
            --report out/v4-support-screen-report.json
          cat out/v4-support-screen-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('out/v4-support-screen-report.json').read_text())
          rows = [json.loads(line) for line in Path('out/v4-support-screen-rows.jsonl').read_text().splitlines() if line.strip()]
          print('\nMatched companies:')
          for row in rows:
              if row['matched']:
                  print(f"- {row['organisation_number']} {row.get('name')}: {row['raw_identifier_occurrences']} occurrence(s)")
          print(f"\nReach: {report['matched_companies']}/{report['companies']} = {report['reach_rate']:.1%}")
          PY

      - name: Upload V4 source-screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-official-source-screen
          retention-days: 90
          if-no-files-found: error
          path: |
            v4-source-screen-20.jsonl
            v4-source-screen-20.sha256
            v4-source-screen-20-selection.json
            signalpost-universe.sha256
            out/stotte-total.sha256
            out/v4-support-screen-rows.jsonl
            out/v4-support-screen-report.json
