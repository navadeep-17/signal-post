name: Phase 11 Owner Veto Docs

on:
  push:
    branches:
      - fix/phase11-explicit-site-owner-veto
    paths:
      - .github/workflows/phase11-owner-veto-docs.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply docs updater
        run: python scripts/update_phase11_owner_veto_docs.py

      - name: Normalize documentation EOFs
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('docs/IMPLEMENTATION_LOG.md', 'docs/70_PLUS_IMPLEMENTATION_PLAN.md'):
              path = Path(name)
              path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/IMPLEMENTATION_LOG.md docs/70_PLUS_IMPLEMENTATION_PLAN.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No docs changes"
            exit 0
          fi
          git commit -m "docs: record Phase 11 owner-veto retune"
          git push origin HEAD:fix/phase11-explicit-site-owner-veto
