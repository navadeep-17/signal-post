name: V7 M2C Debug

on:
  push:
    branches:
      - feature/v7-m2c-careers-production
    paths:
      - .github/workflows/v7-m2c-debug.yml

permissions:
  contents: write

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Capture combined compatibility failure
        shell: bash
        run: |
          set +e
          uv run --with pytest pytest -q \
            tests/test_output_contract.py \
            tests/test_canonical_projection.py \
            tests/test_synthesis.py \
            tests/test_v7_synthesis_decision_brief.py \
            tests/test_v7_m2c_production.py > docs/m2c-combined-failure.txt 2>&1
          status=$?
          cat docs/m2c-combined-failure.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f docs/m2c-combined-failure.txt
            git commit -m "test(v7-m2c): capture combined compatibility failure"
            git push origin HEAD:feature/v7-m2c-careers-production
            exit "$status"
          fi
