name: V7 M2C Debug

on:
  push:
    branches:
      - feature/v7-m2c-careers-production
    paths:
      - .github/workflows/v7-m2c-debug.yml

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # Re-run the exact compatibility slice after removing network-capable PSL lookup from M2C.
      - name: output contract
        continue-on-error: true
        run: uv run --with pytest pytest -q tests/test_output_contract.py
      - name: canonical projection
        continue-on-error: true
        run: uv run --with pytest pytest -q tests/test_canonical_projection.py
      - name: synthesis
        continue-on-error: true
        run: uv run --with pytest pytest -q tests/test_synthesis.py
      - name: v7 synthesis decision brief
        continue-on-error: true
        run: uv run --with pytest pytest -q tests/test_v7_synthesis_decision_brief.py
      - name: m2c focused
        continue-on-error: true
        run: uv run --with pytest pytest -q tests/test_v7_m2c_production.py
      - name: Finish with explicit compatibility gate
        run: |
          uv run --with pytest pytest -q \
            tests/test_output_contract.py \
            tests/test_canonical_projection.py \
            tests/test_synthesis.py \
            tests/test_v7_synthesis_decision_brief.py \
            tests/test_v7_m2c_production.py
