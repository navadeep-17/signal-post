name: H1d Zero-Cost Recall Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - "experiment/h1d-zero-cost-site-recall"
    paths:
      - "src/norway_company_agent/final_site_discovery.py"
      - "tests/test_h1c_secondary_identity.py"
      - ".github/workflows/h1d-zero-cost-recall-qualification.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync and test H1d branch
        run: |
          uv sync --locked
          uv run --with pytest pytest -q
      - name: Download official BRREG bulk registry
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          test -s brreg-enheter.csv
          sha256sum brreg-enheter.csv > brreg-enheter.sha256
      - name: Download Builderr frozen universe
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://builderr.ai/signalpost-company-universe-2025.jsonl.gz' \
            --output signalpost-universe.jsonl.gz
          test -s signalpost-universe.jsonl.gz
          gzip -t signalpost-universe.jsonl.gz
          sha256sum signalpost-universe.jsonl.gz > signalpost-universe.sha256
      - name: Recreate all previously used 1600 companies
        run: |
          uv run python select_entry_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --count 1000 \
            --seed 20260823 \
            --output entry-companies.jsonl
          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude entry-companies.jsonl \
            --count 300 \
            --seed 20260915 \
            --output known-validation-300.jsonl \
            --report known-validation-selection.json
          cat entry-companies.jsonl known-validation-300.jsonl > exclude-1300.jsonl
          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude exclude-1300.jsonl \
            --count 300 \
            --seed 20260916 \
            --evaluation-split h1c_secondary_confirmation \
            --sample-slice fresh_external_precision_validation \
            --output prior-h1c-fresh-300.jsonl \
            --report prior-h1c-fresh-selection.json
          uv run python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected_known = '4248438faa42508f7721bdb83002fe15c81735dbf3f97878eba271078864fda5'
          expected_prior = '7c0d1ae4355edf1e2b282ebc386b7874eb6c3cbc36e5b01f0685069cbcd38d83'
          known = hashlib.sha256(Path('known-validation-300.jsonl').read_bytes()).hexdigest()
          prior = hashlib.sha256(Path('prior-h1c-fresh-300.jsonl').read_bytes()).hexdigest()
          assert known == expected_known, (known, expected_known)
          assert prior == expected_prior, (prior, expected_prior)
          assert json.loads(Path('known-validation-selection.json').read_text())['overlap_count'] == 0
          assert json.loads(Path('prior-h1c-fresh-selection.json').read_text())['overlap_count'] == 0
          print(json.dumps({'known_sha256': known, 'prior_h1c_sha256': prior}, indent=2))
          PY
          cat entry-companies.jsonl known-validation-300.jsonl prior-h1c-fresh-300.jsonl > exclude-1600.jsonl
          test "$(wc -l < exclude-1600.jsonl)" -eq 1600
      - name: Replay known 300 as safety regression
        run: |
          uv run python scripts/run_signalpost_final.py \
            --organisations known-validation-300.jsonl \
            --bulk brreg-enheter.csv \
            --output out/known-final.jsonl \
            --report out/known-run-report.json \
            --work-dir out/known-work \
            --run-id h1d-known-regression \
            --expected-count 300 \
            --workers 8 \
            --site-timeout 6 \
            --max-challenge-requests 5400 \
            --max-third-party-cost-usd 0 \
            --max-wall-runtime-seconds 2400
      - name: Require Oslo Mikrosement false positive to remain quarantined
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          profiles = [json.loads(line) for line in Path('out/known-work/profiles.jsonl').read_text().splitlines() if line.strip()]
          target = next(row for row in profiles if row['organisation_number'] == '933200353')
          website = (target.get('evidence') or {}).get('website') or {}
          value = website.get('value') or {}
          identity = value.get('identity_assessment') or {}
          published_wrong = website.get('status') == 'available' and bool(identity.get('publishable')) and 'oslomikrosement.no' in str(value.get('final_url') or website.get('source_url') or '')
          assert not published_wrong, json.dumps(target, ensure_ascii=False)[:4000]
          report = json.loads(Path('out/known-run-report.json').read_text())
          assert report['passed'] is True, report
          assert report['source_policy']['third_party_cost_usd'] == 0.0
          assert report['source_policy']['search_api_requests'] == 0
          print(json.dumps({'org': '933200353', 'wrong_domain_quarantined': True}, indent=2))
          PY
      - name: Select fresh 300 excluding all previous 1600
        run: |
          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude exclude-1600.jsonl \
            --count 300 \
            --seed 20260917 \
            --evaluation-split h1d_recall_recovery \
            --sample-slice fresh_zero_cost_site_recall_validation \
            --output fresh-h1d-validation-300.jsonl \
            --report fresh-h1d-selection.json
          uv run python - <<'PY'
          import hashlib, json
          from pathlib import Path
          report = json.loads(Path('fresh-h1d-selection.json').read_text())
          assert report['count'] == 300, report
          assert report['excluded_rows'] == 1600, report
          assert report['overlap_count'] == 0, report
          digest = hashlib.sha256(Path('fresh-h1d-validation-300.jsonl').read_bytes()).hexdigest()
          print(json.dumps({**report, 'manifest_sha256': digest}, indent=2))
          PY
      - name: Prepare main baseline worktree
        run: |
          git fetch origin main
          BASE_SHA="$(git merge-base HEAD origin/main)"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git worktree add /tmp/signalpost-h1d-base "$BASE_SHA"
          uv sync --project /tmp/signalpost-h1d-base --locked
      - name: Run current main baseline on fresh H1d 300
        run: |
          uv run --project /tmp/signalpost-h1d-base python /tmp/signalpost-h1d-base/scripts/run_signalpost_final.py \
            --organisations "$GITHUB_WORKSPACE/fresh-h1d-validation-300.jsonl" \
            --bulk "$GITHUB_WORKSPACE/brreg-enheter.csv" \
            --output "$GITHUB_WORKSPACE/out/base-fresh-final.jsonl" \
            --report "$GITHUB_WORKSPACE/out/base-fresh-run-report.json" \
            --work-dir "$GITHUB_WORKSPACE/out/base-fresh-work" \
            --run-id h1d-base-fresh-validation \
            --expected-count 300 \
            --workers 8 \
            --site-timeout 6 \
            --max-challenge-requests 5400 \
            --max-third-party-cost-usd 0 \
            --max-wall-runtime-seconds 2400
      - name: Run H1d branch on same fresh 300
        run: |
          uv run python scripts/run_signalpost_final.py \
            --organisations fresh-h1d-validation-300.jsonl \
            --bulk brreg-enheter.csv \
            --output out/h1d-fresh-final.jsonl \
            --report out/h1d-fresh-run-report.json \
            --work-dir out/h1d-fresh-work \
            --run-id h1d-fresh-validation \
            --expected-count 300 \
            --workers 8 \
            --site-timeout 6 \
            --max-challenge-requests 5400 \
            --max-third-party-cost-usd 0 \
            --max-wall-runtime-seconds 2400
      - name: Compare same-corpus verified-site coverage and export audit list
        run: |
          uv run python - <<'PY'
          import hashlib, json
          from pathlib import Path

          def rows(path):
              return [json.loads(line) for line in Path(path).read_text().splitlines() if line.strip()]

          def verified(profiles):
              result = []
              for profile in profiles:
                  website = (profile.get('evidence') or {}).get('website') or {}
                  value = website.get('value') or {}
                  identity = value.get('identity_assessment') or {}
                  if website.get('status') != 'available' or not identity.get('publishable'):
                      continue
                  result.append({
                      'organisation_number': profile.get('organisation_number'),
                      'name': profile.get('name'),
                      'municipality': profile.get('municipality'),
                      'website': value.get('final_url') or website.get('source_url'),
                      'source_type': website.get('source_type'),
                      'content_sha256': website.get('content_sha256'),
                      'identity_assessment': identity,
                      'identity_text_excerpt': value.get('identity_text_excerpt'),
                      'secondary_identity_page': value.get('secondary_identity_page'),
                  })
              return result

          selection = json.loads(Path('fresh-h1d-selection.json').read_text())
          base_report = json.loads(Path('out/base-fresh-run-report.json').read_text())
          h1d_report = json.loads(Path('out/h1d-fresh-run-report.json').read_text())
          base_profiles = rows('out/base-fresh-work/profiles.jsonl')
          h1d_profiles = rows('out/h1d-fresh-work/profiles.jsonl')
          base_final = rows('out/base-fresh-final.jsonl')
          h1d_final = rows('out/h1d-fresh-final.jsonl')
          base_sites = verified(base_profiles)
          h1d_sites = verified(h1d_profiles)
          base_orgs = {row['organisation_number'] for row in base_sites}
          h1d_orgs = {row['organisation_number'] for row in h1d_sites}
          gained = sorted(h1d_orgs - base_orgs)
          lost = sorted(base_orgs - h1d_orgs)

          for report in (base_report, h1d_report):
              assert report['passed'] is True, report
              assert report['request_budget']['observed_conservative_challenge_request_charge'] <= 5400
              assert report['request_budget']['theoretical_challenge_request_charge_ceiling'] == 5400
              assert report['source_policy']['third_party_cost_usd'] == 0.0
              assert report['source_policy']['search_api_requests'] == 0
              assert report['source_policy']['experimental_connectors_enabled'] is False
              assert report['contract_errors'] == []
              assert report['change_errors'] == []
              assert report['budget_errors'] == []
          assert selection['overlap_count'] == 0
          assert len(base_final) == len(h1d_final) == 300
          assert len({r['organisation_number'] for r in h1d_final}) == 300
          assert all(r['run']['terminal_status'] == 'completed' for r in h1d_final)

          Path('out/h1d-fresh-verified-sites.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, separators=(',', ':')) + '\n' for row in h1d_sites),
              encoding='utf-8',
          )
          Path('out/h1d-gained-orgs.json').write_text(json.dumps(gained, indent=2) + '\n')
          summary = {
              'manifest_sha256': hashlib.sha256(Path('fresh-h1d-validation-300.jsonl').read_bytes()).hexdigest(),
              'base_sha': str(Path('/tmp/signalpost-h1d-base/.git').exists() or '') and '$BASE_SHA',
              'validation_companies': 300,
              'excluded_previous_companies': selection['excluded_rows'],
              'overlap_count': selection['overlap_count'],
              'baseline_verified_sites': len(base_sites),
              'h1d_verified_sites': len(h1d_sites),
              'net_verified_site_gain': len(h1d_sites) - len(base_sites),
              'gained_orgs': gained,
              'lost_orgs': lost,
              'baseline_logical_requests': base_report['request_budget']['observed_logical_requests'],
              'h1d_logical_requests': h1d_report['request_budget']['observed_logical_requests'],
              'baseline_conservative_requests': base_report['request_budget']['observed_conservative_challenge_request_charge'],
              'h1d_conservative_requests': h1d_report['request_budget']['observed_conservative_challenge_request_charge'],
              'baseline_runtime_seconds': base_report['runtime']['wall_runtime_seconds'],
              'h1d_runtime_seconds': h1d_report['runtime']['wall_runtime_seconds'],
              'third_party_cost_usd': h1d_report['source_policy']['third_party_cost_usd'],
          }
          Path('out/h1d-comparison-summary.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY
      - name: Upload H1d qualification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h1d-zero-cost-recall-qualification
          if-no-files-found: error
          retention-days: 30
          path: |
            signalpost-universe.sha256
            brreg-enheter.sha256
            entry-companies.jsonl
            known-validation-300.jsonl
            known-validation-selection.json
            prior-h1c-fresh-300.jsonl
            prior-h1c-fresh-selection.json
            exclude-1600.jsonl
            fresh-h1d-validation-300.jsonl
            fresh-h1d-selection.json
            out/known-run-report.json
            out/known-work/profiles.jsonl
            out/base-fresh-final.jsonl
            out/base-fresh-run-report.json
            out/base-fresh-work/profiles.jsonl
            out/h1d-fresh-final.jsonl
            out/h1d-fresh-run-report.json
            out/h1d-fresh-work/profiles.jsonl
            out/h1d-fresh-verified-sites.jsonl
            out/h1d-gained-orgs.json
            out/h1d-comparison-summary.json
