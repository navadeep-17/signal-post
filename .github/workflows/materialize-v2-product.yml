name: Materialize V2 product

on:
  push:
    branches:
      - revision/v2-canonical-product
    paths:
      - '.github/workflows/materialize-v2-product.yml'

permissions:
  contents: write

jobs:
  build-product:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/v2-canonical-product

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Build certified V2 data-linked product
        run: uv run python scripts/build_certified_v2_product.py

      - name: Commit product and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission/signalpost-v2.html
          git rm .github/workflows/materialize-v2-product.yml
          git commit -m "release(v2): embed data-linked product surface"
          git push origin HEAD:revision/v2-canonical-product
