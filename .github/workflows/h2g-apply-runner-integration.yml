name: H2g Apply Runner Integration

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/h2g-annual-workforce"
    paths:
      - "src/norway_company_agent/annual_report_workforce.py"
      - "tests/test_h2g_annual_report_workforce.py"
      - "scripts/apply_h2g_runner_integration.py"
      - ".github/workflows/h2g-apply-runner-integration.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/h2g-annual-workforce
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --locked

      - name: Run focused connector tests before wiring
        run: uv run --with pytest pytest -q tests/test_h2g_annual_report_workforce.py

      - name: Apply deterministic runner patch
        run: uv run python scripts/apply_h2g_runner_integration.py

      - name: Compile runner and connector
        run: |
          uv run python -m py_compile scripts/run_signalpost_final.py
          uv run python -m py_compile src/norway_company_agent/annual_report_workforce.py

      - name: Run focused and full regressions after wiring
        run: |
          uv run --with pytest pytest -q tests/test_h2g_annual_report_workforce.py tests/test_h2e_registry_workforce.py
          uv run --with pytest pytest -q

      - name: Commit integrated runner
        run: |
          if git diff --quiet -- scripts/run_signalpost_final.py; then
            echo "Runner already integrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_signalpost_final.py
          git commit -m "feat(h2g): integrate annual-report workforce"
          git push origin HEAD:feature/h2g-annual-workforce
