name: V7 M2B Targeted Careers Development Screen

on:
  workflow_dispatch:
  push:
    branches:
      - "experiment/v7-m2b-targeted-careers-probe"
    paths:
      - "src/norway_company_agent/targeted_careers_probe.py"
      - "scripts/run_v7_m2b_careers_probe.py"
      - "tests/test_v7_m2b_targeted_careers_probe.py"
      - ".github/workflows/v7-m2b-targeted-careers-screen.yml"

permissions:
  contents: read
  actions: read

jobs:
  consumed-v5-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install and run probe regressions
        run: |
          uv sync --locked
          uv run --with pytest pytest -q tests/test_v7_m2b_targeted_careers_probe.py

      - name: Restore already-consumed V5 fresh-100 profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p archived/v5
          gh run download 36892430561 \
            --repo navadeep-17/signal-post \
            --name v5-brreg-change-production-qualification \
            --dir archived/v5
          PROFILE_PATH="$(find archived/v5 -type f -path '*v5-change-fresh-work/profiles.jsonl' -print -quit)"
          test -n "$PROFILE_PATH"
          test -s "$PROFILE_PATH"
          echo "PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"

      - name: Probe one /careers path per exact verified site
        run: |
          mkdir -p out/v7-m2b
          uv run python scripts/run_v7_m2b_careers_probe.py \
            --profiles "$PROFILE_PATH" \
            --report out/v7-m2b/report.json \
            --facts out/v7-m2b/facts.jsonl \
            --timeout 6 \
            --max-added-logical-requests 80

      - name: Validate development report
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('out/v7-m2b/report.json').read_text())
          assert report['companies']==100, report
          assert report['third_party_api_cost_usd']==0.0, report
          assert report['wrong_company_publications']==0, report
          assert report['logical_requests_added'] <= 80, report
          assert report['conservative_request_charge_added'] <= 160, report
          print(json.dumps({
              'eligible_verified_sites':report['exact_verified_sites_eligible'],
              'careers_signal_companies':report['careers_signal_companies'],
              'logical_requests_added':report['logical_requests_added'],
              'conservative_charge_added':report['conservative_request_charge_added'],
          },indent=2))
          PY

      - name: Upload development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-m2b-targeted-careers-development
          retention-days: 90
          if-no-files-found: warn
          path: |
            out/v7-m2b/report.json
            out/v7-m2b/facts.jsonl
