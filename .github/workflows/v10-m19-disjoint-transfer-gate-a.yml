name: V10 M19 Disjoint Consumed Transfer Gate A

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v10-m19-disjoint-consumed-transfer
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  QUALIFIED_V8_SHA: 200f056a5a60cad23610a3958b6bec62dfb624a5
  FROZEN_CONSUMED_SOURCE_SHA256: 80e8f5c88b2d2facc1a00c20677a0930240f40fc75a36a27bee16c54efa2de26
  EXCLUSION_UNION_SHA256: 5a1ac106dde4033d68a2751b6d0e15cf3b267c54286c27e45856cea8d5c966b7
  EXCLUSION_ORG_LIST_SHA256: d41f2129147fc01f70efd145cb2fcf46b3cda398ffd6e9cc479ffd991ffb1451
  BRREG_SNAPSHOT_SHA256: 1145bc28c54c6fe10be3a89e529a35832fd67cb34cd9933c0f4418d446512615

jobs:
  freeze:
    name: Freeze disjoint M19 Gate A and Gate B before page observation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install locked runtime
        run: uv sync --locked

      - name: Run focused M19 tests and compile
        run: |
          uv run --with pytest pytest -q tests/test_v10_m19_registry_domain_identity_recovery.py
          python -m py_compile \
            src/norway_company_agent/registry_domain_identity_recovery.py \
            scripts/replay_v10_m19_registry_domain_identity.py \
            scripts/build_v10_m19_transfer_cohorts.py

      - name: Verify immutable source artifacts
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10508036929" --jq .digest)" = \
            'sha256:2f0fbb29ccb7c71b6b593f7e041b3ba4353256674cb404dfc2ebf56f50964a47'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11459496712" --jq .digest)" = \
            'sha256:01e100b09c5e71d630facaab2fdcc006767c3c241d0e3450ac8d8075cbf21e98'

      - name: Recover exact consumed source and frozen BRREG snapshot
        run: |
          set -euo pipefail
          mkdir -p frozen/source frozen/m10

          gh run download 35246833190 --repo "$GITHUB_REPOSITORY" \
            --name final-release-manifest-1000 --dir frozen/source
          SOURCE="$(find frozen/source -type f -name 'final-release-1000.jsonl' | head -n1)"
          test -n "$SOURCE"
          cp "$SOURCE" frozen/consumed-1000.jsonl
          test "$(wc -l < frozen/consumed-1000.jsonl)" -eq 1000
          test "$(sha256sum frozen/consumed-1000.jsonl | awk '{print $1}')" = "$FROZEN_CONSUMED_SOURCE_SHA256"

          gh run download 37567829642 --repo "$GITHUB_REPOSITORY" \
            --name v9-m10-gate-b-frozen-inputs --dir frozen/m10
          BULK="$(find frozen/m10 -type f -name 'brreg-enheter.csv' | head -n1)"
          test -n "$BULK"
          cp "$BULK" frozen/brreg-enheter.csv
          test "$(sha256sum frozen/brreg-enheter.csv | awk '{print $1}')" = "$BRREG_SNAPSHOT_SHA256"

      - name: Verify committed exclusion provenance and freeze both transfer gates
        run: |
          set -euo pipefail
          test "$(sha256sum evaluation/v10_m19_prior_exclusion_orgs.txt | awk '{print $1}')" = "$EXCLUSION_ORG_LIST_SHA256"
          test "$(wc -l < evaluation/v10_m19_prior_exclusion_orgs.txt)" -eq 428
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("evaluation/v10_m19_prior_exclusion_union.report.json").read_text())
          assert report["union_companies"] == 428, report
          assert report["remaining_consumed_companies"] == 572, report
          assert report["all_union_rows_are_in_consumed_source"] is True, report
          assert report["union_org_list_sha256"] == "d41f2129147fc01f70efd145cb2fcf46b3cda398ffd6e9cc479ffd991ffb1451", report
          assert report["union_manifest_sha256"] == "5a1ac106dde4033d68a2751b6d0e15cf3b267c54286c27e45856cea8d5c966b7", report
          print({
              "union_companies": report["union_companies"],
              "remaining_consumed_companies": report["remaining_consumed_companies"],
              "union_org_list_sha256": report["union_org_list_sha256"],
          })
          PY

          uv run python scripts/build_v10_m19_transfer_cohorts.py \
            --source-manifest frozen/consumed-1000.jsonl \
            --prior-exclusion-orgs evaluation/v10_m19_prior_exclusion_orgs.txt \
            --prior-exclusion-report evaluation/v10_m19_prior_exclusion_union.report.json \
            --gate-a-output frozen/m19-transfer-gate-a-100.jsonl \
            --gate-b-output frozen/m19-transfer-gate-b-100.jsonl \
            --report frozen/m19-transfer-freeze-report.json \
            --count-per-gate 100

          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          r=json.loads(Path("frozen/m19-transfer-freeze-report.json").read_text())
          a=[json.loads(x) for x in Path("frozen/m19-transfer-gate-a-100.jsonl").read_text().splitlines() if x.strip()]
          b=[json.loads(x) for x in Path("frozen/m19-transfer-gate-b-100.jsonl").read_text().splitlines() if x.strip()]
          ao={str(x["organisation_number"]) for x in a}
          bo={str(x["organisation_number"]) for x in b}
          assert len(a) == len(ao) == 100
          assert len(b) == len(bo) == 100
          assert not (ao & bo)
          assert r["fresh_companies_used"] == 0
          assert r["prior_exclusion_union_companies"] == 428
          assert r["prior_exclusion_org_list_sha256"] == "d41f2129147fc01f70efd145cb2fcf46b3cda398ffd6e9cc479ffd991ffb1451"
          assert r["prior_exclusion_union_sha256"] == "5a1ac106dde4033d68a2751b6d0e15cf3b267c54286c27e45856cea8d5c966b7"
          assert r["remaining_uninspected_companies"] == 572
          print({
              "gate_a_manifest_sha256": r["gate_a_manifest_sha256"],
              "gate_b_manifest_sha256": r["gate_b_manifest_sha256"],
              "remaining_uninspected_companies": r["remaining_uninspected_companies"],
              "fresh_companies_used": 0,
          })
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: v10-m19-transfer-frozen-cohorts
          retention-days: 30
          if-no-files-found: error
          path: |
            frozen/m19-transfer-gate-a-100.jsonl
            frozen/m19-transfer-gate-b-100.jsonl
            frozen/m19-transfer-freeze-report.json
            frozen/brreg-enheter.csv

  gate_a:
    name: M19 disjoint consumed Gate A 100
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact M19 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: m19
          fetch-depth: 1

      - name: Checkout exact qualified V8 baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFIED_V8_SHA }}
          path: baseline
          fetch-depth: 1

      - name: Prove exact qualified V8 SHA
        run: test "$(git -C baseline rev-parse HEAD)" = "$QUALIFIED_V8_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install exact runtimes and OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          (cd baseline && uv sync --locked)
          (cd m19 && uv sync --locked)

      - uses: actions/download-artifact@v4
        with:
          name: v10-m19-transfer-frozen-cohorts
          path: frozen

      - name: Verify frozen Gate A and sealed Gate B
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          r=json.loads(Path("frozen/m19-transfer-freeze-report.json").read_text())
          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          assert sha("frozen/m19-transfer-gate-a-100.jsonl") == r["gate_a_manifest_sha256"], r
          assert sha("frozen/m19-transfer-gate-b-100.jsonl") == r["gate_b_manifest_sha256"], r
          assert r["fresh_companies_used"] == 0, r
          print({
              "gate_a_manifest_sha256": r["gate_a_manifest_sha256"],
              "sealed_gate_b_manifest_sha256": r["gate_b_manifest_sha256"],
          })
          PY

      - name: Run exact qualified V8 acquisition on Gate A only
        run: |
          mkdir -p baseline-out/work
          cd baseline
          uv run python scripts/run_signalpost_v8.py \
            --organisations ../frozen/m19-transfer-gate-a-100.jsonl \
            --bulk ../frozen/brreg-enheter.csv \
            --output ../baseline-out/output.jsonl \
            --report ../baseline-out/report.json \
            --product-output ../baseline-out/product.html \
            --work-dir ../baseline-out/work \
            --run-id v10-m19-transfer-gate-a-qualified-v8 \
            --expected-count 100 \
            --workers 8 --site-timeout 6 --wikidata-timeout 8 \
            --max-challenge-requests 2000 \
            --max-third-party-cost-usd 0 \
            --max-wall-runtime-seconds 2400 \
            --annual-workforce-workers 4 \
            --annual-workforce-timeout 60 \
            --annual-workforce-min-start-interval 2.1 \
            --annual-workforce-ocr-pages 8 \
            --annual-workforce-ocr-dpi 110 \
            --support-registry-timeout 420 \
            --support-lookback-days 365 \
            --support-events-per-company 5

      - name: Verify qualified V8 Gate A operating contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("baseline-out/report.json").read_text())
          output=[json.loads(x) for x in Path("baseline-out/output.jsonl").read_text().splitlines() if x.strip()]
          profiles=[json.loads(x) for x in Path("baseline-out/work/profiles.jsonl").read_text().splitlines() if x.strip()]
          assert r["passed"] is True, r
          assert len(output) == len(profiles) == 100
          assert r["request_budget"]["observed_conservative_challenge_request_charge"] <= 2000, r
          assert r["request_budget"]["theoretical_challenge_request_charge_ceiling"] <= 2000, r
          assert r["source_policy"]["third_party_cost_usd"] == 0.0, r
          assert r["source_policy"]["search_api_requests"] == 0, r
          assert r["runtime"]["wall_runtime_seconds"] <= 2400, r
          print({
              "observed_charge": r["request_budget"]["observed_conservative_challenge_request_charge"],
              "theoretical_ceiling": r["request_budget"]["theoretical_challenge_request_charge_ceiling"],
              "wall_runtime_seconds": r["runtime"]["wall_runtime_seconds"],
          })
          PY

      - name: Replay only M19 composite identity on identical Gate A acquisition
        run: |
          mkdir -p result
          cd m19
          uv run python scripts/replay_v10_m19_registry_domain_identity.py \
            --baseline-output ../baseline-out/output.jsonl \
            --profiles ../baseline-out/work/profiles.jsonl \
            --challenger-output ../result/challenger-output.jsonl \
            --report ../result/m19-transfer-a-report.json \
            --manual-audit ../result/manual-audit-required.jsonl \
            --mode transfer_a \
            --minimum-recoveries 1

      - name: Enforce predeclared Gate A decision contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("result/m19-transfer-a-report.json").read_text())
          assert r["companies"] == 100, r
          assert r["evaluation_mode"] == "transfer_a", r
          assert r["development_cohort_only"] is False, r
          assert r["minimum_recoveries"] == 1, r
          assert r["network_requests_added_by_replay"] == 0, r
          assert r["search_api_requests_added_by_replay"] == 0, r
          assert r["third_party_cost_usd_added_by_replay"] == 0.0, r
          assert r["fresh_companies_used"] == 0, r
          assert not r["evidence_defects"], r
          assert not r["validation_errors"], r
          assert r["production_promotion_authorized"] is False, r
          assert r["fresh_qualification_authorized"] is False, r
          assert r["machine_decision"] in {
              "SHELVE_LOW_YIELD",
              "TRANSFER_A_MANUAL_AUDIT_REQUIRED",
          }, r
          print(json.dumps(r, indent=2, sort_keys=True))
          PY

      - name: Remove UI/internal cache before upload
        if: always()
        run: |
          rm -f baseline-out/product.html
          rm -rf baseline-out/work/internal-envelopes.jsonl

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v10-m19-transfer-gate-a-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            frozen/m19-transfer-gate-a-100.jsonl
            frozen/m19-transfer-gate-b-100.jsonl
            frozen/m19-transfer-freeze-report.json
            baseline-out/output.jsonl
            baseline-out/report.json
            baseline-out/work/profiles.jsonl
            result/
