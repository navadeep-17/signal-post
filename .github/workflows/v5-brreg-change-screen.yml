name: V5 BRREG Change Feed Screen

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/v5-brreg-change-screen"
    paths:
      - "scripts/screen_brreg_change_feed_reach.py"
      - "tests/test_v5_brreg_change_screen.py"
      - ".github/workflows/v5-brreg-change-screen.yml"
      - "docs/V5_BRREG_CHANGE_SCREEN.md"

permissions:
  contents: read
  actions: read

jobs:
  screen-change-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync and screen regressions
        run: |
          uv sync --locked
          uv run --with pytest pytest -q tests/test_v5_brreg_change_screen.py

      - name: Restore fixed V4 comparison cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source-screen
          gh run download 36873654739 \
            --repo navadeep-17/signal-post \
            --name v4-official-source-screen \
            --dir source-screen
          test -s source-screen/v4-source-screen-20.jsonl
          echo 'fdf402093fa87e65103c9e5b9e8d26db15b0027da4a4504deb7f575117afa5bb  source-screen/v4-source-screen-20.jsonl' | sha256sum -c -

      - name: Screen official BRREG update history
        run: |
          mkdir -p out
          uv run python scripts/screen_brreg_change_feed_reach.py \
            --companies source-screen/v4-source-screen-20.jsonl \
            --rows-output out/v5-brreg-change-screen-rows.jsonl \
            --report out/v5-brreg-change-screen-report.json \
            --raw-output out/v5-brreg-change-screen-response.json \
            --as-of 2026-10-01T00:00:00Z
          cat out/v5-brreg-change-screen-report.json

      - name: Verify source integrity and print matched companies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('out/v5-brreg-change-screen-report.json').read_text())
          rows=[json.loads(line) for line in Path('out/v5-brreg-change-screen-rows.jsonl').read_text().splitlines() if line.strip()]
          assert report['companies']==20, report
          assert report['request_count']==1, report
          assert not report['unexpected_organisation_numbers'], report
          assert len(rows)==20, len(rows)
          print('\nCompanies with update history:')
          for row in rows:
              if row['has_history']:
                  print(f"- {row['organisation_number']} {row.get('name')}: total={row['events']}, 365d={row['events_last_365_days']}, 730d={row['events_last_730_days']}, latest={row['latest_update_at']}")
          PY

      - name: Upload screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-brreg-change-feed-screen
          retention-days: 90
          if-no-files-found: error
          path: |
            source-screen/v4-source-screen-20.jsonl
            source-screen/v4-source-screen-20.sha256
            out/v5-brreg-change-screen-rows.jsonl
            out/v5-brreg-change-screen-report.json
            out/v5-brreg-change-screen-response.json
