name: Research R4 Artifact Union

on:
  push:
    branches:
      - research/bulk-exact-org-recall
    paths:
      - scripts/compare_bulk_exact_org_union.py
      - tests/test_compare_bulk_exact_org_union.py
      - .github/workflows/research-r4-artifact-union.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run artifact-union tests
        run: |
          uv sync --locked
          uv run --with pytest pytest -q tests/test_compare_bulk_exact_org_union.py

      - name: Download frozen research artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/r4/landbruk out/r4/arbeid out/r4/sgregister
          gh run download 37345868675 \
            --repo "$GITHUB_REPOSITORY" \
            --name research-landbruk-support-reach \
            --dir out/r4/landbruk
          gh run download 37347436734 \
            --repo "$GITHUB_REPOSITORY" \
            --name research-arbeidstilsynet-registry-union \
            --dir out/r4/arbeid
          gh run download 37347732285 \
            --repo "$GITHUB_REPOSITORY" \
            --name research-sgregister-bulk-reach \
            --dir out/r4/sgregister
          find out/r4 -type f -maxdepth 4 -print

      - name: Compare source union with zero source requests
        run: |
          uv run python scripts/compare_bulk_exact_org_union.py \
            --source landbruk=out/r4/landbruk/landbruk/matched-companies.jsonl \
            --source arbeidstilsynet=out/r4/arbeid/arbeidstilsynet/matched-companies-1000.jsonl \
            --source sgregister=out/r4/sgregister/sgregister/matched-companies-1000.jsonl \
            --source-report landbruk=out/r4/landbruk/landbruk/report.json \
            --source-report arbeidstilsynet=out/r4/arbeid/arbeidstilsynet/report.json \
            --source-report sgregister=out/r4/sgregister/sgregister/report.json \
            --original-requests landbruk=1 \
            --original-requests arbeidstilsynet=2 \
            --original-requests sgregister=1 \
            --cohort-size 1000 \
            --consumed-100 out/r4/sgregister/consumed-100.jsonl \
            --output-dir out/r4-union
          cat out/r4-union/report.json

      - name: Upload frozen union evidence
        uses: actions/upload-artifact@v4
        with:
          name: research-r4-artifact-union
          retention-days: 30
          path: |
            out/r4-union/report.json
            out/r4-union/union-companies.jsonl
