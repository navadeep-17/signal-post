name: Research Data.norge Source Miner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run source-miner tests
        run: |
          uv sync --locked
          uv run --with pytest pytest -q tests/test_mine_data_norge_exact_org_sources.py

      - name: Mine Data.norge metadata with bounded public Search API queries
        run: |
          uv run python scripts/mine_data_norge_exact_org_sources.py --output-dir out/data-norge
          cat out/data-norge/report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-data-norge-source-miner
          retention-days: 30
          if-no-files-found: warn
          path: |
            out/data-norge/report.json
            out/data-norge/candidates.jsonl
