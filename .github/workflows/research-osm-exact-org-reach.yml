name: Research OSM Exact Org Reach

on:
  push:
    branches:
      - research/bulk-exact-org-recall
    paths:
      - scripts/screen_osm_exact_org_reach.py
      - tests/test_screen_osm_exact_org_reach.py
      - .github/workflows/research-osm-exact-org-reach.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run exact-org candidate tests
        run: |
          uv sync --locked
          uv run --with pytest pytest -q tests/test_screen_osm_exact_org_reach.py

      - name: Query Norway exact org references once
        run: |
          mkdir -p out
          cat > out/query.overpass <<'QUERY'
          [out:json][timeout:180];
          area["ISO3166-1"="NO"][boundary=administrative][admin_level=2]->.no;
          nwr["ref:NO:orgnr"](area.no);
          out tags;
          QUERY
          curl --fail --location --compressed \
            --user-agent 'Signalpost-research-source-screen/1.0' \
            --data-urlencode 'data@out/query.overpass' \
            'https://overpass-api.de/api/interpreter' \
            --output out/osm.json
          test -s out/osm.json
          wc -c out/osm.json
          sha256sum out/osm.json

      - name: Screen consumed 1000 and deterministic 100
        run: |
          uv run python scripts/screen_osm_exact_org_reach.py \
            --source-json out/osm.json \
            --companies submission/final-release-1000.jsonl \
            --output-dir out/osm-1000
          uv run python - <<'PY'
          import hashlib, json
          from pathlib import Path
          rows = [json.loads(line) for line in Path('submission/final-release-1000.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          seed = 'bulk-exact-org-r1-v1|'
          rows.sort(key=lambda row: hashlib.sha256((seed + str(row['organisation_number'])).encode()).hexdigest())
          selected = rows[:100]
          Path('out/consumed-100.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, separators=(',', ':')) + '\n' for row in selected),
              encoding='utf-8',
          )
          PY
          uv run python scripts/screen_osm_exact_org_reach.py \
            --source-json out/osm.json \
            --companies out/consumed-100.jsonl \
            --output-dir out/osm-100
          echo '=== consumed 1000 ==='
          cat out/osm-1000/report.json
          echo '=== consumed 100 ==='
          cat out/osm-100/report.json

      - name: Remove OSM source payload before artifact upload
        if: always()
        run: rm -f out/osm.json out/query.overpass

      - name: Upload bounded research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-osm-exact-org-reach
          retention-days: 30
          if-no-files-found: warn
          path: |
            out/consumed-100.jsonl
            out/osm-1000/report.json
            out/osm-1000/matched-companies.jsonl
            out/osm-100/report.json
            out/osm-100/matched-companies.jsonl
