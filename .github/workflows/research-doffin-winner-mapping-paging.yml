name: Research Doffin Winner Mapping and Paging Probe

on:
  push:
    branches:
      - research/bulk-exact-org-recall
    paths:
      - .github/workflows/research-doffin-winner-mapping-paging.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Map exact organisation identifiers to winner objects
        run: |
          mkdir -p out
          curl --fail --location --compressed \
            --user-agent 'Signalpost-research-source-screen/1.0' \
            --header 'Accept: application/json' \
            'https://api.doffin.no/webclient/api/v2/notices-api/notices/2025-103230' \
            -o out/notice.json
          python - <<'PY'
          import json,re
          from pathlib import Path

          data=json.loads(Path('out/notice.json').read_text(encoding='utf-8'))
          org_re=re.compile(r'(?<!\d)\d{9}(?!\d)')

          def walk(v,path='root'):
              if isinstance(v,dict):
                  for k,x in v.items():
                      walk(x,f'{path}.{k}')
              elif isinstance(v,list):
                  for i,x in enumerate(v):
                      walk(x,f'{path}[{i}]')
              else:
                  text=str(v)
                  if org_re.search(text) or 'KONS AS' in text:
                      print('SCALAR',path,'=',repr(v))

          walk(data)

          print('\n=== OBJECTS CONTAINING KONS OR 913168100 ===')
          def walk_objects(v,path='root'):
              if isinstance(v,dict):
                  encoded=json.dumps(v,ensure_ascii=False,sort_keys=True)
                  if 'KONS AS' in encoded or '913168100' in encoded:
                      print('OBJECT',path,'keys=',sorted(v))
                      print(encoded[:24000])
                  for k,x in v.items():
                      walk_objects(x,f'{path}.{k}')
              elif isinstance(v,list):
                  for i,x in enumerate(v):
                      walk_objects(x,f'{path}[{i}]')
          walk_objects(data)
          PY

      - name: Search using exact KONS winner facet id
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base={
            'numHitsPerPage':100,
            'page':1,
            'searchString':'',
            'sortBy':'PUBLICATION_DATE_DESC',
            'facets':{
              'cpvCodesLabel':{'checkedItems':[]},
              'cpvCodesId':{'checkedItems':[]},
              'type':{'checkedItems':[]},
              'status':{'checkedItems':[]},
              'contractNature':{'checkedItems':[]},
              'procurementStrategicLabels':{'checkedItems':[]},
              'publicationDate':{'from':None,'to':None},
              'location':{'checkedItems':[]},
              'buyer':{'checkedItems':[]},
              'winner':{'checkedItems':['87e8a3aff0f2f943e339e6766e96d3c6']}
            }
          }
          Path('out/winner-search.json').write_text(json.dumps(base,separators=(',',':')),encoding='utf-8')
          PY
          CODE="$(curl --silent --show-error --location --compressed \
            --user-agent 'Signalpost-research-source-screen/1.0' \
            --header 'Accept: application/json' --header 'Content-Type: application/json' \
            --data-binary @out/winner-search.json \
            --write-out '%{http_code}' \
            'https://api.doffin.no/webclient/api/v2/search-api/search' \
            -o out/winner-search.response.json || true)"
          echo "winner-search-http=$CODE"
          python - <<'PY'
          import json,re
          from pathlib import Path
          data=json.loads(Path('out/winner-search.response.json').read_text(encoding='utf-8'))
          print('keys=',sorted(data))
          print('numHitsTotal=',data.get('numHitsTotal'),'numHitsAccessible=',data.get('numHitsAccessible'))
          hits=data.get('hits') or []
          print('hits=',len(hits))
          for i,row in enumerate(hits[:10]):
              print('HIT',i,'keys=',sorted(row))
              print(json.dumps(row,ensure_ascii=False,sort_keys=True)[:14000])
          text=json.dumps(data,ensure_ascii=False)
          print('contains-913168100=', '913168100' in text)
          print('nine-digit-values=',sorted(set(re.findall(r'(?<!\d)\d{9}(?!\d)',text)))[:100])
          PY

      - name: Test RESULT sweep page-size acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def payload(size):
              return {
                'numHitsPerPage':size,
                'page':1,
                'searchString':'',
                'sortBy':'PUBLICATION_DATE_DESC',
                'facets':{
                  'cpvCodesLabel':{'checkedItems':[]},
                  'cpvCodesId':{'checkedItems':[]},
                  'type':{'checkedItems':['RESULT']},
                  'status':{'checkedItems':[]},
                  'contractNature':{'checkedItems':[]},
                  'procurementStrategicLabels':{'checkedItems':[]},
                  'publicationDate':{'from':'2026-01-01','to':'2026-10-06'},
                  'location':{'checkedItems':[]},
                  'buyer':{'checkedItems':[]},
                  'winner':{'checkedItems':[]}
                }
              }
          for size in [100,500,1000]:
              Path(f'out/result-{size}.json').write_text(json.dumps(payload(size),separators=(',',':')),encoding='utf-8')
          PY
          for SIZE in 100 500 1000; do
            CODE="$(curl --silent --show-error --location --compressed \
              --user-agent 'Signalpost-research-source-screen/1.0' \
              --header 'Accept: application/json' --header 'Content-Type: application/json' \
              --connect-timeout 10 --max-time 45 \
              --data-binary "@out/result-${SIZE}.json" \
              --write-out '%{http_code}' \
              'https://api.doffin.no/webclient/api/v2/search-api/search' \
              -o "out/result-${SIZE}.response.json" || true)"
            python - "${SIZE}" "${CODE}" <<'PY'
          import json,sys
          from pathlib import Path
          size,code=sys.argv[1:3]
          text=Path(f'out/result-{size}.response.json').read_text(encoding='utf-8',errors='replace')
          try: data=json.loads(text)
          except Exception:
              print('RESULT-SWEEP size=',size,'http=',code,'non-json-bytes=',len(text),text[:1000]); raise SystemExit
          hits=data.get('hits') or []
          print('RESULT-SWEEP size=',size,'http=',code,'numHitsTotal=',data.get('numHitsTotal'),'numHitsAccessible=',data.get('numHitsAccessible'),'hits=',len(hits),'bytes=',len(text))
          if hits:
              print('first-keys=',sorted(hits[0]))
              print('first=',json.dumps(hits[0],ensure_ascii=False,sort_keys=True)[:12000])
          PY
          done

      - name: Cleanup
        if: always()
        run: rm -rf out
