name: Research BRREG Email-Domain Shadow Yield

on:
  push:
    branches:
      - research/bulk-exact-org-recall
    paths:
      - scripts/screen_brreg_email_domain_shadow_yield.py
      - tests/test_screen_brreg_email_domain_shadow_yield.py
      - .github/workflows/research-brreg-email-domain-shadow-yield.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run candidate-selection tests
        run: |
          uv sync --locked
          PYTHONPATH=src uv run --with pytest pytest -q tests/test_screen_brreg_email_domain_shadow_yield.py

      - name: Download archived exact-registry profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p archived/final-release
          gh run download 35246833190 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'final-release-chunk-*' \
            --dir archived/final-release
          COUNT="$(find archived/final-release -name profiles.jsonl | wc -l)"
          echo "profiles-files=$COUNT"
          test "$COUNT" -eq 10

      - name: Run bounded live shadow verification
        env:
          PYTHONPATH: src
        run: |
          mkdir -p out/brreg-email-domain-shadow
          uv run python scripts/screen_brreg_email_domain_shadow_yield.py \
            --profiles-dir archived/final-release \
            --output-contract-gz submission/final-release-1000-output.jsonl.gz \
            --report out/brreg-email-domain-shadow/report.json \
            --workers 6 \
            --timeout 8
          cat out/brreg-email-domain-shadow/report.json

      - name: Upload aggregate result only
        uses: actions/upload-artifact@v4
        with:
          name: research-brreg-email-domain-shadow-yield
          retention-days: 30
          path: out/brreg-email-domain-shadow/report.json
