name: C12 M4 Live Proof

on:
  push:
    branches:
      - feature/c12-current-first-party-jobs
    paths:
      - "scripts/run_c12_m4_live_proof.py"
      - ".github/workflows/c12-m4-live-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Run C12 M4 live proof
        run: uv run python scripts/run_c12_m4_live_proof.py
      - name: Upload proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c12-m4-live-proof
          path: out/c12-m4-live-proof.json
          if-no-files-found: warn
          retention-days: 7
