name: One-shot materialize certified submission artifacts

on:
  push:
    branches:
      - "release/pre-submit-audit-hardening"
    paths:
      - ".github/workflows/materialize-submission-artifacts.yml"

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/pre-submit-audit-hardening
          fetch-depth: 0
      - name: Download certified release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/signalpost-manifest /tmp/signalpost-aggregate
          gh run download 35246833190 --repo navadeep-17/signal-post --name final-release-manifest-1000 --dir /tmp/signalpost-manifest
          gh run download 35246833190 --repo navadeep-17/signal-post --name final-release-1000-aggregate --dir /tmp/signalpost-aggregate
      - name: Verify immutable certified bytes
        run: |
          echo '80e8f5c88b2d2facc1a00c20677a0930240f40fc75a36a27bee16c54efa2de26  /tmp/signalpost-manifest/final-release-1000.jsonl' | sha256sum -c -
          echo '00750f7d66f16937703f417af493dad38d895cdf0e36020be9c28399e6d6d0f2  /tmp/signalpost-aggregate/final-release-1000-output.jsonl' | sha256sum -c -
          test "$(wc -l < /tmp/signalpost-manifest/final-release-1000.jsonl)" -eq 1000
          test "$(wc -l < /tmp/signalpost-aggregate/final-release-1000-output.jsonl)" -eq 1000
      - name: Materialize repository submission corpus
        run: |
          mkdir -p submission
          cp /tmp/signalpost-manifest/final-release-1000.jsonl submission/final-release-1000.jsonl
          gzip -n -9 -c /tmp/signalpost-aggregate/final-release-1000-output.jsonl > submission/final-release-1000-output.jsonl.gz
          printf '%s  %s\n' '80e8f5c88b2d2facc1a00c20677a0930240f40fc75a36a27bee16c54efa2de26' 'final-release-1000.jsonl' > submission/final-release-1000.sha256
          printf '%s  %s\n' '00750f7d66f16937703f417af493dad38d895cdf0e36020be9c28399e6d6d0f2' 'final-release-1000-output.jsonl' > submission/final-release-1000-output.sha256
          (cd submission && sha256sum final-release-1000-output.jsonl.gz > final-release-1000-output.jsonl.gz.sha256)
          gzip -dc submission/final-release-1000-output.jsonl.gz | sha256sum | grep '^00750f7d66f16937703f417af493dad38d895cdf0e36020be9c28399e6d6d0f2 '
      - name: Commit artifacts and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-submission-artifacts.yml
          git add submission/final-release-1000.jsonl submission/final-release-1000.sha256 submission/final-release-1000-output.jsonl.gz submission/final-release-1000-output.sha256 submission/final-release-1000-output.jsonl.gz.sha256
          git commit -m 'release: embed certified 1000-company corpus'
          git push origin HEAD:release/pre-submit-audit-hardening
