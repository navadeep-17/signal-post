name: V2 Product Materialize

on:
  push:
    branches:
      - revision/v2-canonical-product
    paths:
      - scripts/build_v2_product.py
      - scripts/build_certified_v2_product.py
      - .github/workflows/v2-product-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revision/v2-canonical-product
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Build canonical product
        run: uv run python scripts/build_certified_v2_product.py
      - name: Commit deterministic artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission/signalpost-v2.html
          if git diff --cached --quiet; then
            echo "Product artifact already current."
            exit 0
          fi
          git commit -m "build(v2): materialize canonical product artifact"
          git push origin HEAD:revision/v2-canonical-product
