name: Phase 7 Promotion Docs

on:
  push:
    branches:
      - feature/stotteregisteret-support-awards
    paths:
      - .github/workflows/phase7-promotion-docs.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update authoritative state documents
        run: |
          python scripts/update_phase7_promotion_docs.py
          python - <<'PY'
          from pathlib import Path
          for name in ('docs/70_PLUS_IMPLEMENTATION_PLAN.md', 'docs/IMPLEMENTATION_LOG.md'):
              path = Path(name)
              path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
      - name: Commit documentation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CONTINUATION_STATE.md docs/70_PLUS_IMPLEMENTATION_PLAN.md docs/IMPLEMENTATION_LOG.md docs/PHASE5_SOURCE_FAMILY_SELECTION.md docs/PHASE7_STOTTEREGISTERET_PROMOTION.md
          git diff --cached --check
          git commit -m "docs: record Støtteregisteret promotion gate"
          git push origin HEAD:feature/stotteregisteret-support-awards
