name: Phase 11 Owner Veto Consumed Replay

on:
  push:
    branches:
      - fix/phase11-explicit-site-owner-veto
    paths:
      - .github/workflows/phase11-owner-veto-consumed-replay.yml

permissions:
  contents: read
  actions: read

jobs:
  replay-consumed-20261104:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr unzip

      - name: Sync and run owner-conflict regressions
        run: |
          uv sync --locked
          uv run --with pytest pytest -q tests/test_identity_org_conflict.py tests/test_h1g_final_runner_integration.py

      - name: Recover consumed seed-20261104 cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/navadeep-17/signal-post/actions/artifacts/11346320812/zip' \
            --output phase11-failed-fresh.zip
          echo '9c9ab8bb8477c949a9491f7a672ad181f43566cd9b885a1f4fc6a2dd720165cf  phase11-failed-fresh.zip' | sha256sum -c -
          unzip -q phase11-failed-fresh.zip phase11-fresh-100.jsonl phase11-selection.json out/phase11-external-audit.json
          echo '394eaae1b43fbe5e951fc4a61c7185c068bfa6dad1d37a7223cefc507429dd99  phase11-fresh-100.jsonl' | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          selection = json.loads(Path('phase11-selection.json').read_text())
          assert selection['seed'] == 20261104, selection
          assert selection['count'] == 100, selection
          assert selection['overlap_count'] == 0, selection
          print(json.dumps(selection, indent=2))
          PY

      - name: Download current BRREG snapshot
        run: |
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 240 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          test -s brreg-enheter.csv

      - name: Run current V8 on consumed cohort
        run: |
          mkdir -p out/replay
          uv run python scripts/run_signalpost_v8.py \
            --organisations phase11-fresh-100.jsonl \
            --bulk brreg-enheter.csv \
            --output out/replay/output.jsonl \
            --report out/replay/report.json \
            --product-output out/replay/product.html \
            --work-dir out/replay/work \
            --run-id phase11-owner-veto-consumed-replay \
            --expected-count 100 \
            --workers 8 \
            --site-timeout 6 \
            --wikidata-timeout 8 \
            --max-challenge-requests 2000 \
            --max-third-party-cost-usd 0 \
            --max-wall-runtime-seconds 2400 \
            --annual-workforce-workers 4 \
            --annual-workforce-timeout 60 \
            --annual-workforce-min-start-interval 2.1 \
            --annual-workforce-ocr-pages 8 \
            --annual-workforce-ocr-dpi 110 \
            --support-registry-timeout 420 \
            --support-lookback-days 365 \
            --support-events-per-company 5

      - name: Verify failure mechanism is quarantined
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = [json.loads(line) for line in Path('out/replay/output.jsonl').read_text().splitlines() if line.strip()]
          report = json.loads(Path('out/replay/report.json').read_text())
          assert report['passed'] is True, report
          assert len(rows) == 100
          assert all((row.get('run') or {}).get('terminal_status') == 'completed' for row in rows)

          target = next(row for row in rows if str(row.get('organisation_number')) == '825188592')
          contaminated = []
          for claim in target.get('claims') or []:
              value = claim.get('value')
              rendered = json.dumps(value, ensure_ascii=False).casefold()
              if 'interiorkupp.no' in rendered and claim.get('field') in {
                  'official_website', 'external.profile_handle', 'social_links', 'external.contact_email'
              }:
                  contaminated.append(claim)
          assert not contaminated, contaminated

          profiles_path = Path('out/replay/work/profiles.jsonl')
          profiles = [json.loads(line) for line in profiles_path.read_text().splitlines() if line.strip()]
          profile = next(row for row in profiles if str(row.get('organisation_number')) == '825188592')
          evidence = profile.get('evidence') or {}
          candidate = evidence.get('website_discovered_zero_cost') or {}
          assessment = (candidate.get('value') or {}).get('identity_assessment') or {}
          owners = assessment.get('observed_site_owners') or []
          assert assessment.get('publishable') is False, assessment
          assert any('Rolf Sletvold Interiørsenter AS'.casefold() == str(owner).casefold() for owner in owners), assessment
          assert any('website is owned by a different named legal entity' in str(reason) for reason in assessment.get('reasons') or []), assessment

          old_audit = json.loads(Path('out/phase11-external-audit.json').read_text())
          old_target = [row for row in old_audit if str(row.get('organisation_number')) == '825188592']
          assert len(old_target) == 4, old_target

          summary = {
              'status': 'PASS_CONSUMED_ONLY',
              'fresh_qualification': False,
              'consumed_seed': 20261104,
              'companies': len(rows),
              'old_contaminated_target_publications': len(old_target),
              'new_contaminated_target_publications': len(contaminated),
              'observed_site_owners': owners,
              'observed_conservative_requests': report['request_budget']['observed_conservative_challenge_request_charge'],
              'theoretical_conservative_ceiling': report['request_budget']['theoretical_challenge_request_charge_ceiling'],
              'wall_runtime_seconds': report['runtime']['wall_runtime_seconds'],
              'third_party_cost_usd': report['source_policy']['third_party_cost_usd'],
          }
          Path('out/replay/summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload consumed replay artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase11-owner-veto-consumed-replay
          retention-days: 30
          if-no-files-found: error
          path: |
            phase11-fresh-100.jsonl
            phase11-selection.json
            out/replay/output.jsonl
            out/replay/report.json
            out/replay/summary.json
            out/replay/work/profiles.jsonl
