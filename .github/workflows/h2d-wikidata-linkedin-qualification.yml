name: H2d Wikidata LinkedIn Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - "experiment/h2d-wikidata-social"
    paths:
      - "src/norway_company_agent/wikidata_org_profiles.py"
      - "scripts/evaluate_h2d_wikidata_linkedin.py"
      - "tests/test_h2d_wikidata_org_profiles.py"
      - ".github/workflows/h2d-wikidata-linkedin-qualification.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync and run regressions
        run: |
          uv sync --locked
          uv run --with pytest pytest -q tests/test_h2d_wikidata_org_profiles.py
          uv run --with pytest pytest -q

      - name: Download official BRREG bulk registry
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          test -s brreg-enheter.csv
          sha256sum brreg-enheter.csv > brreg-enheter.sha256

      - name: Download Builderr frozen universe
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://builderr.ai/signalpost-company-universe-2025.jsonl.gz' \
            --output signalpost-universe.jsonl.gz
          test -s signalpost-universe.jsonl.gz
          gzip -t signalpost-universe.jsonl.gz
          sha256sum signalpost-universe.jsonl.gz > signalpost-universe.sha256

      - name: Recreate prior 4300-company exclusion set
        run: |
          uv run python select_entry_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --count 1000 --seed 20260823 \
            --output entry-companies.jsonl

          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude entry-companies.jsonl \
            --count 300 --seed 20260915 \
            --output known-validation-300.jsonl \
            --report known-validation-selection.json
          cat entry-companies.jsonl known-validation-300.jsonl > exclude-1300.jsonl

          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude exclude-1300.jsonl \
            --count 300 --seed 20260916 \
            --evaluation-split h1c_secondary_confirmation \
            --sample-slice fresh_external_precision_validation \
            --output prior-h1c-fresh-300.jsonl \
            --report prior-h1c-selection.json
          cat exclude-1300.jsonl prior-h1c-fresh-300.jsonl > exclude-1600.jsonl

          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude exclude-1600.jsonl \
            --count 300 --seed 20260917 \
            --evaluation-split h1d_recall_recovery \
            --sample-slice fresh_zero_cost_site_recall_validation \
            --output prior-h1d-fresh-300.jsonl \
            --report prior-h1d-fresh-selection.json
          cat exclude-1600.jsonl prior-h1d-fresh-300.jsonl > exclude-1900.jsonl

          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude exclude-1900.jsonl \
            --count 300 --seed 20260918 \
            --evaluation-split h1d_zero_overlap_confirmation \
            --sample-slice fresh_transfer_validation \
            --output prior-h1d-confirm-300.jsonl \
            --report prior-h1d-confirm-selection.json
          cat exclude-1900.jsonl prior-h1d-confirm-300.jsonl > exclude-2200.jsonl

          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude exclude-2200.jsonl \
            --count 300 --seed 20260919 \
            --evaluation-split h1d_final_zero_overlap \
            --sample-slice fresh_final_recall_validation \
            --output prior-h1d-final-300.jsonl \
            --report prior-h1d-final-selection.json
          cat exclude-2200.jsonl prior-h1d-final-300.jsonl > exclude-2500.jsonl

          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude exclude-2500.jsonl \
            --count 300 --seed 20260920 \
            --evaluation-split h1e_wikidata_candidate \
            --sample-slice fresh_zero_cost_external_candidate_validation \
            --output prior-h1e-failed-300.jsonl \
            --report prior-h1e-failed-selection.json
          cat exclude-2500.jsonl prior-h1e-failed-300.jsonl > exclude-2800.jsonl

          test "$(wc -l < validation/h1e-fresh-300-exclusion.jsonl)" -eq 300
          echo '5b4c4ae41a01c8b29aefa703bfd754da3e7448b33cbbbcb831d705032ef030b7  validation/h1e-fresh-300-exclusion.jsonl' | sha256sum -c -
          cat exclude-2800.jsonl validation/h1e-fresh-300-exclusion.jsonl > exclude-3100.jsonl

          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude exclude-3100.jsonl \
            --count 300 --seed 20260922 \
            --evaluation-split h2a_company_social \
            --sample-slice fresh_profile_handle_validation \
            --output prior-h2a-fresh-300.jsonl \
            --report prior-h2a-selection.json
          echo '1d1da002538c0a493303934de53925984c36f641bef2e7623df48897b2e4a88f  prior-h2a-fresh-300.jsonl' | sha256sum -c -
          cat exclude-3100.jsonl prior-h2a-fresh-300.jsonl > exclude-3400.jsonl

          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude exclude-3400.jsonl \
            --count 300 --seed 20260923 \
            --evaluation-split h2b_company_activity \
            --sample-slice fresh_dated_company_activity_validation \
            --output prior-h2b-fresh-300.jsonl \
            --report prior-h2b-selection.json
          echo '0bff58af0b8535e71c677dbe44c873a7dfe63805839eb72044896577e1c968dc  prior-h2b-fresh-300.jsonl' | sha256sum -c -
          cat exclude-3400.jsonl prior-h2b-fresh-300.jsonl > exclude-3700.jsonl

          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude exclude-3700.jsonl \
            --count 300 --seed 20260924 \
            --evaluation-split h2c_company_contact_email \
            --sample-slice fresh_same_domain_contact_email_validation \
            --output prior-h2c-fresh-300.jsonl \
            --report prior-h2c-selection.json
          echo 'eee5765bcdfed57aa81489c2f3ef613bf612fcde92f73e5dc641df97905812bf  prior-h2c-fresh-300.jsonl' | sha256sum -c -
          cat exclude-3700.jsonl prior-h2c-fresh-300.jsonl > exclude-4000.jsonl

          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude exclude-4000.jsonl \
            --count 300 --seed 20260925 \
            --evaluation-split h1f_zero_cost_tld_recall \
            --sample-slice fresh_compact_com_fallback_validation \
            --output prior-h1f-fresh-300.jsonl \
            --report prior-h1f-selection.json
          echo 'da9584073e526207d2bfe52c525509c2852daaa8fb85f26fd9c586a5e4ee4a6e  prior-h1f-fresh-300.jsonl' | sha256sum -c -
          cat exclude-4000.jsonl prior-h1f-fresh-300.jsonl > exclude-4300.jsonl

      - name: Recreate H1g fresh cohort and extend exclusions to 4600
        run: |
          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude exclude-4300.jsonl \
            --count 300 --seed 20260926 \
            --evaluation-split h1g_zero_cost_hyphenated_no_recall \
            --sample-slice fresh_hyphenated_no_fallback_validation \
            --output prior-h1g-fresh-300.jsonl \
            --report prior-h1g-selection.json
          echo '62c70f68049a73ae0d4eac60478bee3478e3894be5dd7039bfa28519db7e4dea  prior-h1g-fresh-300.jsonl' | sha256sum -c -
          cat exclude-4300.jsonl prior-h1g-fresh-300.jsonl > exclude-4600.jsonl
          test "$(wc -l < exclude-4600.jsonl)" -eq 4600

      - name: Select fresh disjoint H2d 300
        run: |
          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude exclude-4600.jsonl \
            --count 300 --seed 20260927 \
            --evaluation-split h2d_wikidata_linkedin \
            --sample-slice fresh_exact_org_linkedin_validation \
            --output fresh-h2d-300.jsonl \
            --report fresh-h2d-selection.json
          uv run python - <<'PY'
          import hashlib, json
          from pathlib import Path
          report = json.loads(Path('fresh-h2d-selection.json').read_text())
          assert report['count'] == 300, report
          assert report['excluded_rows'] == 4600, report
          assert report['overlap_count'] == 0, report
          digest = hashlib.sha256(Path('fresh-h2d-300.jsonl').read_bytes()).hexdigest()
          Path('fresh-h2d-manifest.sha256').write_text(digest + '\n')
          print(json.dumps({**report, 'manifest_sha256': digest}, indent=2))
          PY

      - name: Run unchanged production pipeline on fresh H2d 300
        run: |
          mkdir -p out
          uv run python scripts/run_signalpost_final.py \
            --organisations fresh-h2d-300.jsonl \
            --bulk brreg-enheter.csv \
            --output out/base-final.jsonl \
            --report out/base-report.json \
            --work-dir out/base-work \
            --run-id h2d-production-baseline \
            --expected-count 300 \
            --workers 8 \
            --site-timeout 6 \
            --max-challenge-requests 5406 \
            --max-third-party-cost-usd 0 \
            --max-wall-runtime-seconds 2400

      - name: Evaluate H2d exact-org LinkedIn candidates
        run: |
          uv run python scripts/evaluate_h2d_wikidata_linkedin.py \
            --profiles out/base-work/profiles.jsonl \
            --report out/h2d-report.json \
            --audit out/h2d-audit.jsonl \
            --timeout 8 \
            --expected-count 300

      - name: Verify H2d invariants
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          base = json.loads(Path('out/base-report.json').read_text())
          h2d = json.loads(Path('out/h2d-report.json').read_text())
          selection = json.loads(Path('fresh-h2d-selection.json').read_text())
          assert base['passed'] is True, base
          assert h2d['passed'] is True, h2d
          assert selection['count'] == 300, selection
          assert selection['excluded_rows'] == 4600, selection
          assert selection['overlap_count'] == 0, selection
          assert h2d['experimental_wikidata_requests'] <= 3, h2d
          assert h2d['prospective_production_added_requests_if_folded_into_h1e'] == 0, h2d
          assert h2d['third_party_cost_usd'] == 0.0, h2d
          assert not h2d['prospective_observation_validation_errors'], h2d
          print(json.dumps({
              'manifest_sha256': Path('fresh-h2d-manifest.sha256').read_text().strip(),
              'candidate_companies': h2d['candidate_companies'],
              'overlap_with_existing_h2a': h2d['overlap_with_existing_h2a'],
              'net_new_candidate_companies': h2d['net_new_candidate_companies'],
              'existing_h2a_linkedin_companies': h2d['existing_h2a_linkedin_companies'],
              'prospective_linkedin_companies_after_h2d': h2d['prospective_linkedin_companies_after_h2d'],
              'experimental_requests': h2d['experimental_wikidata_requests'],
              'prospective_production_added_requests': 0,
          }, indent=2))
          PY

      - name: Upload H2d qualification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: h2d-wikidata-linkedin-qualification
          if-no-files-found: error
          path: |
            signalpost-universe.sha256
            brreg-enheter.sha256
            fresh-h2d-300.jsonl
            fresh-h2d-selection.json
            fresh-h2d-manifest.sha256
            out/base-report.json
            out/base-work/profiles.jsonl
            out/h2d-report.json
            out/h2d-audit.jsonl
