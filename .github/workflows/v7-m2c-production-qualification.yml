name: V7 M2C Production Qualification

on:
  push:
    branches:
      - feature/v7-m2c-careers-production
    paths:
      - .github/workflows/v7-m2c-production-qualification.yml

permissions:
  contents: read
  actions: read

jobs:
  verify-frozen-integrated-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Restore exact integrated production artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p archived/m2c-production
          gh run download 37096473516 \
            --repo navadeep-17/signal-post \
            --name v7-m2c-production-qualification \
            --dir archived/m2c-production
          test -s archived/m2c-production/production/output.jsonl
          test -s archived/m2c-production/production/report.json

      - name: Verify careers semantics, exact homepage evidence and budget
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from norway_company_agent.website import _registered_domain

          rows=[json.loads(x) for x in Path('archived/m2c-production/production/output.jsonl').read_text().splitlines() if x.strip()]
          report=json.load(open('archived/m2c-production/production/report.json'))
          assert len(rows)==100 and report['passed'] is True, report
          assert float(report.get('third_party_cost_usd') or 0.0)==0.0
          charge=int((report.get('request_budget') or {}).get('observed_conservative_challenge_request_charge') or 0)
          assert charge <= 2000, charge

          expected={'982897327','936618200'}
          careers={}
          for row in rows:
              org=str(row['organisation_number'])
              claims=[c for c in row.get('claims') or [] if c.get('field')=='external.careers_page' and c.get('availability')=='available']
              if claims:
                  careers[org]=claims
              evidence={str(e.get('id')):e for e in row.get('evidence') or [] if e.get('id')}
              for claim in claims:
                  assert claim.get('signal_type')=='careers_page'
                  assert claim.get('platform')=='company_site'
                  assert 'does not assert an active vacancy' in str(claim.get('claim_scope') or '')
                  assert len(claim.get('evidence_ids') or [])==1
                  ev=evidence[claim['evidence_ids'][0]]
                  source_url=str(ev.get('source_url') or '')
                  careers_url=str((claim.get('value') or {}).get('url') or '')
                  assert source_url.startswith(('http://','https://'))
                  assert careers_url.startswith(('http://','https://'))
                  assert _registered_domain(source_url)==_registered_domain(careers_url), (org,source_url,careers_url)
                  assert len(str(ev.get('content_sha256') or ''))==64
                  assert str(ev.get('claim_span') or '').startswith('Homepage link:')

              facts=[f for f in row.get('canonical_facts') or [] if f.get('type')=='careers_page' and f.get('availability')=='available']
              assert len(facts)==len(claims), (org,claims,facts)
              if claims:
                  assert (row.get('canonical_profile') or {}).get('data_areas',{}).get('hiring_and_public_activity') is True
                  hiring=((row.get('synthesis') or {}).get('decision_brief') or {}).get('hiring') or {}
                  assert 'careers surface' in str(hiring.get('text') or '').lower()
                  has_job=any(c.get('field')=='external.job_posting' and c.get('availability')=='available' for c in row.get('claims') or [])
                  if not has_job:
                      assert 'no specific active job posting' in str(hiring.get('text') or '').lower()
                  assert hiring.get('evidence')

          assert set(careers)==expected, {'expected':sorted(expected),'observed':sorted(careers)}
          assert sum(len(v) for v in careers.values())==2
          summary={
              'companies':len(rows),
              'careers_signal_companies':len(careers),
              'careers_claims':sum(len(v) for v in careers.values()),
              'expected_transfer_companies_recovered':sorted(expected),
              'observed_conservative_charge':charge,
              'third_party_cost_usd':0.0,
              'wrong_company_publications':0,
              'artifact_run':37096473516,
              'artifact_digest':'sha256:8cdd9ed59fea48c9a9d5821edcbe87dd06760755f7f39eb6ec33d9fff4f05a67',
          }
          Path('m2c-production-qualification.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Upload corrected qualification summary
        uses: actions/upload-artifact@v4
        with:
          name: v7-m2c-production-qualification-verified
          retention-days: 90
          path: m2c-production-qualification.json
