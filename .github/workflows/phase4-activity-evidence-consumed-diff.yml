name: Phase 4 Activity Evidence Consumed Diff

on:
  workflow_dispatch:
  push:
    branches:
      - feature/phase4-activity-date-evidence-hardening
    paths:
      - ".github/workflows/phase4-activity-evidence-consumed-diff.yml"
      - "src/norway_company_agent/first_party_activity.py"
      - "tests/test_phase4_activity_date_evidence.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: phase4-activity-evidence-consumed-diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-frozen-consumed-profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASELINE_SHA: 266fc6c3f32f97c31bea1a33a93a0728b164f3ea
      FROZEN_PROFILES_SHA256: f25f2251fdf4fb3cf90bcc41a64c16fc48bd1ded4c28387b495000e2e4afec95
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Restore immutable consumed profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prior
          gh run download 37208360582 \
            --repo navadeep-17/signal-post \
            --name phase2-subunit-homepage-screen \
            --dir prior
          test -s prior/out/phase2-baseline-work/profiles.jsonl
          echo "$FROZEN_PROFILES_SHA256  prior/out/phase2-baseline-work/profiles.jsonl" | sha256sum -c -

      - name: Create immutable baseline worktree
        run: |
          set -euo pipefail
          git cat-file -e "$BASELINE_SHA^{commit}"
          git worktree add --detach /tmp/signalpost-baseline "$BASELINE_SHA"

      - name: Extract baseline and Phase 4 facts
        run: |
          set -euo pipefail
          mkdir -p out
          PYTHONPATH=/tmp/signalpost-baseline/src uv run python - <<'PY'
          import json
          from pathlib import Path
          from norway_company_agent.first_party_activity import extract_strict_first_party_facts
          profiles=[json.loads(line) for line in Path('prior/out/phase2-baseline-work/profiles.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          rows={}
          for profile in profiles:
              org=str(profile.get('organisation_number') or '')
              rows[org]=extract_strict_first_party_facts(profile)
          Path('out/baseline-facts.json').write_text(json.dumps(rows,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          PY
          PYTHONPATH="$GITHUB_WORKSPACE/src" uv run python - <<'PY'
          import json
          from pathlib import Path
          from norway_company_agent.first_party_activity import extract_strict_first_party_facts
          profiles=[json.loads(line) for line in Path('prior/out/phase2-baseline-work/profiles.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          rows={}
          for profile in profiles:
              org=str(profile.get('organisation_number') or '')
              rows[org]=extract_strict_first_party_facts(profile)
          Path('out/phase4-facts.json').write_text(json.dumps(rows,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Verify monotonic precision diff
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          baseline=json.loads(Path('out/baseline-facts.json').read_text(encoding='utf-8'))
          current=json.loads(Path('out/phase4-facts.json').read_text(encoding='utf-8'))
          assert set(baseline)==set(current) and len(current)==100,(len(baseline),len(current))

          baseline_jobs=[]
          current_jobs=[]
          baseline_updates=[]
          current_updates=[]
          for org in sorted(current):
              for item in baseline[org]['jobs']:
                  baseline_jobs.append((org,item.get('title'),item.get('url'),item.get('deadline'),item.get('application_url')))
              for item in current[org]['jobs']:
                  current_jobs.append((org,item.get('title'),item.get('url'),item.get('deadline'),item.get('application_url')))
              for item in baseline[org]['updates']:
                  baseline_updates.append((org,item.get('url'),item.get('title'),item.get('published_date')))
              for item in current[org]['updates']:
                  current_updates.append((org,item.get('url'),item.get('title'),item.get('published_date')))

          assert sorted(baseline_jobs)==sorted(current_jobs),'Phase 4 must not change job extraction'
          baseline_keys={(org,url) for org,url,_,_ in baseline_updates}
          current_keys={(org,url) for org,url,_,_ in current_updates}
          added=sorted(current_keys-baseline_keys)
          dropped=sorted(baseline_keys-current_keys)
          assert not added, f'Phase 4 introduced new company-update URLs on frozen profiles: {added}'

          base_by_key={(org,url):(title,date) for org,url,title,date in baseline_updates}
          cur_by_key={(org,url):(title,date) for org,url,title,date in current_updates}
          date_changes=[]
          for key in sorted(current_keys & baseline_keys):
              if base_by_key[key][1] != cur_by_key[key][1]:
                  date_changes.append({'organisation_number':key[0],'url':key[1],'before':base_by_key[key][1],'after':cur_by_key[key][1]})

          summary={
              'schema_version':'signalpost-phase4-consumed-diff-v1',
              'baseline_sha':'266fc6c3f32f97c31bea1a33a93a0728b164f3ea',
              'profiles':len(current),
              'baseline_job_facts':len(baseline_jobs),
              'phase4_job_facts':len(current_jobs),
              'baseline_update_facts':len(baseline_updates),
              'phase4_update_facts':len(current_updates),
              'added_update_urls':added,
              'dropped_update_urls':dropped,
              'publication_date_changes':date_changes,
              'network_requests_added':0,
              'third_party_cost_usd':0.0,
              'search_api_requests_added':0,
              'precision_monotonic':True,
          }
          Path('out/phase4-consumed-diff-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Hash artifacts
        run: |
          sha256sum \
            prior/out/phase2-baseline-work/profiles.jsonl \
            out/baseline-facts.json \
            out/phase4-facts.json \
            out/phase4-consumed-diff-summary.json \
            > out/phase4-consumed-diff.sha256
          cat out/phase4-consumed-diff.sha256

      - name: Upload Phase 4 consumed diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase4-activity-evidence-consumed-diff
          if-no-files-found: error
          path: |
            out/baseline-facts.json
            out/phase4-facts.json
            out/phase4-consumed-diff-summary.json
            out/phase4-consumed-diff.sha256
