name: V2 Canonical Integration Smoke 20

on:
  push:
    branches:
      - feature/v2-canonical-product-surface
    paths:
      - .github/workflows/v2-integration-smoke-20.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4

      - name: Record tested commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > /tmp/v2-smoke-head.sha

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Install OCR prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr

      - name: Download current official BRREG bulk
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          test -s brreg-enheter.csv

      - name: Prepare deterministic integration-smoke input
        run: |
          head -n 20 submission/final-release-1000.jsonl > /tmp/v2-smoke-20.jsonl
          test "$(wc -l < /tmp/v2-smoke-20.jsonl)" -eq 20

      - name: Run V2 end to end
        run: |
          uv run python scripts/run_signalpost_v2.py \
            --organisations /tmp/v2-smoke-20.jsonl \
            --bulk brreg-enheter.csv \
            --output out/v2-smoke-20.jsonl \
            --product-output out/v2-smoke-20.html \
            --report out/v2-smoke-20-report.json \
            --work-dir out/v2-smoke-work \
            --run-id v2-integration-smoke-20 \
            --expected-count 20 \
            --workers 8 \
            --site-timeout 6 \
            --wikidata-timeout 8 \
            --max-challenge-requests 400 \
            --max-third-party-cost-usd 0 \
            --max-wall-runtime-seconds 900 \
            --annual-workforce-workers 4 \
            --annual-workforce-timeout 60 \
            --annual-workforce-min-start-interval 2.1 \
            --annual-workforce-ocr-pages 8 \
            --annual-workforce-ocr-dpi 110

      - name: Verify canonical recovery and product linkage
        run: |
          uv run python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path
          from norway_company_agent.canonical_contract import validate_canonical_contract
          from norway_company_agent.output_contract import validate_contract_object

          rows = [json.loads(line) for line in Path('out/v2-smoke-20.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          report = json.loads(Path('out/v2-smoke-20-report.json').read_text(encoding='utf-8'))
          assert len(rows) == 20
          assert len({row['organisation_number'] for row in rows}) == 20
          assert all(row['run']['terminal_status'] == 'completed' for row in rows)
          assert all(validate_contract_object(row) == [] for row in rows)
          assert all(validate_canonical_contract(row) == [] for row in rows)
          assert Path('out/v2-smoke-20.html').stat().st_size > 10000
          assert report['source_policy']['third_party_cost_usd'] == 0.0
          assert report['source_policy']['search_api_requests'] == 0
          assert report['request_budget']['observed_conservative_challenge_request_charge'] <= 400

          availability = Counter()
          registry_live_claims = Counter()
          for row in rows:
              for fact in row['canonical']['facts']:
                  if fact.get('availability') == 'available':
                      availability[fact['field']] += 1
              evidence = {item['id']: item for item in row['evidence']}
              for claim in row['claims']:
                  if claim.get('availability') != 'available':
                      continue
                  refs = [evidence[eid] for eid in claim.get('evidence_ids') or [] if eid in evidence]
                  if any(str(ref.get('id') or '').startswith('ev-registry-live-') for ref in refs):
                      registry_live_claims[str(claim.get('field'))] += 1
                  if claim.get('field') == 'official_website':
                      assert not any(str(ref.get('id') or '').startswith('ev-registry-live-') for ref in refs)

          assert availability['company.legal_name'] == 20
          assert availability['company.industry'] == 20
          assert availability['company.municipality'] == 20
          summary = {
              'tested_commit_sha': os.environ['GITHUB_SHA'],
              'companies': len(rows),
              'available_canonical_fields': dict(sorted(availability.items())),
              'registry_live_recovered_claims': dict(sorted(registry_live_claims.items())),
              'requests': report['request_budget']['observed_conservative_challenge_request_charge'],
              'third_party_cost_usd': report['source_policy']['third_party_cost_usd'],
              'product_bytes': Path('out/v2-smoke-20.html').stat().st_size,
          }
          Path('out/v2-smoke-20-summary.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload V2 smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-canonical-integration-smoke-20
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/v2-smoke-head.sha
            out/v2-smoke-20.jsonl
            out/v2-smoke-20-report.json
            out/v2-smoke-20-summary.json
            out/v2-smoke-20.html
            out/v2-smoke-work/internal-envelopes.jsonl
