name: C12 Social Probe

on:
  push:
    branches:
      - feature/c12-social-materialization
    paths:
      - "src/norway_company_agent/company_site_social.py"
      - "scripts/run_c12_social_probe.py"
      - ".github/workflows/c12-social-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Run C12 811730912 social probe
        run: uv run python scripts/run_c12_social_probe.py

      - name: Upload bounded probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c12-social-probe-811730912
          path: out/c12-social-probe.json
          if-no-files-found: warn
          retention-days: 7
