name: Research BRREG Historical-Name Candidate Reach

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build deterministic consumed 100 and current website baseline
        run: |
          mkdir -p out
          uv sync --locked
          uv run python - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path

          rows=[
              json.loads(line)
              for line in Path('submission/final-release-1000.jsonl').read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          seed='bulk-exact-org-r1-v1|'
          rows.sort(key=lambda row: hashlib.sha256((seed+str(row['organisation_number'])).encode()).hexdigest())
          selected=rows[:100]
          selected_orgs={str(x['organisation_number']) for x in selected}
          verified=set()
          with gzip.open('submission/final-release-1000-output.jsonl.gz','rt',encoding='utf-8') as h:
              for line in h:
                  if not line.strip(): continue
                  row=json.loads(line)
                  org=str(row.get('organisation_number') or '')
                  if org not in selected_orgs: continue
                  for claim in row.get('claims') or []:
                      if (
                          isinstance(claim,dict)
                          and claim.get('field')=='official_website'
                          and claim.get('availability')=='available'
                          and claim.get('value')
                      ):
                          verified.add(org); break
          Path('out/cohort.jsonl').write_text(
              ''.join(json.dumps({
                  'organisation_number':str(row['organisation_number']),
                  'verified_website':str(row['organisation_number']) in verified,
              },separators=(',',':'))+'\n' for row in selected),
              encoding='utf-8',
          )
          print('consumed100=',len(selected),'baseline-verified-websites=',len(verified))
          PY

      - name: Screen live BRREG historical-name candidate availability
        env:
          PYTHONPATH: src
        run: |
          uv run python - <<'PY'
          from __future__ import annotations
          import concurrent.futures
          import datetime as dt
          import json
          import re
          import urllib.request
          import urllib.error
          from collections import Counter
          from pathlib import Path

          from norway_company_agent.domain_discovery import distinctive_legal_name_tokens

          UA='Signalpost-research-source-screen/1.0'
          BASE='https://data.brreg.no/enhetsregisteret/api/enheter/{}'
          TODAY=dt.date(2026,10,6)

          cohort=[
              json.loads(line)
              for line in Path('out/cohort.jsonl').read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          baseline_verified={x['organisation_number'] for x in cohort if x['verified_website']}
          targets=[x['organisation_number'] for x in cohort]

          def fetch(org):
              req=urllib.request.Request(
                  BASE.format(org),
                  headers={'User-Agent':UA,'Accept':'application/vnd.brreg.enhetsregisteret.enhet.v2+json'},
              )
              try:
                  with urllib.request.urlopen(req,timeout=12) as resp:
                      return org,resp.status,json.loads(resp.read().decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  return org,exc.code,{}
              except Exception as exc:
                  return org,0,{'_error':type(exc).__name__}

          def labels(name):
              tokens=distinctive_legal_name_tokens(name)
              if not tokens: return set()
              vals={''.join(tokens),'-'.join(tokens)}
              return {
                  f'{x}.no'
                  for x in vals
                  if 3<=len(x)<=63
                  and re.fullmatch(r'[a-z0-9](?:[a-z0-9-]{1,61}[a-z0-9])?',x)
              }

          status_counts=Counter()
          records=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              for org,status,body in pool.map(fetch,targets):
                  status_counts[status]+=1
                  if status!=200 or not isinstance(body,dict):
                      continue
                  current_name=str(body.get('navn') or '')
                  current_labels=labels(current_name)
                  hist=body.get('historiskeNavn') or []
                  if not isinstance(hist,list): hist=[]
                  normalized=[]
                  for item in hist:
                      if not isinstance(item,dict): continue
                      name=' '.join(str(item.get('navn') or '').split())
                      if not name: continue
                      til=str(item.get('tilDato') or '')[:10]
                      try: til_date=dt.date.fromisoformat(til)
                      except Exception: til_date=None
                      candidates=sorted(labels(name)-current_labels)
                      if not candidates: continue
                      normalized.append({
                          'name':name,
                          'til_date':til_date,
                          'candidates':candidates,
                      })
                  normalized.sort(key=lambda x:x['til_date'] or dt.date.min,reverse=True)
                  distinct=sorted({d for item in normalized for d in item['candidates']})
                  latest=normalized[0]['til_date'] if normalized else None
                  records.append({
                      'organisation_number':org,
                      'baseline_verified_website':org in baseline_verified,
                      'historical_name_rows':len(hist),
                      'distinct_historical_candidate_count':len(distinct),
                      'candidate_domains':distinct,
                      'latest_historical_name_end':latest.isoformat() if latest else None,
                  })

          unresolved=[r for r in records if not r['baseline_verified_website']]
          with_hist=[r for r in unresolved if r['historical_name_rows']>0]
          with_candidates=[r for r in unresolved if r['distinct_historical_candidate_count']>0]

          def ended_within(r,days):
              raw=r.get('latest_historical_name_end')
              if not raw: return False
              try: d=dt.date.fromisoformat(raw)
              except ValueError: return False
              return 0 <= (TODAY-d).days <= days

          report={
              'screen_type':'live_brreg_historical_name_deterministic_no_candidate_reach',
              'cohort_companies':len(targets),
              'baseline_verified_website_companies':len(baseline_verified),
              'unresolved_website_companies':len(targets)-len(baseline_verified),
              'live_entity_requests':len(targets),
              'http_status_counts':{str(k):v for k,v in sorted(status_counts.items())},
              'successful_entity_rows':len(records),
              'unresolved_companies_with_historical_names':len(with_hist),
              'unresolved_companies_with_distinct_historical_no_candidates':len(with_candidates),
              'distinct_historical_candidate_domains':len({d for r in with_candidates for d in r['candidate_domains']}),
              'latest_historical_name_ended_within_1y_companies':sum(ended_within(r,365) for r in with_candidates),
              'latest_historical_name_ended_within_3y_companies':sum(ended_within(r,365*3) for r in with_candidates),
              'latest_historical_name_ended_within_5y_companies':sum(ended_within(r,365*5) for r in with_candidates),
              'latest_historical_name_ended_within_10y_companies':sum(ended_within(r,365*10) for r in with_candidates),
              'incremental_production_requests_if_retained_from_existing_registry_live':0,
              'screen_requests':len(targets),
              'third_party_cost_usd':0.0,
              'identity_semantics':'BRREG exact organisation number supplies name history only; historical-name domain is candidate generation, never publication proof.',
              'production_publication_enabled':False,
              'reuse_rights_status':'NLOD_2_0',
          }
          Path('out/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          Path('out/candidates.jsonl').write_text(
              ''.join(json.dumps(r,ensure_ascii=False,sort_keys=True)+'\n' for r in with_candidates),
              encoding='utf-8',
          )
          print(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True))
          PY

      - name: Upload consumed-only source-selection evidence
        uses: actions/upload-artifact@v4
        with:
          name: research-brreg-historical-name-candidate-reach
          retention-days: 30
          path: |
            out/report.json
            out/candidates.jsonl
