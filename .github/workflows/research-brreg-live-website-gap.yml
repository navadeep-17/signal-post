name: Research BRREG Live Website Gap

on:
  push:
    branches:
      - research/bulk-exact-org-recall
    paths:
      - scripts/audit_brreg_live_website_gap.py
      - tests/test_audit_brreg_live_website_gap.py
      - .github/workflows/research-brreg-live-website-gap.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run zero-network audit tests
        run: |
          uv sync --locked
          uv run --with pytest pytest -q tests/test_audit_brreg_live_website_gap.py

      - name: Download archived consumed profiles only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p archived/final-release
          gh run download 35246833190             --repo "$GITHUB_REPOSITORY"             --pattern 'final-release-chunk-*'             --dir archived/final-release
          COUNT="$(find archived/final-release -name profiles.jsonl | wc -l)"
          echo "profiles-files=$COUNT"
          test "$COUNT" -eq 10

      - name: Measure live-homepage drift with zero network
        run: |
          mkdir -p out
          uv run python scripts/audit_brreg_live_website_gap.py             --profiles-dir archived/final-release             --output-contract-gz submission/final-release-1000-output.jsonl.gz             --report out/report.json
          cat out/report.json

      - name: Upload aggregate result
        uses: actions/upload-artifact@v4
        with:
          name: research-brreg-live-website-gap
          retention-days: 30
          path: out/report.json
