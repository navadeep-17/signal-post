name: V6h BRREG Subunit Site Screen

on:
  workflow_dispatch:
  push:
    branches:
      - "experiment/v6h-brreg-subunit-site-candidates"
    paths:
      - "src/norway_company_agent/v6h_subunit_contact_hook.py"
      - "src/norway_company_agent/subunit_site_discovery.py"
      - "scripts/run_v6h_base_with_subunit_hints.py"
      - "scripts/run_v6h_subunit_site_experiment.py"
      - "tests/test_v6h_subunit_site_discovery.py"
      - ".github/workflows/v6h-brreg-subunit-site-screen.yml"

permissions:
  contents: read
  actions: read

jobs:
  consumed-100-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies and V6h regressions
        run: |
          uv sync --locked
          uv run --with pytest pytest -q tests/test_v6h_subunit_site_discovery.py

      - name: Restore already-consumed V6d transfer cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prior
          gh run download 36978734059 --repo navadeep-17/signal-post \
            --name v6d-first-party-depth-transfer --dir prior
          test -s prior/v6d-transfer-100.jsonl
          echo '536b55977b2d6b7b996d397ceb7ad8c3773f7a7c5a7c33bfd633731ff3646ea7  prior/v6d-transfer-100.jsonl' | sha256sum -c -

      - name: Install OCR runtime and download BRREG bulk
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          test -s brreg-enheter.csv

      - name: Re-run production base while retaining already-fetched subunit hints
        run: |
          mkdir -p out/base
          uv run python scripts/run_v6h_base_with_subunit_hints.py \
            --organisations prior/v6d-transfer-100.jsonl \
            --bulk brreg-enheter.csv \
            --output out/base/output.jsonl \
            --report out/base/report.json \
            --work-dir out/base/work \
            --run-id v6h-consumed100-base \
            --expected-count 100 \
            --workers 8 \
            --site-timeout 6 \
            --wikidata-timeout 8 \
            --max-challenge-requests 1998 \
            --max-third-party-cost-usd 0 \
            --max-wall-runtime-seconds 1200 \
            --annual-workforce-workers 4 \
            --annual-workforce-timeout 60 \
            --annual-workforce-min-start-interval 2.1 \
            --annual-workforce-ocr-pages 8 \
            --annual-workforce-ocr-dpi 110

      - name: Compute safe observed probe headroom
        id: budget
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r=json.load(open('out/base/report.json'))
          base=int((r.get('request_budget') or {}).get('observed_conservative_challenge_request_charge') or 0)
          # Reserve the V5 shared BRREG change feed charge even though this screen only
          # needs retained profiles. Cap V6h to 80 logical requests (=40 full probes).
          logical=max(0,min(80,(2000-base-2)//2))
          print(f'base_charge={base}')
          print(f'probe_logical={logical}')
          PY
          cat "$GITHUB_OUTPUT"

      - name: Screen and independently probe official subunit hints
        run: |
          mkdir -p out/v6h
          uv run python scripts/run_v6h_subunit_site_experiment.py \
            --profiles out/base/work/profiles.jsonl \
            --output-profiles out/v6h/profiles.jsonl \
            --report out/v6h/report.json \
            --attempts out/v6h/attempts.jsonl \
            --candidate-audit out/v6h/candidates.jsonl \
            --max-logical-requests '${{ steps.budget.outputs.probe_logical }}' \
            --max-candidates-per-company 1 \
            --timeout 6

      - name: Verify experiment boundary and print decision surface
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from norway_company_agent.website import _registered_domain

          r=json.load(open('out/v6h/report.json'))
          attempts=[json.loads(x) for x in Path('out/v6h/attempts.jsonl').read_text().splitlines() if x.strip()]
          base=int('${{ steps.budget.outputs.base_charge }}')
          combined=base+2+int(r['conservative_request_charge_added'])
          assert r['input_profiles']==100
          assert r['third_party_api_cost_usd']==0.0
          assert r['candidate_generation_network_requests']==0
          assert combined <= 2000, (base,r['conservative_request_charge_added'],combined)
          for attempt in attempts:
              assert attempt['candidate_domain']
              if attempt['publishable']:
                  assert attempt['content_sha256'] and len(str(attempt['content_sha256']))==64
                  assert attempt['publication_reason']
          summary={
              'cohort':'already-consumed V6d transfer 100',
              'fresh_cohort_spent':False,
              'base_observed_charge':base,
              'reserved_v5_change_charge':2,
              'combined_observed_charge':combined,
              'candidate_companies':r['companies_with_any_subunit_domain_hint'],
              'unresolved_candidate_companies':r['unresolved_companies_with_subunit_domain_hint'],
              'explicit_website_hint_companies':r['companies_with_explicit_subunit_website_hint'],
              'email_domain_hint_companies':r['companies_with_subunit_email_domain_hint'],
              'probe_attempts':r['probe_attempts'],
              'net_new_verified_websites':r['net_new_verified_websites'],
              'net_new_contact_companies':r['net_new_contact_companies'],
              'net_new_social_companies':r['net_new_social_companies'],
              'added_conservative_charge':r['conservative_request_charge_added'],
              'added_runtime_seconds':r['runtime_seconds'],
              'third_party_api_cost_usd':0.0,
              'decision_rule':'Only burn a fresh cohort if official subunit hints produce material exact-parent website gain on this consumed screen.',
          }
          Path('out/v6h/decision-surface.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Upload V6h screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6h-brreg-subunit-site-screen
          retention-days: 90
          if-no-files-found: warn
          path: |
            out/base/report.json
            out/base/work/profiles.jsonl
            out/v6h/report.json
            out/v6h/candidates.jsonl
            out/v6h/attempts.jsonl
            out/v6h/profiles.jsonl
            out/v6h/decision-surface.json
