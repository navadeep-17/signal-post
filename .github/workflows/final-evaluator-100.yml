name: Final Evaluator 100 Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/final-orchestrator-budget"
    paths:
      - "src/norway_company_agent/http.py"
      - "src/norway_company_agent/final_site_discovery.py"
      - "src/norway_company_agent/wikidata_discovery.py"
      - "src/norway_company_agent/wikidata_fallback.py"
      - "src/norway_company_agent/run_budget.py"
      - "scripts/run_signalpost_final.py"
      - "tests/test_final_orchestrator.py"
      - ".github/workflows/final-evaluator-100.yml"

permissions:
  contents: read

jobs:
  final-evaluator-100:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync and test
        run: |
          uv sync --locked
          uv run --with pytest pytest -q
      - name: Download official BRREG bulk registry
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          test -s brreg-enheter.csv
          sha256sum brreg-enheter.csv > brreg-enheter.sha256
      - name: Download Builderr frozen universe
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://builderr.ai/signalpost-company-universe-2025.jsonl.gz' \
            --output signalpost-universe.jsonl.gz
          test -s signalpost-universe.jsonl.gz
          gzip -t signalpost-universe.jsonl.gz
          sha256sum signalpost-universe.jsonl.gz > signalpost-universe.sha256
      - name: Recreate frozen development 100
        run: |
          uv run python select_entry_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --count 1000 \
            --seed 20260823 \
            --output entry-companies.jsonl
          head -n 100 entry-companies.jsonl > benchmark-dev-100.jsonl
          test "$(wc -l < benchmark-dev-100.jsonl)" -eq 100
          DEV_SHA="$(sha256sum benchmark-dev-100.jsonl | cut -d' ' -f1)"
          test "$DEV_SHA" = '51a96f25f79532b9ba285304d540887e0f17410907909dbe6c85c0b41b8341d3'
          printf '%s  %s\n' "$DEV_SHA" benchmark-dev-100.jsonl > benchmark-dev-100.sha256
      - name: Run one-command final evaluator
        run: |
          uv run python scripts/run_signalpost_final.py \
            --organisations benchmark-dev-100.jsonl \
            --bulk brreg-enheter.csv \
            --output out/final-100.jsonl \
            --report out/final-100-report.json \
            --work-dir out/final-work \
            --run-id final-evaluator-100 \
            --expected-count 100 \
            --workers 8 \
            --site-timeout 6 \
            --wikidata-timeout 8 \
            --max-challenge-requests 1802 \
            --max-third-party-cost-usd 0 \
            --max-wall-runtime-seconds 2400
      - name: Verify final evaluator hard gates
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('out/final-100-report.json').read_text())
          rows = [json.loads(line) for line in Path('out/final-100.jsonl').read_text().splitlines() if line.strip()]
          assert report['passed'] is True, report
          assert len(rows) == 100
          assert len({row['organisation_number'] for row in rows}) == 100
          assert all(row['run']['terminal_status'] == 'completed' for row in rows)
          assert report['request_budget']['shared_wikidata_logical_request_ceiling'] == 1
          assert report['request_budget']['shared_wikidata_logical_requests'] == 1
          assert report['request_budget']['theoretical_challenge_request_charge_ceiling'] == 1802
          assert report['request_budget']['observed_conservative_challenge_request_charge'] <= 1802
          assert report['source_policy']['third_party_cost_usd'] == 0.0
          assert report['source_policy']['search_api_requests'] == 0
          assert report['source_policy']['experimental_connectors_enabled'] is False
          assert report['source_policy']['wikidata_candidate_discovery_enabled'] is True
          assert report['runtime']['wall_runtime_seconds'] <= 2400
          assert report['contract_errors'] == []
          assert report['change_errors'] == []
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Upload final evaluator qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-evaluator-100
          if-no-files-found: error
          retention-days: 30
          path: |
            benchmark-dev-100.jsonl
            benchmark-dev-100.sha256
            brreg-enheter.sha256
            signalpost-universe.sha256
            out/final-100.jsonl
            out/final-100-report.json
            out/final-work/profiles.jsonl
            out/final-work/internal-envelopes.jsonl
