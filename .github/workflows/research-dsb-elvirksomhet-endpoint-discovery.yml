name: Research DSB Elvirksomhet Endpoint Discovery

on:
  push:
    branches:
      - research/bulk-exact-org-recall
    paths:
      - .github/workflows/research-dsb-elvirksomhet-endpoint-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current application shell
        run: |
          mkdir -p out/js
          curl --fail --location --compressed \
            --user-agent 'Signalpost-research-source-screen/1.0' \
            'https://elvirksomhetsregisteret.dsb.no/search' \
            --output out/index.html
          test -s out/index.html
          wc -c out/index.html

      - name: Download referenced JavaScript assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          html = Path('out/index.html').read_text(encoding='utf-8', errors='replace')
          refs = sorted(set(re.findall(r'(?:src|href)=["\']([^"\']+\.js(?:\?[^"\']*)?)', html, flags=re.I)))
          print('js-ref-count:', len(refs))
          for i, ref in enumerate(refs):
              url = ref if ref.startswith('http') else 'https://elvirksomhetsregisteret.dsb.no' + (ref if ref.startswith('/') else '/' + ref)
              dest = Path('out/js') / f'{i:02d}.js'
              print('fetch', i, url)
              subprocess.run([
                  'curl','--fail','--location','--compressed',
                  '--user-agent','Signalpost-research-source-screen/1.0',
                  url,'--output',str(dest)
              ], check=True)
          PY

      - name: Search application assets for bulk and API endpoints
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          needles = ['download','excel','xlsx','export','api/','search','organization','organisasjon','enterprise','virksomhet']
          url_re = re.compile(r'https?://[^"\'<>\\s]+')
          route_re = re.compile(r'["\'](/[^"\']{2,160})["\']')
          for path in [Path('out/index.html'), *sorted(Path('out/js').glob('*.js'))]:
              text = path.read_text(encoding='utf-8', errors='replace')
              low = text.lower()
              hits = [n for n in needles if n in low]
              if not hits:
                  continue
              print('\n===', path.name, 'bytes=', path.stat().st_size, 'hits=', hits, '===')
              for needle in ['download','xlsx','excel','export','api/']:
                  start_at = 0
                  shown = 0
                  while shown < 8:
                      idx = low.find(needle, start_at)
                      if idx < 0:
                          break
                      print('---', needle, '---')
                      print(text[max(0, idx-500):min(len(text), idx+1300)])
                      shown += 1
                      start_at = idx + len(needle)
              urls = sorted(set(url_re.findall(text)))
              for url in urls[:100]:
                  print('URL', url)
              routes = sorted(set(route_re.findall(text)))
              for route in routes:
                  rlow = route.lower()
                  if any(token in rlow for token in ['download','export','excel','xlsx','api','search','enterprise','virksom']):
                      print('ROUTE', route)
          PY

      - name: Remove application payloads
        if: always()
        run: rm -rf out/index.html out/js
