name: V6d First Party Depth Transfer Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - "experiment/v6d-first-party-depth"
    paths:
      - ".github/workflows/v6d-first-party-depth-transfer.yml"

permissions:
  contents: read
  actions: read

jobs:
  unseen-transfer-100:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      BASELINE_SHA: 97af39c7943d6e72e3bcc45b649e111744e5673d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies and hardened regressions
        run: |
          uv sync --locked
          uv run --with pytest pytest -q tests/test_v6d_verified_site_depth.py tests/test_v6d_hardened.py

      - name: Install OCR runtime and download public inputs
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://builderr.ai/signalpost-company-universe-2025.jsonl.gz' \
            --output signalpost-universe.jsonl.gz
          gzip -t signalpost-universe.jsonl.gz
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          test -s brreg-enheter.csv

      - name: Restore historical manifests through consumed V6d development cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p archived/h2e archived/h2g1 archived/h2g2 archived/v4screen archived/v4narrative archived/v5 archived/v6rejected archived/v6c archived/v6d
          gh run download 35051402737 --repo navadeep-17/signal-post --name h2e-registry-workforce-qualification --dir archived/h2e
          gh run download 35092456045 --repo navadeep-17/signal-post --name h2g-annual-workforce-qualification --dir archived/h2g1
          gh run download 35104937900 --repo navadeep-17/signal-post --name h2g-annual-workforce-qualification-v2 --dir archived/h2g2
          gh run download 36873654739 --repo navadeep-17/signal-post --name v4-official-source-screen --dir archived/v4screen
          gh run download 36884650475 --repo navadeep-17/signal-post --name v4-registry-narrative-fresh-qualification --dir archived/v4narrative
          gh run download 36892430561 --repo navadeep-17/signal-post --name v5-brreg-change-production-qualification --dir archived/v5
          gh run download 36912683196 --repo navadeep-17/signal-post --name v6-domain-recall-development --dir archived/v6rejected
          gh run download 36963913555 --repo navadeep-17/signal-post --name v6c-candidate-ranking-development --dir archived/v6c
          gh run download 36967544569 --repo navadeep-17/signal-post --name v6d-first-party-depth-development --dir archived/v6d
          git show 2c745ed22232a443fe2c9e8fc3f49a66c725be0e:validation/h1e-fresh-300-exclusion.jsonl > historical-h1e-fresh-300-exclusion.jsonl
          test -s archived/v6d/v6d-dev-100.jsonl
          echo '9256a2c823bb8a02ca1a0a3bf4cc5f168077ac5728e60a46efd9fe79ec25c73c  archived/v6d/v6d-dev-100.jsonl' | sha256sum -c -

      - name: Recreate exclusion chain and add V6d development 100
        run: |
          set -euo pipefail
          uv run python scripts/freeze_final_release_1000.py \
            --universe signalpost-universe.jsonl.gz \
            --h1e-recovered historical-h1e-fresh-300-exclusion.jsonl \
            --h2e archived/h2e/fresh-h2e-300.jsonl \
            --h2g1 archived/h2g1/fresh-h2g-300.jsonl \
            --h2g2 archived/h2g2/fresh-h2g-v2-300.jsonl \
            --output-dir release-freeze --release-seed 20261002
          echo '80e8f5c88b2d2facc1a00c20677a0930240f40fc75a36a27bee16c54efa2de26  release-freeze/final-release-1000.jsonl' | sha256sum -c -
          cat release-freeze/exclude-5900.jsonl release-freeze/final-release-1000.jsonl > exclude-6900.jsonl
          uv run python scripts/select_disjoint_validation_batch.py --universe signalpost-universe.jsonl.gz --exclude exclude-6900.jsonl --count 100 --seed 20261003 --evaluation-split v3a --sample-slice v3a --output v3a.jsonl --report v3a.json
          cat exclude-6900.jsonl v3a.jsonl > exclude-7000.jsonl
          uv run python scripts/select_disjoint_validation_batch.py --universe signalpost-universe.jsonl.gz --exclude exclude-7000.jsonl --count 100 --seed 20261004 --evaluation-split v3b --sample-slice v3b --output v3b.jsonl --report v3b.json
          cat exclude-7000.jsonl v3b.jsonl > exclude-7100.jsonl
          uv run python scripts/select_disjoint_validation_batch.py --universe signalpost-universe.jsonl.gz --exclude exclude-7100.jsonl --count 100 --seed 20261005 --evaluation-split v3c --sample-slice v3c --output v3c.jsonl --report v3c.json
          cat exclude-7100.jsonl v3c.jsonl > exclude-7200.jsonl
          cat exclude-7200.jsonl archived/v4screen/v4-source-screen-20.jsonl > exclude-7220.jsonl
          cat exclude-7220.jsonl archived/v4narrative/v4-registry-fresh-100.jsonl > exclude-7320.jsonl
          cat exclude-7320.jsonl archived/v5/v5-change-fresh-100.jsonl > exclude-7420.jsonl
          cat exclude-7420.jsonl archived/v6rejected/v6-dev-50.jsonl > exclude-7470.jsonl
          cat exclude-7470.jsonl archived/v6c/v6c-dev-50.jsonl > exclude-7520.jsonl
          cat exclude-7520.jsonl archived/v6d/v6d-dev-100.jsonl > exclude-7620.jsonl
          uv run python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('exclude-7620.jsonl').read_text().splitlines() if x.strip()]
          orgs=[str(r['organisation_number']) for r in rows]
          assert len(rows)==7620 and len(set(orgs))==7620, (len(rows),len(set(orgs)))
          print({'excluded':len(rows),'unique':len(set(orgs))})
          PY

      - name: Freeze genuinely unseen V6d transfer 100
        run: |
          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude exclude-7620.jsonl \
            --count 100 --seed 20261012 \
            --evaluation-split v6d_first_party_depth_transfer \
            --sample-slice unseen_after_v6d_tuning \
            --output v6d-transfer-100.jsonl --report v6d-transfer-100-selection.json
          uv run python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('v6d-transfer-100-selection.json').read_text())
          assert report['count']==100 and report['overlap_count']==0 and report['excluded_rows']==7620, report
          print(json.dumps(report,indent=2))
          PY
          sha256sum v6d-transfer-100.jsonl > v6d-transfer-100.sha256

      - name: Run frozen V5 incumbent on exact transfer cohort
        run: |
          git worktree add baseline "$BASELINE_SHA"
          (cd baseline && uv sync --locked)
          mkdir -p out/v5
          (cd baseline && uv run python scripts/run_signalpost_v2.py \
            --organisations "$GITHUB_WORKSPACE/v6d-transfer-100.jsonl" \
            --bulk "$GITHUB_WORKSPACE/brreg-enheter.csv" \
            --output "$GITHUB_WORKSPACE/out/v5/output.jsonl" \
            --report "$GITHUB_WORKSPACE/out/v5/report.json" \
            --work-dir "$GITHUB_WORKSPACE/out/v5/work" \
            --run-id v6d-transfer100-v5 \
            --expected-count 100 --workers 8 --site-timeout 6 --wikidata-timeout 8 \
            --max-challenge-requests 2000 --max-third-party-cost-usd 0 --max-wall-runtime-seconds 1200 \
            --annual-workforce-workers 4 --annual-workforce-timeout 60 \
            --annual-workforce-min-start-interval 2.1 --annual-workforce-ocr-pages 8 --annual-workforce-ocr-dpi 110)

      - name: Compute safe challenger headroom
        id: budget
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r=json.load(open('out/v5/report.json'))
          charge=int((r.get('request_budget') or {}).get('observed_conservative_challenge_request_charge') or 0)
          logical=max(0,min(180,(2000-charge)//2))
          if logical < 2:
              raise SystemExit(f'No V6d headroom at incumbent charge {charge}')
          print(f'baseline_charge={charge}')
          print(f'added_logical={logical}')
          PY

      - name: Run hardened V6d challenger without tuning
        run: |
          mkdir -p out/v6d
          uv run python scripts/run_v6d_first_party_depth_hardened.py \
            --input-profiles out/v5/work/profiles.jsonl \
            --report out/v6d/report.json \
            --new-facts out/v6d/new-facts.jsonl \
            --site-audit out/v6d/site-audit.jsonl \
            --timeout 6 \
            --max-added-logical-requests '${{ steps.budget.outputs.added_logical }}' \
            --max-requests-per-site 10 --max-section-pages 4 --max-detail-pages 2

      - name: Build scoring-surface comparison and enforce evidence boundary
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter, defaultdict
          from norway_company_agent.verified_site_depth import _same_registered_domain

          def rows(path):
              return [json.loads(x) for x in Path(path).read_text().splitlines() if x.strip()]

          output=rows('out/v5/output.jsonl')
          profiles=rows('out/v5/work/profiles.jsonl')
          pindex={str(r['organisation_number']):r for r in profiles}
          facts=rows('out/v6d/new-facts.jsonl')
          v5_report=json.loads(Path('out/v5/report.json').read_text())
          v6d=json.loads(Path('out/v6d/report.json').read_text())
          baseline_charge=int('${{ steps.budget.outputs.baseline_charge }}')
          combined=baseline_charge+int(v6d['conservative_request_charge_added'])
          assert combined <= 2000
          assert v6d['third_party_api_cost_usd']==0.0 and v6d['automatic_identity_conflicts_published']==0

          for fact in facts:
              profile=pindex[fact['organisation_number']]
              website=(profile.get('evidence') or {}).get('website') or {}
              identity=((website.get('value') or {}).get('identity_assessment') or {})
              verified=((website.get('value') or {}).get('final_url') or website.get('source_url') or '')
              assert website.get('status')=='available' and identity.get('publishable')
              assert _same_registered_domain(str(fact['source_url']),str(verified)), fact
              assert len(str(fact['content_sha256']))==64

          aliases={
              'descriptions':{'company_description'},
              'workforce':{'workforce_snapshot'},
              'revenue':{'revenue'},
              'roles':{'role'},
              'locations':{'registered_workplace'},
              'websites':{'official_website'},
              'contact_emails':{'contact_email'},
              'social_profiles':{'social_profile'},
              'jobs':{'job_posting'},
              'updates':{'company_update'},
              'registry_changes':{'registry_change'},
          }
          baseline={key:set() for key in aliases}
          for row in output:
              org=str(row.get('organisation_number') or '')
              for fact in row.get('canonical_facts') or []:
                  t=str(fact.get('type') or '')
                  for key,names in aliases.items():
                      if t in names:
                          baseline[key].add(org)
          # Website fallback from exact retained profiles in case canonical naming differs.
          baseline['websites']={str(p['organisation_number']) for p in profiles if ((p.get('evidence') or {}).get('website') or {}).get('status')=='available' and (((p.get('evidence') or {}).get('website') or {}).get('value') or {}).get('identity_assessment',{}).get('publishable')}

          v6d_company_additions=defaultdict(set)
          type_map={'contact_emails':'contact_emails','social_profiles':'social_profiles','jobs':'jobs','updates':'updates','locations':'locations','leadership':'roles'}
          for fact in facts:
              mapped=type_map.get(fact['fact_type'])
              if mapped:
                  v6d_company_additions[mapped].add(fact['organisation_number'])

          comparison={}
          for key in aliases:
              after=set(baseline[key]) | set(v6d_company_additions.get(key,set()))
              comparison[key]={
                  'v5_companies':len(baseline[key]),
                  'v6d_potential_companies':len(after),
                  'net_new_companies':len(after-baseline[key]),
              }
          claims=sum(len(row.get('claims') or []) for row in output)
          evidence=sum(len(row.get('evidence') or []) for row in output)
          contract_errors=sum(len(row.get('errors') or []) for row in output)
          summary={
              'cohort_sha256':Path('v6d-transfer-100.sha256').read_text().split()[0],
              'fresh_companies':100,
              'historical_exclusions':7620,
              'overlap':0,
              'coverage_comparison':comparison,
              'v5_total_claims':claims,
              'v5_evidence_count':evidence,
              'v5_contract_errors_in_outputs':contract_errors,
              'v5_observed_conservative_charge':baseline_charge,
              'v5_wall_runtime_seconds':v5_report.get('wall_runtime_seconds'),
              'v6d_net_new_fact_counts':v6d['net_new_fact_counts'],
              'v6d_net_new_facts':v6d['net_new_facts'],
              'v6d_exact_verified_sites':v6d['exact_verified_sites'],
              'v6d_added_logical_requests':v6d['logical_requests_added'],
              'v6d_added_conservative_charge':v6d['conservative_request_charge_added'],
              'v6d_added_runtime_seconds':v6d['wall_runtime_seconds'],
              'combined_conservative_charge':combined,
              'third_party_api_cost_usd':0.0,
              'wrong_company_publications':0,
              'manual_audit_required_for_every_candidate_fact':True,
          }
          Path('out/v6d-transfer-comparison.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Upload immutable transfer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6d-first-party-depth-transfer
          retention-days: 90
          if-no-files-found: warn
          path: |
            v6d-transfer-100.jsonl
            v6d-transfer-100.sha256
            v6d-transfer-100-selection.json
            out/v5/output.jsonl
            out/v5/report.json
            out/v5/work/profiles.jsonl
            out/v6d/report.json
            out/v6d/new-facts.jsonl
            out/v6d/site-audit.jsonl
            out/v6d-transfer-comparison.json
