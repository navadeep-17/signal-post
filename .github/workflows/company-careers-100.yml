name: Company Careers Frozen-100 Audit

on:
  workflow_dispatch:
  push:
    branches:
      - feature/company-careers-signals
    paths:
      - '.github/workflows/company-careers-100.yml'
      - 'src/norway_company_agent/company_site_careers.py'
      - 'scripts/extract_company_site_careers.py'
      - 'tests/test_company_site_careers.py'

permissions:
  contents: read

jobs:
  careers-frozen-100:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Run careers and full regressions
        run: |
          uv run --with pytest pytest -q tests/test_company_site_careers.py
          uv run --with pytest pytest -q

      - name: Download official BRREG bulk registry
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          test -s brreg-enheter.csv
          sha256sum brreg-enheter.csv > brreg-enheter.sha256

      - name: Download Builderr frozen universe
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://builderr.ai/signalpost-company-universe-2025.jsonl.gz' \
            --output signalpost-universe.jsonl.gz
          test -s signalpost-universe.jsonl.gz
          gzip -t signalpost-universe.jsonl.gz
          sha256sum signalpost-universe.jsonl.gz > signalpost-universe.sha256

      - name: Recreate frozen 100-company development corpus
        run: |
          uv run python select_entry_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --count 1000 \
            --seed 20260823 \
            --output entry-companies.jsonl
          head -n 100 entry-companies.jsonl > benchmark-dev-100.jsonl
          test "$(wc -l < benchmark-dev-100.jsonl)" -eq 100
          DEV_SHA="$(sha256sum benchmark-dev-100.jsonl | cut -d' ' -f1)"
          test "$DEV_SHA" = '51a96f25f79532b9ba285304d540887e0f17410907909dbe6c85c0b41b8341d3'
          printf '%s  %s\n' "$DEV_SHA" benchmark-dev-100.jsonl > benchmark-dev-100.sha256

      - name: Run official baseline plus H1a
        run: |
          mkdir -p out
          uv run python scripts/run_competition_batch.py \
            --organisations benchmark-dev-100.jsonl \
            --bulk brreg-enheter.csv \
            --profiles-output out/h1a-profiles.jsonl \
            --output out/h1a-envelopes.jsonl \
            --report out/h1a-report.json \
            --run-id careers-parent-h1a-100 \
            --expected-count 100 \
            --enable-email-domain-discovery \
            --email-domain-timeout 8 \
            --email-domain-retry-timeout 15

      - name: Run H1c deterministic discovery
        run: |
          uv run python scripts/run_zero_cost_domain_discovery.py \
            --input out/h1a-profiles.jsonl \
            --output out/h1c-pre-guard-profiles.jsonl \
            --report out/h1c-report.json \
            --timeout 6 \
            --max-candidates 2 \
            --workers 8 \
            --promote-verified

      - name: Apply H1c registry-risk guard
        run: |
          uv run python scripts/apply_zero_cost_registry_guard.py \
            --input out/h1c-pre-guard-profiles.jsonl \
            --output out/hardened-profiles.jsonl \
            --report out/h1c-registry-guard-report.json

      - name: Extract company-owned careers signals
        run: |
          uv run python scripts/extract_company_site_careers.py \
            --profiles out/hardened-profiles.jsonl \
            --output out/company-careers-observations.jsonl \
            --report out/company-careers-report.json \
            --timeout 8 \
            --max-pages 2 \
            --workers 6

      - name: Validate observations and build comparison
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, 'src')
          from norway_company_agent.external_footprint import publishable_observation, validate_observation

          def read_jsonl(path):
              path = Path(path)
              if not path.exists():
                  return []
              return [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]

          profiles = read_jsonl('out/hardened-profiles.jsonl')
          observations = read_jsonl('out/company-careers-observations.jsonl')
          h1a = json.loads(Path('out/h1a-report.json').read_text(encoding='utf-8'))
          h1c = json.loads(Path('out/h1c-report.json').read_text(encoding='utf-8'))
          guard = json.loads(Path('out/h1c-registry-guard-report.json').read_text(encoding='utf-8'))
          careers = json.loads(Path('out/company-careers-report.json').read_text(encoding='utf-8'))

          assert len(profiles) == 100
          rejected = [
              {'id': item.get('id'), 'reasons': validate_observation(item)}
              for item in observations if not publishable_observation(item)
          ]
          assert not rejected, rejected
          assert all(item.get('platform') == 'company_site' for item in observations)
          assert all(item.get('signal_type') == 'workforce_snapshot' for item in observations)
          assert all(item.get('acquisition_mode') == 'permitted_public_page' for item in observations)
          assert all(float(item.get('metrics', {}).get('specific_internal_job_links', 0)) >= 0 for item in observations)

          exact_sites = []
          for profile in profiles:
              website = (profile.get('evidence') or {}).get('website') or {}
              identity = (website.get('value') or {}).get('identity_assessment') or {}
              if website.get('status') == 'available' and identity.get('publishable'):
                  exact_sites.append({
                      'organisation_number': profile.get('organisation_number'),
                      'name': profile.get('name'),
                      'url': (website.get('value') or {}).get('final_url') or website.get('source_url'),
                  })

          h1a_requests = int(h1a['operations']['requests'])
          h1c_requests = int(h1c.get('counts', {}).get('requests', 0))
          careers_requests = int(careers.get('counts', {}).get('requests', 0))
          combined_requests = h1a_requests + h1c_requests + careers_requests

          summary = {
              'corpus': {
                  'count': 100,
                  'manifest_sha256': Path('benchmark-dev-100.sha256').read_text().split()[0],
              },
              'verified_sites_entering_careers': len(exact_sites),
              'verified_site_rows': exact_sites,
              'h1c_registry_guard': guard,
              'careers': careers,
              'observations_publishable': len(observations),
              'observation_validation_failures': rejected,
              'budget': {
                  'h1a_requests': h1a_requests,
                  'h1c_requests': h1c_requests,
                  'careers_requests': careers_requests,
                  'combined_requests': combined_requests,
                  'under_2000_request_gate': combined_requests < 2000,
                  'third_party_cost_usd': 0.0,
                  'search_api_requests': 0,
              },
          }
          Path('out/company-careers-comparison.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Verify careers audit invariants
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('out/company-careers-comparison.json').read_text(encoding='utf-8'))
          assert summary['corpus']['count'] == 100, summary
          assert summary['observation_validation_failures'] == [], summary
          assert summary['budget']['third_party_cost_usd'] == 0.0, summary
          assert summary['budget']['search_api_requests'] == 0, summary
          assert summary['budget']['under_2000_request_gate'] is True, summary
          assert summary['verified_sites_entering_careers'] >= 1, summary
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload careers audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-careers-frozen-100
          if-no-files-found: error
          retention-days: 30
          path: |
            benchmark-dev-100.jsonl
            benchmark-dev-100.sha256
            brreg-enheter.sha256
            signalpost-universe.sha256
            out/h1a-profiles.jsonl
            out/h1a-report.json
            out/h1c-pre-guard-profiles.jsonl
            out/h1c-report.json
            out/hardened-profiles.jsonl
            out/h1c-registry-guard-report.json
            out/company-careers-observations.jsonl
            out/company-careers-report.json
            out/company-careers-comparison.json
