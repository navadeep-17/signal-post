name: H2g Corrected Annual Workforce Screen

on:
  workflow_dispatch:
  push:
    branches:
      - "experiment/h2g-annual-report-workforce"
    paths:
      - "scripts/screen_h2g_annual_workforce.py"
      - ".github/workflows/h2g-annual-workforce-screen.yml"

permissions:
  contents: read
  actions: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked

      - name: Reuse locked fresh H2e production cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior
          gh run download 35052080988 \
            --repo navadeep-17/signal-post \
            --name h2e-integrated-production-qualification \
            --dir prior
          test -s prior/out/integrated-work/profiles.jsonl
          test "$(wc -l < prior/out/integrated-work/profiles.jsonl)" -eq 300

      - name: Screen corrected BRREG annual-report workforce extraction
        run: |
          mkdir -p out
          uv run python scripts/screen_h2g_annual_workforce.py \
            --profiles prior/out/integrated-work/profiles.jsonl \
            --output out/h2g-observations.jsonl \
            --report out/h2g-report.json \
            --audit out/h2g-audit.jsonl \
            --limit 60 \
            --timeout 60 \
            --min-start-interval 2.1

      - name: Verify H2g screen invariants
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('out/h2g-report.json').read_text())
          assert report['passed'] is True, report
          assert report['profiles'] == 300, report
          assert report['selected'] == 60, report
          assert report['requests'] == 60, report
          assert report['third_party_cost_usd'] == 0.0, report
          assert not report['observation_validation_errors'], report
          print(json.dumps({
              'eligible': report['eligible'],
              'selected': report['selected'],
              'accepted': report['accepted'],
              'accepted_rate': report['accepted_rate_over_selected'],
              'needs_ocr': report['needs_ocr_without_digital_match'],
              'status_counts': report['status_counts'],
          }, indent=2))
          PY

      - name: Upload H2g screen artifacts
        uses: actions/upload-artifact@v4
        with:
          name: h2g-corrected-annual-workforce-screen
          if-no-files-found: error
          path: |
            out/h2g-report.json
            out/h2g-audit.jsonl
            out/h2g-observations.jsonl
