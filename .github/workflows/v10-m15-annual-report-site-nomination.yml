name: V10 M15 Annual Report Site Nomination Screen

on:
  push:
    branches:
      - experiment/v10-m15-annual-report-site-nomination
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v10-m15-annual-report-site-nomination
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}/src
  FROZEN_CONSUMED_SOURCE_SHA256: 80e8f5c88b2d2facc1a00c20677a0930240f40fc75a36a27bee16c54efa2de26
  BRREG_SNAPSHOT_SHA256: 1145bc28c54c6fe10be3a89e529a35832fd67cb34cd9933c0f4418d446512615

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install locked runtime and OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          uv sync --locked

      - name: Run focused M15 tests and compile
        run: |
          uv run --with pytest pytest -q tests/test_v10_m15_annual_report_site_nomination.py
          python -m py_compile \
            src/norway_company_agent/annual_report_site_nomination.py \
            scripts/build_v10_m15_consumed_cohort.py \
            scripts/screen_v10_m15_annual_report_site_nomination.py

      - name: Verify immutable input artifacts
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10508036929" --jq .digest)" = \
            'sha256:2f0fbb29ccb7c71b6b593f7e041b3ba4353256674cb404dfc2ebf56f50964a47'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11393772677" --jq .digest)" = \
            'sha256:b7dd01b666470d155d2c70274bb8d1cb2695abc9d2f331d6a41eafe447c023f8'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11459496712" --jq .digest)" = \
            'sha256:01e100b09c5e71d630facaab2fdcc006767c3c241d0e3450ac8d8075cbf21e98'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11478129358" --jq .digest)" = \
            'sha256:fb33af0c411848cb2f9a8a37610dc8953afe12e1c9c19d5636767002a0e12f69'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11482816122" --jq .digest)" = \
            'sha256:e89e9f2d7294dea39168743e246ac680ed32dc9e5aad7039f01ff7ee54ff90fb'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11483268561" --jq .digest)" = \
            'sha256:3e25ab6b869eaf87d7e213d00378e19a4413dd0dcf01ad0058a942324213ae32'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11485329792" --jq .digest)" = \
            'sha256:f6c2839a409dd3d9e2aa4bdd7e8ceeae04f94f4f7858ec374313a3fce0c72bcc'

      - name: Recover frozen consumed source, BRREG snapshot and exclusion cohorts
        run: |
          set -euo pipefail
          mkdir -p frozen/source frozen/pr137 frozen/m10 frozen/m13 frozen/m14 frozen/m14b frozen/m13b

          gh run download 35246833190 --repo "$GITHUB_REPOSITORY" \
            --name final-release-manifest-1000 --dir frozen/source
          SOURCE="$(find frozen/source -type f -name 'final-release-1000.jsonl' | head -n 1)"
          test -n "$SOURCE"
          cp "$SOURCE" frozen/consumed-1000.jsonl
          test "$(sha256sum frozen/consumed-1000.jsonl | awk '{print $1}')" = "$FROZEN_CONSUMED_SOURCE_SHA256"

          gh run download 37421325313 --repo "$GITHUB_REPOSITORY" \
            --name v9-consumed-baseline --dir frozen/pr137
          PR137="$(find frozen/pr137 -type f -name 'gate-a-20.jsonl' | head -n 1)"
          test -n "$PR137"
          cp "$PR137" frozen/pr137-gate-a-20.jsonl

          gh run download 37567829642 --repo "$GITHUB_REPOSITORY" \
            --name v9-m10-gate-b-frozen-inputs --dir frozen/m10
          BULK="$(find frozen/m10 -type f -name 'brreg-enheter.csv' | head -n 1)"
          M10="$(find frozen/m10 -type f -name 'gate-b-100.jsonl' | head -n 1)"
          test -n "$BULK"
          test -n "$M10"
          cp "$BULK" frozen/brreg-enheter.csv
          cp "$M10" frozen/m10-gate-b-100.jsonl
          test "$(sha256sum frozen/brreg-enheter.csv | awk '{print $1}')" = "$BRREG_SNAPSHOT_SHA256"

          gh run download 37612496445 --repo "$GITHUB_REPOSITORY" \
            --name v9-m13-frozen-cohort --dir frozen/m13
          M13="$(find frozen/m13 -type f -name 'm13-consumed-100.jsonl' | head -n 1)"
          test -n "$M13"
          cp "$M13" frozen/m13-consumed-100.jsonl

          gh run download 37622216471 --repo "$GITHUB_REPOSITORY" \
            --name v9-m14-frozen-inputs --dir frozen/m14
          M14="$(find frozen/m14 -type f -name 'm14-consumed-100.jsonl' | head -n 1)"
          test -n "$M14"
          cp "$M14" frozen/m14-consumed-100.jsonl

          gh run download 37624617561 --repo "$GITHUB_REPOSITORY" \
            --name v9-m14b-frozen-inputs --dir frozen/m14b
          M14B="$(find frozen/m14b -type f -name 'm14b-consumed-100.jsonl' | head -n 1)"
          test -n "$M14B"
          cp "$M14B" frozen/m14b-consumed-100.jsonl

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11485329792/zip" \
            -o frozen/m13b.zip
          unzip -q frozen/m13b.zip -d frozen/m13b
          M13B="$(find frozen/m13b -type f -name 'm13b-consumed-100.jsonl' | head -n 1)"
          test -n "$M13B"
          cp "$M13B" frozen/m13b-consumed-100.jsonl

      - name: Freeze new consumed M15 20 before observing annual-report text
        run: |
          uv run python scripts/build_v10_m15_consumed_cohort.py \
            --source-manifest frozen/consumed-1000.jsonl \
            --bulk frozen/brreg-enheter.csv \
            --exclude frozen/pr137-gate-a-20.jsonl \
            --exclude frozen/m10-gate-b-100.jsonl \
            --exclude frozen/m13-consumed-100.jsonl \
            --exclude frozen/m14-consumed-100.jsonl \
            --exclude frozen/m14b-consumed-100.jsonl \
            --exclude frozen/m13b-consumed-100.jsonl \
            --output frozen/m15-consumed-20.jsonl \
            --report frozen/m15-cohort-report.json \
            --count 20

          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("frozen/m15-cohort-report.json").read_text())
          assert r["selected_companies"] == 20, r
          assert r["fresh_companies_used"] == 0, r
          assert r["eligible_after_exclusions"] >= 20, r
          print({
              "selected_companies": r["selected_companies"],
              "eligible_after_exclusions": r["eligible_after_exclusions"],
              "fresh_companies_used": r["fresh_companies_used"],
              "target_manifest_sha256": r["target_manifest_sha256"],
              "registry_snapshot_sha256": r["registry_snapshot_sha256"],
          })
          PY

      - name: Run unchanged V8 base collector on identical 20
        run: |
          mkdir -p baseline/work
          uv run python scripts/run_signalpost_final.py \
            --organisations frozen/m15-consumed-20.jsonl \
            --bulk frozen/brreg-enheter.csv \
            --output baseline/output.jsonl \
            --report baseline/report.json \
            --product-output baseline/product.html \
            --work-dir baseline/work \
            --run-id v10-m15-baseline \
            --expected-count 20 \
            --workers 8 \
            --site-timeout 6 \
            --wikidata-timeout 8 \
            --max-challenge-requests 2000 \
            --max-third-party-cost-usd 0 \
            --max-wall-runtime-seconds 2400 \
            --annual-workforce-workers 4 \
            --annual-workforce-timeout 60 \
            --annual-workforce-min-start-interval 2.1 \
            --annual-workforce-ocr-pages 8 \
            --annual-workforce-ocr-dpi 110

      - name: Screen official annual-report URL nominations
        run: |
          mkdir -p result
          uv run python scripts/screen_v10_m15_annual_report_site_nomination.py \
            --manifest frozen/m15-consumed-20.jsonl \
            --bulk frozen/brreg-enheter.csv \
            --baseline-output baseline/output.jsonl \
            --output result/m15-screen.jsonl \
            --report result/m15-report.json \
            --manual-audit result/m15-manual-audit.jsonl \
            --annual-timeout 60 \
            --ocr-pages 8 \
            --ocr-dpi 110 \
            --site-timeout 6 \
            --max-site-candidates 1

      - name: Enforce predeclared decision contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("result/m15-report.json").read_text())
          assert r["companies"] == 20, r
          assert r["fresh_companies_used"] == 0, r
          assert r["minimum_net_new_verified_website_companies"] == 2, r
          assert r["third_party_api_cost_usd"] == 0, r
          assert r["search_api_requests"] == 0, r
          assert r["publication_authorized"] is False, r
          assert r["production_promotion_authorized"] is False, r
          assert r["fresh_qualification_authorized"] is False, r
          assert not r["evidence_defects"], r
          assert not r["execution_errors"], r
          assert r["machine_decision"] in {"SHELVE_LOW_YIELD", "MANUAL_AUDIT_REQUIRED"}, r
          print(json.dumps(r, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v10-m15-consumed-annual-report-site-screen
          retention-days: 30
          if-no-files-found: warn
          path: |
            frozen/m15-consumed-20.jsonl
            frozen/m15-cohort-report.json
            result/
            baseline/report.json
