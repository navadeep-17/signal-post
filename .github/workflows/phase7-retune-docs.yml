name: Phase 7 Retune Docs

on:
  push:
    branches:
      - feature/stotteregisteret-support-awards
    paths:
      - .github/workflows/phase7-retune-docs.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update implementation history and roadmap
        run: python scripts/update_phase7_retune_docs.py
      - name: Normalize documentation EOFs
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("docs/IMPLEMENTATION_LOG.md", "docs/70_PLUS_IMPLEMENTATION_PLAN.md"):
              path = Path(name)
              path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY
      - name: Commit documentation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/IMPLEMENTATION_LOG.md docs/70_PLUS_IMPLEMENTATION_PLAN.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No documentation changes needed"
            exit 0
          fi
          git commit -m "docs: record PR97 immutable-layer retune"
          git push origin HEAD:feature/stotteregisteret-support-awards
