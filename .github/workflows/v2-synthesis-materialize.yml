name: V2 Synthesis Product Materializer

on:
  push:
    branches:
      - "revision/v2-synthesis-ux"
    paths:
      - ".github/workflows/v2-synthesis-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revision/v2-synthesis-ux
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Build deterministic V2 product
        run: uv run python scripts/build_certified_v2_product.py --output submission/signalpost-v2.html --expect-count 1000
      - name: Verify synthesis and regenerated product
        run: |
          uv run --with pytest pytest -q tests/test_synthesis.py tests/test_v2_product_artifact.py
      - name: Commit generated product and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission/signalpost-v2.html
          git rm .github/workflows/v2-synthesis-materialize.yml
          git commit -m "build(v2): materialize synthesis product"
          git push origin HEAD:revision/v2-synthesis-ux
