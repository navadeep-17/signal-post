name: Registry Snapshot Drift Smoke

on:
  pull_request:
    paths:
      - "src/norway_company_agent/batch.py"
      - "tests/test_registry_snapshot_drift.py"
      - ".github/workflows/registry-snapshot-drift-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync and run drift regressions
        run: |
          uv sync --locked
          uv run --with pytest pytest -q tests/test_registry_snapshot_drift.py

      - name: Download current BRREG bulk
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          test -s brreg-enheter.csv
          sha256sum brreg-enheter.csv > brreg-enheter.sha256

      - name: Create present-plus-drift corpus
        run: |
          cat > drift-smoke.jsonl <<'EOF'
          {"organisation_number":"971424079","evaluation_split":"snapshot_drift_smoke","sample_slice":"present_control"}
          {"organisation_number":"928987728","evaluation_split":"snapshot_drift_smoke","sample_slice":"known_snapshot_missing"}
          EOF

      - name: Run production final runner
        run: |
          uv run python scripts/run_signalpost_final.py \
            --organisations drift-smoke.jsonl \
            --bulk brreg-enheter.csv \
            --output out/drift-final.jsonl \
            --report out/drift-report.json \
            --work-dir out/drift-work \
            --run-id registry-snapshot-drift-smoke \
            --expected-count 2 \
            --workers 2 \
            --site-timeout 6 \
            --wikidata-timeout 8 \
            --max-challenge-requests 50 \
            --max-third-party-cost-usd 0 \
            --max-wall-runtime-seconds 600

      - name: Assert honest terminal snapshot-drift semantics
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          missing_org = '928987728'
          report = json.loads(Path('out/drift-report.json').read_text())
          profiles = [json.loads(line) for line in Path('out/drift-work/profiles.jsonl').read_text().splitlines() if line.strip()]
          outputs = [json.loads(line) for line in Path('out/drift-final.jsonl').read_text().splitlines() if line.strip()]
          by_profile = {row['organisation_number']: row for row in profiles}
          by_output = {row['organisation_number']: row for row in outputs}

          assert report['passed'] is True, report
          assert report['final_objects'] == 2
          assert report['registry']['requested'] == 2
          assert report['registry']['selected'] == 1, report['registry']
          assert report['registry']['missing_count'] == 1, report['registry']
          assert report['registry']['missing_organisation_numbers'] == [missing_org], report['registry']
          assert report['contract_errors'] == []
          assert report['change_errors'] == []
          assert report['budget_errors'] == []
          assert report['source_policy']['third_party_cost_usd'] == 0.0
          assert report['source_policy']['search_api_requests'] == 0
          assert report['request_budget']['observed_conservative_challenge_request_charge'] <= 50

          missing = by_profile[missing_org]
          assert missing['registry_snapshot_missing'] is True
          assert missing['evidence']['registry']['status'] == 'not_found'
          assert missing['evidence']['accounting_obligation']['status'] == 'not_found'
          for key in ('name', 'legal_form', 'municipality', 'website'):
              assert key not in missing, (key, missing.get(key))

          output = by_output[missing_org]
          assert output['run']['terminal_status'] == 'completed'
          assert not any(
              claim['field'] in {'legal_name', 'legal_form', 'municipality'}
              and claim['availability'] == 'available'
              for claim in output['claims']
          )
          print(json.dumps({
              'final_objects': report['final_objects'],
              'registry': report['registry'],
              'observed_conservative_requests': report['request_budget']['observed_conservative_challenge_request_charge'],
              'missing_terminal_status': output['run']['terminal_status'],
              'missing_registry_status': missing['evidence']['registry']['status'],
              'live_registry_status': missing['evidence']['registry_live']['status'],
          }, indent=2))
          PY

      - name: Upload drift smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-snapshot-drift-smoke
          if-no-files-found: error
          retention-days: 30
          path: |
            brreg-enheter.sha256
            drift-smoke.jsonl
            out/drift-final.jsonl
            out/drift-report.json
            out/drift-work/profiles.jsonl
            out/drift-work/internal-envelopes.jsonl
