name: V2 Repair Sampling

on:
  push:
    branches:
      - feature/v2-canonical-product-surface
    paths:
      - .github/workflows/v2-repair-sampling.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2-canonical-product-surface
          fetch-depth: 0
      - name: Restore frozen V1 sampling and apply only industry normalization
        shell: bash
        run: |
          set -euo pipefail
          git show 60c5b0852f41ddd7d5ef51b2c68b4d7fe0f1e4aa:src/norway_company_agent/sampling.py > /tmp/sampling-v1.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/sampling-v1.py')
          text = path.read_text(encoding='utf-8')
          old = '''    try:\n        employees = int(employees_raw) if employees_raw else None\n    except ValueError:\n        employees = None\n    return {\n'''
          new = '''    try:\n        employees = int(employees_raw) if employees_raw else None\n    except ValueError:\n        employees = None\n    industry_code = _first(row, "naeringskode1.kode", "Næringskode1.kode")\n    industry_label = _first(row, "naeringskode1.beskrivelse", "Næringskode1.beskrivelse")\n    industry = None\n    if industry_code or industry_label:\n        industry = {"code": industry_code or None, "label": industry_label or None}\n    return {\n'''
          if text.count(old) != 1:
              raise SystemExit('normalization anchor mismatch')
          text = text.replace(old, new, 1)
          text = text.replace(
              '        "industry_code": _first(row, "naeringskode1.kode", "Næringskode1.kode"),\n'
              '        "industry_label": _first(row, "naeringskode1.beskrivelse", "Næringskode1.beskrivelse"),\n',
              '        "industry_code": industry_code,\n'
              '        "industry_label": industry_label,\n'
              '        "industry": industry,\n',
              1,
          )
          Path('src/norway_company_agent/sampling.py').write_text(text, encoding='utf-8')
          PY
          git diff -- src/norway_company_agent/sampling.py
          changed=$(git diff --numstat 60c5b0852f41ddd7d5ef51b2c68b4d7fe0f1e4aa -- src/norway_company_agent/sampling.py)
          echo "sampling diff: $changed"
          additions=$(echo "$changed" | awk '{print $1}')
          deletions=$(echo "$changed" | awk '{print $2}')
          test "$additions" -le 10
          test "$deletions" -le 2
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2-repair-sampling.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/norway_company_agent/sampling.py .github/workflows/v2-repair-sampling.yml
          git commit -m "fix(v2): restore sampling tail and retain industry mapping"
          git push origin HEAD:feature/v2-canonical-product-surface
