name: Research Doffindata Current-Main Overlap

on:
  push:
    branches:
      - research/bulk-exact-org-recall
    paths:
      - .github/workflows/research-doffindata-current-main-overlap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compare recent Doffin awards with production Støtteregisteret on consumed 1000
        run: |
          python - <<'PY'
          import base64
          import copy
          import datetime as dt
          import json
          import re
          import uuid
          import sys
          from pathlib import Path
          from urllib.parse import urlparse,parse_qs
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError

          sys.path.insert(0, str(Path("src").resolve()))
          from norway_company_agent.support_registry import fetch_support_award_batch

          REPORT="1e4ba2c1-d15e-41c3-8cba-6166c3812f1a"
          TOKEN_URL=(
              "https://api.doffin.no/webclient/api/v2/notices-api/"
              f"getEmbedToken?reportId={REPORT}"
          )
          UA="Signalpost-research-source-screen/1.0"
          TODAY=dt.date(2026,10,6)
          CUTOFF=TODAY-dt.timedelta(days=365)

          companies=[]
          for line in Path("submission/final-release-1000.jsonl").read_text(encoding="utf-8").splitlines():
              if not line.strip(): continue
              row=json.loads(line)
              org=str(row.get("organisation_number") or "")
              if re.fullmatch(r"\d{9}",org):
                  companies.append({"organisation_number":org,"name":row.get("name")})
          targets={x["organisation_number"] for x in companies}
          names={x["organisation_number"]:x.get("name") or "" for x in companies}
          print("cohort=",len(targets))
          if len(targets)!=1000: raise SystemExit("unexpected cohort")

          def req(url,headers=None,data=None,timeout=60):
              h={"User-Agent":UA,"Accept":"application/json"}
              if headers:h.update(headers)
              body=None
              if data is not None:
                  body=json.dumps(data,separators=(",",":")).encode()
                  h["Content-Type"]="application/json"
              r=Request(url,data=body,headers=h)
              try:
                  with urlopen(r,timeout=timeout) as x:
                      raw=x.read(); status=x.status
              except HTTPError as e:
                  raw=e.read(); status=e.code
              try: obj=json.loads(raw.decode("utf-8-sig")) if raw else {}
              except Exception: obj={}
              return status,obj,raw

          st,embed,_=req(TOKEN_URL)
          if st!=200: raise SystemExit("embed unavailable")
          token=embed.get("accessToken") or ""
          embed_url=(embed.get("embedUrl") or [""])[0]
          q=parse_qs(urlparse(embed_url).query)
          cfg=q.get("config",[""])[0]
          cfg += "="*((4-len(cfg)%4)%4)
          config=json.loads(base64.b64decode(cfg).decode())
          cluster=(config.get("clusterUrl") or "").rstrip("/")
          if not token or not cluster: raise SystemExit("incomplete embed contract")

          def headers():
              return {
                  "Authorization":f"EmbedToken {token}",
                  "ActivityId":str(uuid.uuid4()),
                  "RequestId":str(uuid.uuid4()),
                  "X-PowerBI-HostEnv":"Embed for Customers",
                  "Origin":"https://app.powerbi.com",
                  "Referer":"https://app.powerbi.com/",
              }

          model_url=(
              f"{cluster}/explore/reports/{REPORT}/modelsAndExploration"
              "?preferReadOnlySession=true&skipQueryData=true"
          )
          st,model,_=req(model_url,headers())
          if st!=200: raise SystemExit("model unavailable")
          exploration=model.get("exploration") or {}
          report=exploration.get("report") or {}
          model_id=report.get("modelId")
          db_name=(report.get("model") or {}).get("dbName")

          schema_url=f"{cluster}/explore/reports/{REPORT}/conceptualschema?userPreferredLocale=nb-NO"
          st,schema,_=req(schema_url,headers())
          if st!=200: raise SystemExit("schema unavailable")
          entities=((schema.get("schema") or {}).get("Entities") or [])
          props={}
          for ent in entities:
              props[ent.get("Name")]={
                  p.get("Name") for p in ent.get("Properties") or [] if p.get("Name")
              }
          base_props=props.get("base_notices") or set()
          publication_candidates=sorted(
              p for p in base_props
              if "publ" in p.lower() and ("date" in p.lower() or "time" in p.lower())
          )
          print("base-publication-date-candidates=",publication_candidates)
          preferred=[
              "publication_datetime","publication_date","publicationDate",
              "publication_datetime_notice","published_at","publication_time",
          ]
          publication_prop=next((p for p in preferred if p in base_props),None)
          if not publication_prop and publication_candidates:
              publication_prop=publication_candidates[0]
          print("selected-publication-date-property=",publication_prop or "")

          native=None; visual_name=None
          for section in exploration.get("sections") or []:
              for visual in section.get("visualContainers") or []:
                  qraw=visual.get("query")
                  if not qraw: continue
                  try:qobj=json.loads(qraw) if isinstance(qraw,str) else qraw
                  except Exception:continue
                  txt=json.dumps(qobj,ensure_ascii=False)
                  if "winner_eeig_official_name_nor" not in txt: continue
                  selects=[]
                  for command in qobj.get("Commands") or []:
                      sq=command.get("SemanticQueryDataShapeCommand") or {}
                      selects.extend((sq.get("Query") or {}).get("Select") or [])
                  if len(selects)==1:
                      native=qobj
                      cfgraw=visual.get("config") or "{}"
                      try:vcfg=json.loads(cfgraw) if isinstance(cfgraw,str) else cfgraw
                      except Exception:vcfg={}
                      visual_name=(vcfg or {}).get("name")
                      break
              if native: break
          if not native: raise SystemExit("native query missing")

          exact=copy.deepcopy(native)
          cmd=(exact.get("Commands") or [])[0].get("SemanticQueryDataShapeCommand")
          query=cmd["Query"]
          desired=[
              ("e","winner_eu_registration_number","winner_org"),
              ("e","winner_eeig_official_name_nor","winner_name"),
              ("e","doffin_identifier","doffin_identifier"),
              ("e","contract_conclusion_date","contract_conclusion_date"),
              ("e","winner_decision_date","winner_decision_date"),
          ]
          if publication_prop:
              desired.append(("b",publication_prop,"notice_publication_date"))

          query["From"]=[
              {"Name":"e","Entity":"enriched_notice_lot_settled_contracts_with_winners_and_contract_values","Type":0},
              {"Name":"b","Entity":"base_notices","Type":0},
              {"Name":"b1","Entity":"base_notice_lot_results","Type":0},
          ]
          query["Select"]=[]
          for source,prop,label in desired:
              entity="enriched_notice_lot_settled_contracts_with_winners_and_contract_values" if source=="e" else "base_notices"
              query["Select"].append({
                  "Column":{"Expression":{"SourceRef":{"Source":source}},"Property":prop},
                  "Name":entity+"."+prop,
                  "NativeReferenceName":label,
              })
          where=list(query.get("Where") or [])
          where.append({
              "Condition":{"In":{
                  "Expressions":[{"Column":{
                      "Expression":{"SourceRef":{"Source":"e"}},
                      "Property":"winner_eu_registration_number"
                  }}],
                  "Values":[[{"Literal":{"Value":"'"+org+"'"}}] for org in sorted(targets)]
              }}
          })
          query["Where"]=where
          cmd["Binding"]={
              "Primary":{"Groupings":[{"Projections":list(range(len(desired)))}]},
              "DataReduction":{"DataVolume":6,"Primary":{"Window":{"Count":2000}}},
              "IncludeEmptyGroups":False,
              "Version":1,
          }
          cmd["ExecutionMetricsKind"]=1
          item={"Query":exact}
          if db_name:
              item["ApplicationContext"]={
                  "DatasetId":db_name,
                  "Sources":[{"ReportId":REPORT,"VisualId":visual_name or "signalpost-overlap"}],
              }
          body={"version":"1.0.0","queries":[item],"cancelQueries":[],"modelId":model_id}
          st,resp,raw=req(cluster+"/explore/querydata?synchronous=true",headers(),body)
          print("doffin-query-http=",st,"bytes=",len(raw))
          if st!=200: raise SystemExit("Doffin detail query failed")

          def dataset(response):
              results=response.get("results") or []
              if not results:return None
              return (((results[0].get("result") or {}).get("data") or {}).get("dsr") or {}).get("DS",[None])[0]

          def decode(ds):
              value_dicts=ds.get("ValueDicts") or {}
              dm=[]
              for ph in ds.get("PH") or []:
                  for key,rows in ph.items():
                      if key.startswith("DM") and isinstance(rows,list): dm.extend(rows)
              specs=None; previous=[]; out=[]
              for row in dm:
                  if row.get("S"):
                      specs=row["S"]; previous=[None]*len(specs)
                  if not specs:continue
                  repeat=int(row.get("R") or 0); nulls=int(row.get("Ø") or 0)
                  cells=list(row.get("C") or []); ci=0; vals=[]
                  for i,spec in enumerate(specs):
                      if repeat & (1<<i): val=previous[i]
                      elif nulls & (1<<i): val=None
                      else:
                          val=cells[ci] if ci<len(cells) else None
                          ci+=1
                          dn=spec.get("DN")
                          if dn and isinstance(val,int):
                              d=value_dicts.get(dn) or []
                              if 0<=val<len(d):val=d[val]
                      vals.append(val)
                  previous=vals; out.append(vals)
              return out

          labels=[x[2] for x in desired]
          rows=decode(dataset(resp))
          recs=[]
          def dateval(v):
              if isinstance(v,(int,float)) and v>10**11:
                  return dt.datetime.fromtimestamp(v/1000,dt.timezone.utc).date()
              if isinstance(v,str):
                  s=v.strip()
                  m=re.match(r"(\d{4}-\d{2}-\d{2})",s)
                  if m:
                      try:return dt.date.fromisoformat(m.group(1))
                      except ValueError:return None
              return None
          for vals in rows:
              rec={labels[i]:(vals[i] if i<len(vals) else None) for i in range(len(labels))}
              org=str(rec.get("winner_org") or "").strip().strip("'")
              if org not in targets:continue
              rec["winner_org"]=org
              dates={
                  k:dateval(rec.get(k))
                  for k in ("contract_conclusion_date","winner_decision_date","notice_publication_date")
                  if k in rec
              }
              rec["dates"]=dates
              recs.append(rec)

          doffin_all={r["winner_org"] for r in recs}
          doffin_recent=set()
          recent_basis={}
          for rec in recs:
              valid=[(k,d) for k,d in rec["dates"].items() if d and CUTOFF<=d<=TODAY]
              if valid:
                  org=rec["winner_org"]; doffin_recent.add(org)
                  latest=max(valid,key=lambda x:x[1])
                  if org not in recent_basis or latest[1]>recent_basis[org][1]:
                      recent_basis[org]=latest

          print("doffin-all-companies=",len(doffin_all))
          print("doffin-recent365-companies=",len(doffin_recent))
          for org in sorted(doffin_recent):
              key,date=recent_basis[org]
              print("DOFFIN-RECENT",org,names.get(org,""),"basis=",key,"date=",date.isoformat())

          # Current production family: exact primary-recipient support awards, <=365 days.
          profiles=[{"organisation_number":x["organisation_number"],"external_observations":[]} for x in companies]
          support_report=fetch_support_award_batch(
              profiles,
              timeout=600.0,
              as_of=TODAY,
              lookback_days=365,
              max_events_per_company=5,
          )
          support_orgs={
              p["organisation_number"] for p in profiles
              if any(
                  isinstance(o,dict) and o.get("signal_type")=="official_support_award"
                  for o in p.get("external_observations") or []
              )
          }
          print("support-status=",support_report.get("status"))
          print("support-requests=",support_report.get("requests"))
          print("support-bytes=",support_report.get("bytes"))
          print("support-recent-companies=",len(support_orgs))

          overlap_all=doffin_all & support_orgs
          overlap_recent=doffin_recent & support_orgs
          net_new_all=doffin_all-support_orgs
          net_new_recent=doffin_recent-support_orgs
          print("doffin-all-overlap-support=",len(overlap_all))
          print("doffin-recent-overlap-support=",len(overlap_recent))
          print("doffin-all-net-new-vs-support=",len(net_new_all))
          print("doffin-recent-net-new-vs-support=",len(net_new_recent))
          print("doffin-all-net-new-rate-pct=",round(100*len(net_new_all)/1000,2))
          print("doffin-recent-net-new-rate-pct=",round(100*len(net_new_recent)/1000,2))
          for org in sorted(net_new_recent):
              key,date=recent_basis[org]
              print("NET-NEW-RECENT",org,names.get(org,""),"basis=",key,"date=",date.isoformat())
          print("VIABILITY current-main-net-new-recent=",len(net_new_recent))
          print("VIABILITY current-main-net-new-all=",len(net_new_all))
          print("VIABILITY production-doffin-shared-requests-if-model-pinned=2")
          print("VIABILITY zero-third-party-cost=True")
          PY
