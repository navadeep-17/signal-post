name: Phase A Final Fresh Disjoint 100 V2

on:
  workflow_dispatch:
  push:
    branches:
      - feature/phaseb-idle-contact-enrichment
    paths:
      - ".github/workflows/phasea-final-fresh-disjoint-100.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: phasea-final-fresh-disjoint-100-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-fresh-100-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      FAILED_EXCLUDE_SHA256: 4ed34945be5f6363a287487fd32ea87b47ab43445a22e2378a32f31695cf94ae
      FAILED_FRESH_SHA256: f74aed4f1c3a389e2a88699f2df02edb01815c1f81cf87d6858cc276dacd5c29
      SECOND_EXCLUDE_SHA256: ae5a1e78a883d75332d93bd0cd88f123e7f1a88300ee3d795067fc73c4cb2f85
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          command -v pdftoppm
          command -v tesseract

      - name: Sync and run full regressions
        run: |
          uv sync --locked
          uv run --with pytest pytest -q

      - name: Download universe and current BRREG bulk
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 240 \
            'https://builderr.ai/signalpost-company-universe-2025.jsonl.gz' \
            --output signalpost-universe.jsonl.gz
          gzip -t signalpost-universe.jsonl.gz
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 240 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          test -s brreg-enheter.csv

      - name: Restore failed fresh attempt as consumed input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prior
          gh run download 37201683517 \
            --repo navadeep-17/signal-post \
            --name phasea-final-fresh-disjoint-100 \
            --dir prior
          test -s prior/phasea-final-exclude.jsonl
          test -s prior/phasea-final-fresh-100.jsonl
          echo "$FAILED_EXCLUDE_SHA256  prior/phasea-final-exclude.jsonl" | sha256sum -c -
          echo "$FAILED_FRESH_SHA256  prior/phasea-final-fresh-100.jsonl" | sha256sum -c -

      - name: Freeze exact 8323-company all-touched exclusion union
        run: |
          uv run python - <<'PY'
          import hashlib, json
          from pathlib import Path

          sources=[Path('prior/phasea-final-exclude.jsonl'),Path('prior/phasea-final-fresh-100.jsonl')]
          rows={}
          counts={}
          for path in sources:
              orgs=set()
              for line in path.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  item=json.loads(line)
                  org=''.join(ch for ch in str(item.get('organisation_number') or '') if ch.isdigit())
                  assert len(org)==9,(path,item)
                  orgs.add(org)
                  rows.setdefault(org,{'organisation_number':org})
              counts[str(path)]=len(orgs)
          out=Path('phasea-v2-exclude.jsonl')
          out.write_text(''.join(json.dumps(rows[org],separators=(',',':'))+'\n' for org in sorted(rows)),encoding='utf-8')
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          report={'source_unique_counts':counts,'union_unique_companies':len(rows),'sha256':digest}
          assert counts['prior/phasea-final-exclude.jsonl']==8223,report
          assert counts['prior/phasea-final-fresh-100.jsonl']==100,report
          assert len(rows)==8323,report
          assert digest=='ae5a1e78a883d75332d93bd0cd88f123e7f1a88300ee3d795067fc73c4cb2f85',report
          Path('phasea-v2-exclude-report.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY
          echo "$SECOND_EXCLUDE_SHA256  phasea-v2-exclude.jsonl" | sha256sum -c -

      - name: Select second untouched Phase A qualification cohort
        run: |
          uv run python scripts/select_disjoint_validation_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --exclude phasea-v2-exclude.jsonl \
            --count 100 \
            --seed 20261103 \
            --evaluation-split phasea_final_fresh_disjoint_qualification_v2 \
            --sample-slice registry_breadth_optional_prevalence_retune \
            --output phasea-v2-fresh-100.jsonl \
            --report phasea-v2-selection.json
          uv run python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('phasea-v2-selection.json').read_text(encoding='utf-8'))
          assert report['count']==100,report
          assert report['overlap_count']==0,report
          assert report['seed']==20261103,report
          rows=[json.loads(x) for x in Path('phasea-v2-fresh-100.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          orgs={str(row['organisation_number']) for row in rows}
          excluded={str(json.loads(x)['organisation_number']) for x in Path('phasea-v2-exclude.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()}
          assert len(rows)==100 and len(orgs)==100,(len(rows),len(orgs))
          assert not (orgs & excluded),len(orgs & excluded)
          print(json.dumps(report,indent=2))
          PY
          sha256sum phasea-v2-fresh-100.jsonl > phasea-v2-fresh-100.sha256

      - name: Run actual V8 evaluator path
        run: |
          mkdir -p out
          uv run python scripts/run_signalpost_v8.py \
            --organisations phasea-v2-fresh-100.jsonl \
            --bulk brreg-enheter.csv \
            --output out/phasea-v2-output.jsonl \
            --report out/phasea-v2-report.json \
            --product-output out/phasea-v2-product.html \
            --work-dir out/phasea-v2-work \
            --run-id phasea-final-fresh-disjoint-100-v2 \
            --workers 8 \
            --site-timeout 6 \
            --wikidata-timeout 8 \
            --max-third-party-cost-usd 0 \
            --annual-workforce-workers 4 \
            --annual-workforce-timeout 60 \
            --annual-workforce-min-start-interval 2.1 \
            --annual-workforce-ocr-pages 8 \
            --annual-workforce-ocr-dpi 110

      - name: Verify predeclared fresh evidence, coverage and safety theorem
        run: |
          uv run python - <<'PY'
          import json, os
          from pathlib import Path

          def read_jsonl(path):
              return [json.loads(line) for line in Path(path).read_text(encoding='utf-8').splitlines() if line.strip()]

          rows=read_jsonl('out/phasea-v2-output.jsonl')
          profiles=read_jsonl('out/phasea-v2-work/profiles.jsonl')
          report=json.loads(Path('out/phasea-v2-report.json').read_text(encoding='utf-8'))
          selection=json.loads(Path('phasea-v2-selection.json').read_text(encoding='utf-8'))
          assert len(rows)==100 and len(profiles)==100,(len(rows),len(profiles))
          assert len({str(row['organisation_number']) for row in rows})==100
          assert selection['overlap_count']==0,selection
          assert report['final_objects']==100,report.get('final_objects')
          assert report['passed'] is True,report.get('checks')
          assert not report.get('contract_errors'),report.get('contract_errors')
          assert not (report.get('canonical_projection') or {}).get('validation_errors'),report.get('canonical_projection')
          assert not (report.get('synthesis') or {}).get('validation_errors'),report.get('synthesis')

          rb=report['request_budget']
          assert rb['official_logical_requests_per_profile_ceiling']==5,rb
          assert rb['site_logical_requests_per_profile_ceiling']==4,rb
          assert rb['total_logical_requests_per_profile_ceiling']==9,rb
          assert rb['theoretical_challenge_request_charge_ceiling']<=2000,rb
          assert rb['observed_conservative_challenge_request_charge']<=2000,rb
          assert rb['max_challenge_requests']<=2000,rb
          assert report['source_policy']['third_party_cost_usd']==0.0,report['source_policy']
          assert report['source_policy']['search_api_requests']==0,report['source_policy']

          exact_fields={
              'forced_dissolution':('/underTvangsavviklingEllerTvangsopplosning','forced_dissolution','company.forced_dissolution'),
              'foundation_date':('/stiftelsesdato','foundation_date','company.foundation_date'),
              'articles_date':('/vedtektsdato','articles_date','company.articles_date'),
              'registered_in_enterprise_register':('/registrertIForetaksregisteret','registered_in_enterprise_register','company.registered_in_enterprise_register'),
              'enterprise_register_date':('/registreringsdatoForetaksregisteret','enterprise_register_date','company.enterprise_register_date'),
              'institutional_sector':('/institusjonellSektorkode','institutional_sector','company.institutional_sector'),
              'registered_capital':('/kapital','registered_capital','company.registered_capital'),
              'registered_in_vat_register':('/registrertIMvaregisteret','registered_in_vat_register','company.registered_in_vat_register'),
              'vat_registration_date':('/registreringsdatoMerverdiavgiftsregisteret','vat_registration_date','company.vat_registration_date'),
              'postal_address':('/postadresse','postal_address','company.postal_address'),
              'registration_date':('/registreringsdatoEnhetsregisteret','registration_date','company.registration_date'),
              'registered_address':('/forretningsadresse','registered_address','company.registered_address'),
          }
          coverage={field:set() for field in exact_fields}
          evidence_errors=[]
          phone_audit=[]
          external_phone_companies=set()
          external_email_companies=set()
          registered_phone_companies=set()
          description_companies=set()
          purpose_companies=set()

          for row in rows:
              org=str(row['organisation_number'])
              evidence={str(item.get('id')):item for item in row.get('evidence') or [] if item.get('id')}
              facts=row.get('canonical_facts') or []
              legal_name=next((claim.get('value') for claim in row.get('claims') or [] if claim.get('field')=='legal_name' and claim.get('availability')=='available'),None)
              for claim in row.get('claims') or []:
                  if claim.get('availability')!='available':
                      continue
                  field=str(claim.get('field') or '')
                  if field=='company_description': description_companies.add(org)
                  if field=='registered_purpose': purpose_companies.add(org)
                  if field in {'registered_phone','registered_mobile'}: registered_phone_companies.add(org)
                  if field=='external.contact_email': external_email_companies.add(org)
                  if field=='external.contact_phone':
                      external_phone_companies.add(org)
                      value=str(claim.get('value') or '')
                      assert value.startswith('+47') and len(value)==11 and value[1:].isdigit(),claim
                      refs=claim.get('evidence_ids') or []
                      assert len(refs)==1,claim
                      item=evidence[str(refs[0])]
                      assert item.get('source_class')=='company_owned',item
                      assert str(item.get('source_url') or '').startswith(('http://','https://')),item
                      assert len(str(item.get('content_sha256') or ''))==64,item
                      assert value in str(item.get('claim_span') or ''),item
                      matches=[fact for fact in facts if fact.get('type')=='contact_phone' and fact.get('value')==claim.get('value')]
                      assert len(matches)==1,(org,claim,matches)
                      phone_audit.append({
                          'organisation_number':org,
                          'legal_name':legal_name,
                          'phone':value,
                          'source_url':item.get('source_url'),
                          'content_sha256':item.get('content_sha256'),
                          'claim_span':item.get('claim_span'),
                          'evidence_id':item.get('id'),
                      })
                  if field not in exact_fields:
                      continue
                  coverage[field].add(org)
                  source_path,fact_type,canonical_field=exact_fields[field]
                  refs=claim.get('evidence_ids') or []
                  if len(refs)!=1:
                      evidence_errors.append((org,field,'expected one evidence id'))
                      continue
                  item=evidence.get(str(refs[0]))
                  if not item:
                      evidence_errors.append((org,field,'missing evidence object'))
                      continue
                  if item.get('source_class')!='official': evidence_errors.append((org,field,'source class'))
                  if item.get('source_field')!=source_path: evidence_errors.append((org,field,'source field'))
                  if item.get('source_row_key')!=org: evidence_errors.append((org,field,'source row'))
                  if not str(item.get('source_url') or '').endswith('/'+org): evidence_errors.append((org,field,'source url'))
                  if len(str(item.get('content_sha256') or ''))!=64: evidence_errors.append((org,field,'hash'))
                  matches=[fact for fact in facts if fact.get('type')==fact_type]
                  if len(matches)!=1:
                      evidence_errors.append((org,field,f'canonical count {len(matches)}'))
                  elif matches[0].get('canonical_field')!=canonical_field or matches[0].get('value')!=claim.get('value'):
                      evidence_errors.append((org,field,'canonical mismatch'))

          assert not evidence_errors,evidence_errors[:20]

          assert len(coverage['forced_dissolution'])>=95,len(coverage['forced_dissolution'])
          assert len(coverage['foundation_date'])>=90,len(coverage['foundation_date'])
          assert len(coverage['articles_date'])>=80,len(coverage['articles_date'])
          assert len(coverage['registered_in_enterprise_register'])>=95,len(coverage['registered_in_enterprise_register'])
          assert len(coverage['enterprise_register_date'])>=90,len(coverage['enterprise_register_date'])
          assert len(coverage['institutional_sector'])>=90,len(coverage['institutional_sector'])
          assert len(coverage['registered_capital'])>=80,len(coverage['registered_capital'])
          assert len(coverage['registered_in_vat_register'])>=95,len(coverage['registered_in_vat_register'])
          assert len(coverage['registration_date'])>=95,len(coverage['registration_date'])
          assert len(coverage['registered_address'])>=95,len(coverage['registered_address'])
          assert len(description_companies)>=95,len(description_companies)
          assert len(purpose_companies)>=90,len(purpose_companies)

          assert len(coverage['vat_registration_date'])>0,len(coverage['vat_registration_date'])
          assert len(coverage['postal_address'])>0,len(coverage['postal_address'])

          Path('out/phasea-v2-phone-audit.jsonl').write_text(
              ''.join(json.dumps(item,ensure_ascii=False,separators=(',',':'))+'\n' for item in phone_audit),
              encoding='utf-8'
          )
          combined_phone=registered_phone_companies|external_phone_companies
          summary={
              'schema':'signalpost-phasea-final-fresh-disjoint-v2',
              'repository_sha':os.environ.get('GITHUB_SHA'),
              'companies':100,
              'unique_companies':100,
              'overlap_count':selection['overlap_count'],
              'seed':selection['seed'],
              'exclude_manifest_sha256':'ae5a1e78a883d75332d93bd0cd88f123e7f1a88300ee3d795067fc73c4cb2f85',
              'cohort_sha256':selection['output_sha256'],
              'claim_company_coverage':{field:len(orgs) for field,orgs in sorted(coverage.items())},
              'company_description_companies':len(description_companies),
              'registered_purpose_companies':len(purpose_companies),
              'external_contact_phone_companies':len(external_phone_companies),
              'external_contact_email_companies':len(external_email_companies),
              'registered_phone_or_mobile_companies':len(registered_phone_companies),
              'combined_phone_family_companies':len(combined_phone),
              'external_phone_audit_rows':len(phone_audit),
              'evidence_errors':0,
              'contract_errors':0,
              'canonical_errors':0,
              'synthesis_errors':0,
              'operations':{
                  'logical_requests':rb['observed_logical_requests'],
                  'conservative_request_charge':rb['observed_conservative_challenge_request_charge'],
                  'theoretical_conservative_request_ceiling':rb['theoretical_challenge_request_charge_ceiling'],
                  'runtime_seconds':report['runtime']['wall_runtime_seconds'],
                  'third_party_cost_usd':0.0,
                  'search_api_requests':0,
              },
              'passed':True,
          }
          Path('out/phasea-v2-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Hash qualification deliverables
        run: |
          sha256sum \
            phasea-v2-exclude.jsonl \
            phasea-v2-exclude-report.json \
            phasea-v2-fresh-100.jsonl \
            phasea-v2-selection.json \
            out/phasea-v2-output.jsonl \
            out/phasea-v2-report.json \
            out/phasea-v2-work/profiles.jsonl \
            out/phasea-v2-summary.json \
            out/phasea-v2-phone-audit.jsonl \
            > out/phasea-v2-fresh.sha256

      - name: Upload second fresh qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phasea-final-fresh-disjoint-100-v2
          retention-days: 30
          if-no-files-found: warn
          path: |
            phasea-v2-exclude.jsonl
            phasea-v2-exclude-report.json
            phasea-v2-fresh-100.jsonl
            phasea-v2-fresh-100.sha256
            phasea-v2-selection.json
            out/phasea-v2-output.jsonl
            out/phasea-v2-report.json
            out/phasea-v2-product.html
            out/phasea-v2-work/profiles.jsonl
            out/phasea-v2-summary.json
            out/phasea-v2-phone-audit.jsonl
            out/phasea-v2-fresh.sha256
