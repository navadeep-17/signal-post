name: Research Retained Hiring Signal Audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run focused hiring audit tests
        run: |
          uv sync --locked
          PYTHONPATH=src uv run --with pytest pytest -q tests/test_audit_retained_hiring_signals.py

      - name: Download archived exact-site profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p archived/final-release
          gh run download 35246833190             --repo "$GITHUB_REPOSITORY"             --pattern 'final-release-chunk-*'             --dir archived/final-release
          COUNT="$(find archived/final-release -name profiles.jsonl | wc -l)"
          echo "profiles-files=$COUNT"
          test "$COUNT" -eq 10

      - name: Audit retained exact-site hiring intent
        run: |
          mkdir -p out/retained-hiring
          uv run python scripts/audit_retained_hiring_signals.py             --profiles-dir archived/final-release             --output-contract-gz submission/final-release-1000-output.jsonl.gz             --output-dir out/retained-hiring
          cat out/retained-hiring/report.json
          echo "--- candidates ---"
          cat out/retained-hiring/candidates.jsonl || true

      - name: Upload bounded research evidence
        uses: actions/upload-artifact@v4
        with:
          name: research-retained-hiring-signal-audit
          retention-days: 30
          path: |
            out/retained-hiring/report.json
            out/retained-hiring/candidates.jsonl
