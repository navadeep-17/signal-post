name: V9 Provider Gate

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/v9-search-provider-gate
    paths:
      - src/norway_company_agent/v9_provider_gate.py
      - tests/test_v9_provider_gate.py
      - .github/workflows/v9-provider-gate.yml

permissions:
  contents: read

jobs:
  provider-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run provider-gate and discovery regressions
        run: |
          uv run --with pytest pytest -q             tests/test_v9_provider_gate.py             tests/test_v9_discovery.py             tests/test_search_discovery.py
