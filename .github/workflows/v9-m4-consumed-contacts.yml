name: V9 M4 Consumed Contact Gate

on:
  pull_request:
    paths:
      - .github/workflows/v9-m4-consumed-contacts.yml
      - src/norway_company_agent/company_site_contact.py
      - src/norway_company_agent/company_site_phone.py
      - src/norway_company_agent/external_contract.py
      - src/norway_company_agent/canonical_projection.py
      - src/norway_company_agent/v9_contact_audit.py
      - scripts/run_signalpost_v9.py
      - scripts/audit_v9_zero_request_contacts.py
      - tests/test_company_site_contact.py
      - tests/test_company_site_phone.py
      - tests/test_contact_phone_external_contract.py
      - tests/test_v9_contact_audit.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  consumed-contact-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout M4 challenger
        uses: actions/checkout@v4
        with:
          path: challenger
          fetch-depth: 1

      - name: Checkout frozen M2/M3 baseline
        uses: actions/checkout@v4
        with:
          ref: 04b6f2555d4e1a9b5da25ae325ead5a802967772
          path: baseline
          fetch-depth: 1

      - name: Record exact SHAs
        run: |
          mkdir -p shared/out
          git -C baseline rev-parse HEAD | tee shared/out/baseline-sha.txt
          git -C challenger rev-parse HEAD | tee shared/out/challenger-sha.txt
          test "$(cat shared/out/baseline-sha.txt)" = "04b6f2555d4e1a9b5da25ae325ead5a802967772"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install annual-report runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr unzip

      - name: Sync locked dependencies
        run: |
          (cd baseline && uv sync --locked)
          (cd challenger && uv sync --locked)

      - name: Recover already-consumed 100-company cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shared/consumed
          gh run download 37314396820 \
            --repo "$GITHUB_REPOSITORY" \
            --name phase11-owner-veto-consumed-replay \
            --dir shared/consumed
          MANIFEST="$(find shared/consumed -type f -name 'phase11-fresh-100.jsonl' | head -n 1)"
          test -n "$MANIFEST"
          cp "$MANIFEST" shared/out/consumed-100.jsonl
          test "$(wc -l < shared/out/consumed-100.jsonl)" -eq 100
          echo '394eaae1b43fbe5e951fc4a61c7185c068bfa6dad1d37a7223cefc507429dd99  shared/out/consumed-100.jsonl' | sha256sum -c -

      - name: Download one shared BRREG snapshot
        run: |
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 240 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output shared/brreg-enheter.csv
          test -s shared/brreg-enheter.csv
          sha256sum shared/brreg-enheter.csv | tee shared/out/brreg-enheter.sha256

      - name: Replay M2/M3 baseline on consumed 100
        run: |
          cd baseline
          uv run python scripts/run_signalpost_v8.py \
            --organisations ../shared/out/consumed-100.jsonl \
            --bulk ../shared/brreg-enheter.csv \
            --output ../shared/out/baseline-output.jsonl \
            --report ../shared/out/baseline-report.json \
            --product-output ../shared/out/baseline-product.html \
            --work-dir ../shared/out/baseline-work \
            --run-id v9-m4-consumed-baseline \
            --expected-count 100 \
            --workers 8 \
            --site-timeout 6 \
            --wikidata-timeout 8 \
            --max-challenge-requests 2000 \
            --max-third-party-cost-usd 0 \
            --max-wall-runtime-seconds 2400 \
            --annual-workforce-workers 4 \
            --annual-workforce-timeout 60 \
            --annual-workforce-min-start-interval 2.1 \
            --annual-workforce-ocr-pages 8 \
            --annual-workforce-ocr-dpi 110 \
            --support-registry-timeout 420 \
            --support-lookback-days 365 \
            --support-events-per-company 5

      - name: Replay M4 challenger on same consumed 100
        run: |
          cd challenger
          uv run python scripts/run_signalpost_v9.py \
            --organisations ../shared/out/consumed-100.jsonl \
            --bulk ../shared/brreg-enheter.csv \
            --output ../shared/out/challenger-output.jsonl \
            --report ../shared/out/challenger-report.json \
            --product-output ../shared/out/challenger-product.html \
            --work-dir ../shared/out/challenger-work \
            --run-id v9-m4-consumed-challenger \
            --expected-count 100 \
            --workers 8 \
            --site-timeout 6 \
            --wikidata-timeout 8 \
            --max-challenge-requests 2000 \
            --max-third-party-cost-usd 0 \
            --max-wall-runtime-seconds 2400 \
            --annual-workforce-workers 4 \
            --annual-workforce-timeout 60 \
            --annual-workforce-min-start-interval 2.1 \
            --annual-workforce-ocr-pages 8 \
            --annual-workforce-ocr-dpi 110 \
            --support-registry-timeout 420 \
            --support-lookback-days 365 \
            --support-events-per-company 5

      - name: Measure family delta
        run: |
          cd challenger
          uv run python scripts/measure_v9_company_family_coverage.py \
            --baseline ../shared/out/baseline-output.jsonl \
            --challenger ../shared/out/challenger-output.jsonl \
            --report ../shared/out/m4-family-transfer.json

      - name: Audit zero-request contact transfer
        run: |
          cd challenger
          uv run python scripts/audit_v9_zero_request_contacts.py \
            --baseline ../shared/out/baseline-output.jsonl \
            --challenger ../shared/out/challenger-output.jsonl \
            --report ../shared/out/m4-contact-audit.json \
            --manual-audit-jsonl ../shared/out/m4-manual-audit.jsonl
          echo '--- M4 manual audit rows ---'
          cat ../shared/out/m4-manual-audit.jsonl || true

      - name: Enforce M4 structural gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          out = Path("shared/out")
          baseline = json.loads((out / "baseline-report.json").read_text())
          challenger = json.loads((out / "challenger-report.json").read_text())
          family = json.loads((out / "m4-family-transfer.json").read_text())
          contacts = json.loads((out / "m4-contact-audit.json").read_text())

          assert baseline.get("passed") is True, baseline
          assert challenger.get("passed") is True, challenger
          assert family.get("same_company_set") is True
          assert family.get("companies") == 100
          assert contacts.get("companies") == 100
          assert contacts.get("lost_contact_publications") == 0, contacts
          assert contacts.get("all_new_evidence_complete") is True, contacts
          assert contacts.get("network_requests_added_by_feature") == 0

          bp = baseline.get("request_budget") or {}
          cp = challenger.get("request_budget") or {}
          assert cp.get("theoretical_challenge_request_charge_ceiling") == bp.get(
              "theoretical_challenge_request_charge_ceiling"
          ), (bp, cp)
          assert int(cp.get("theoretical_challenge_request_charge_ceiling") or 0) <= 2000

          policy = challenger.get("source_policy") or {}
          assert float(policy.get("third_party_cost_usd") or 0.0) == 0.0
          assert int(policy.get("search_api_requests") or 0) == 0
          assert int(policy.get("contact_email_network_requests") or 0) == 0
          assert int(policy.get("contact_phone_network_requests") or 0) == 0

          print("M4_STRUCTURAL_GATES=PASS")
          print("new_contact_publications=", contacts["new_contact_publications"])
          print("external_contact_family_delta=", family["families"]["external_contact"])
          PY

      - name: Remove product HTML before archive
        if: always()
        run: |
          rm -f shared/out/baseline-product.html shared/out/challenger-product.html

      - name: Upload M4 consumed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-m4-consumed-contact-gate
          retention-days: 30
          if-no-files-found: error
          path: |
            shared/out/baseline-sha.txt
            shared/out/challenger-sha.txt
            shared/out/consumed-100.jsonl
            shared/out/brreg-enheter.sha256
            shared/out/baseline-report.json
            shared/out/challenger-report.json
            shared/out/baseline-output.jsonl
            shared/out/challenger-output.jsonl
            shared/out/m4-family-transfer.json
            shared/out/m4-contact-audit.json
            shared/out/m4-manual-audit.jsonl
