name: Baseline CI

on:
  workflow_dispatch:
    inputs:
      m33_mode:
        description: "M33 four-company consumed development diagnostic"
        required: true
        type: choice
        options: [preview, live]
        default: preview
      m33_live_confirmation:
        description: "Type RUN_FROZEN_CONSUMED_4_ONLY for one live diagnostic"
        type: string
        default: ""
      m33_payg_off:
        description: "Current Tavily pay-as-you-go OFF"
        type: boolean
        default: false
      m33_credits_four:
        description: "At least FOUR free Basic Search credits currently available"
        type: boolean
        default: false
      m33_private:
        description: "Server-side use and encrypted private report only"
        type: boolean
        default: false
      m38_mode:
        description: "M38 pre-registered consumed four, preview or one-time live"
        required: true
        type: choice
        options: [preview, live]
        default: preview
      m38_exact_live_confirmation:
        description: "Type RUN_M38_FROZEN_FOUR_SINGLE_HOMEPAGE_QUERY"
        type: string
        default: ""
      m38_payg_off:
        description: "Confirm CURRENT Tavily pay-as-you-go is off"
        type: boolean
        default: false
      m38_free_basic_four:
        description: "Confirm at least four CURRENT free Basic Search credits"
        type: boolean
        default: false
      m38_server_side_only:
        description: "Private server-side use, ciphertext-only report"
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  offline-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Run full test suite
        run: uv run --with pytest pytest -q

      - name: Audit V2 canonical recovery on certified 1000
        run: uv run python scripts/audit_canonical_v2.py

      - name: Verify submission bundle
        run: uv run python scripts/verify_submission_bundle.py

      - name: Run deterministic refresh replay
        run: |
          uv run python scripts/run_refresh_replay.py \
            --manifest tests/fixtures/refresh-snapshots.json \
            --output /tmp/refresh-demo.json

      - name: Verify refresh qualification output
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/refresh-demo.json').read_text(encoding='utf-8'))
          assert report['qualification_passed'] is True, report
          assert report['false_positive'] == 0, report
          assert report['false_negative'] == 0, report
          assert report['evidence_complete'] is True, report
          assert report['idempotent_rerun'] is True, report
          print('Refresh replay qualification passed.')
          PY


  experimental-m33-consumed-four:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'navadeep-17/signal-post' && github.ref == 'refs/heads/experiment/v10-m32-offline-crawl-nomination'
    concurrency:
      group: signalpost-m33-consumed-four
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require exact one-time live confirmation and fresh free-credit conditions
        env:
          MODE: ${{ inputs.m33_mode }}
          CONFIRMATION: ${{ inputs.m33_live_confirmation }}
          PAYG_OFF: ${{ inputs.m33_payg_off }}
          FREE_CREDITS: ${{ inputs.m33_credits_four }}
          PRIVATE: ${{ inputs.m33_private }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ "$MODE" = live ]; then
            test "$ATTEMPT" = 1 || { echo 'Live workflow rerun blocked'; exit 1; }
            test "$CONFIRMATION" = RUN_FROZEN_CONSUMED_4_ONLY || { echo 'Live typed confirmation missing'; exit 1; }
            test "$PAYG_OFF" = true || { echo 'Live requires current PAYG off'; exit 1; }
            test "$FREE_CREDITS" = true || { echo 'Live requires >=4 remaining free Basic credits'; exit 1; }
            test "$PRIVATE" = true || { echo 'Live private/server-side handling not confirmed'; exit 1; }
          else
            test "$MODE" = preview || { echo 'Unknown M33 execution mode'; exit 1; }
          fi
          echo 'Frozen four-company manual diagnostic input gate passed'

      - name: Checkout reviewed M33 revision only, never main
        uses: actions/checkout@v4
        with:
          ref: d095ef4bb556d487dc8b3dfe5edbf07b50b2750a
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install pinned dependencies; test mock transport and wrong-org veto
        run: |
          uv sync --locked
          uv run --with pytest pytest -q tests/test_v10_m33_consumed4_diagnostic.py tests/test_v10_m32_offline_nomination.py tests/test_v10_m26_consumed_pilot.py tests/test_v10_m25_tavily_transport.py

      - name: Read-only preview from three exact previously-consumed SHA-pinned archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --with 'cryptography>=45,<47' python scripts/run_v10_m33_actions_wrapper.py --preview

      - name: Four bounded live searches, independent page checks, ciphertext ONLY
        id: m33_live
        if: inputs.m33_mode == 'live'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SIGNALPOST_PILOT_REPORT_KEY: ${{ secrets.SIGNALPOST_PILOT_REPORT_KEY }}
        run: |
          set -euo pipefail
          set +x
          uv run --with 'cryptography>=45,<47' python scripts/run_v10_m33_actions_wrapper.py --live

      - name: Upload encrypted report, never provider or company plaintext
        if: inputs.m33_mode == 'live' && steps.m33_live.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: m33-four-consumed-encrypted-only
          path: ${{ runner.temp }}/m33-frozen-four-ciphertext.fernet
          retention-days: 7
          if-no-files-found: error

      - name: Destroy private ciphertext on ephemeral GitHub runner
        if: always()
        run: rm -f "$RUNNER_TEMP/m33-frozen-four-ciphertext.fernet"

      - name: Reject aborted, failed or repeated live diagnostic after preserving encrypted report
        if: always() && inputs.m33_mode == 'live'
        env:
          OUTCOME: ${{ steps.m33_live.outcome }}
          ABORTED: ${{ steps.m33_live.outputs.aborted }}
        run: |
          test "$OUTCOME" = success || { echo 'M33 failed closed; no private details logged'; exit 1; }
          test "$ABORTED" = false || { echo 'M33 stopped early; review encrypted report, no automatic retry'; exit 1; }
          echo 'M33 completed within four-company bounds; ZERO published company claims'


  m38-frozen-four-alternative-homepage:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'navadeep-17/signal-post' && github.ref == 'refs/heads/experiment/v10-m38-pre-registered-4-homepage-query'
    concurrency:
      group: signalpost-m38-frozen-consumed-four
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Reject unconfirmed live run, repeat attempts or unknown modes
        env:
          MODE: ${{ inputs.m38_mode }}
          EXACT: ${{ inputs.m38_exact_live_confirmation }}
          PAYG_OFF: ${{ inputs.m38_payg_off }}
          CREDITS: ${{ inputs.m38_free_basic_four }}
          PRIVATE: ${{ inputs.m38_server_side_only }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ "$MODE" = live ]; then
            test "$ATTEMPT" = 1 || { echo 'Live rerun forbidden'; exit 1; }
            test "$EXACT" = RUN_M38_FROZEN_FOUR_SINGLE_HOMEPAGE_QUERY || { echo 'Incorrect live confirmation'; exit 1; }
            test "$PAYG_OFF" = true || { echo 'Current no-PAYG confirmation required'; exit 1; }
            test "$CREDITS" = true || { echo 'Current minimum four free Basic credits required'; exit 1; }
            test "$PRIVATE" = true || { echo 'Current ciphertext-only/server-side confirmation required'; exit 1; }
          else
            test "$MODE" = preview || { echo 'Unknown M38 mode'; exit 1; }
          fi
          echo 'M38 reviewed exact four-company experiment; guarded mode validated'

      - name: Checkout immutable reviewed M38 runner instead of production or moving branch
        uses: actions/checkout@v4
        with:
          ref: 82dd81a65297291a76d24c32a7649fb9e9810380
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install pinned dependencies and run mocked M38 plus strict historical tests
        run: |
          set -euo pipefail
          uv sync --locked
          uv run --with pytest pytest -q \
            tests/test_v10_m38_pre_registered_pilot.py \
            tests/test_v10_m37_offline_query_design.py \
            tests/test_v10_m36_offline_rejection_diagnostics.py \
            tests/test_v10_m35_shadow_rejection_analysis.py \
            tests/test_v10_m33_consumed4_diagnostic.py \
            tests/test_v10_m32_offline_nomination.py \
            tests/test_v10_m26_consumed_pilot.py \
            tests/test_v10_m25_tavily_transport.py

      - name: Always validate SHA-frozen historical encrypted artifacts, zero external research
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNALPOST_PILOT_REPORT_KEY: ${{ secrets.SIGNALPOST_PILOT_REPORT_KEY }}
        run: |
          set -euo pipefail
          set +x
          uv run --with 'cryptography>=45,<47' python scripts/run_v10_m38_actions_wrapper.py --preview
          echo 'M38 cohort and query validated without provider or company requests'

      - name: M38 live four Basic searches and independent checks (only after fresh confirmations)
        id: m38_live
        if: inputs.m38_mode == 'live'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNALPOST_PILOT_REPORT_KEY: ${{ secrets.SIGNALPOST_PILOT_REPORT_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          uv run --with 'cryptography>=45,<47' python scripts/run_v10_m38_actions_wrapper.py --live

      - name: Upload only encrypted M38 private report with seven-day retention
        if: inputs.m38_mode == 'live' && steps.m38_live.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: m38-private-encrypted-consumed-four
          path: ${{ runner.temp }}/m38-private-consumed-four-ciphertext.fernet
          retention-days: 7
          if-no-files-found: error

      - name: Remove the ephemeral encrypted report even after failure
        if: always()
        run: rm -f "$RUNNER_TEMP/m38-private-consumed-four-ciphertext.fernet"

      - name: Refuse a passed outcome for aborted or incomplete live diagnostic
        if: always() && inputs.m38_mode == 'live'
        env:
          RESULT: ${{ steps.m38_live.outcome }}
          ABORTED: ${{ steps.m38_live.outputs.aborted }}
        run: |
          test "$RESULT" = success || { echo 'M38 failed closed; no private source details logged'; exit 1; }
          test "$ABORTED" = false || { echo 'M38 diagnostic stopped early; do not automatically retry'; exit 1; }
          echo 'M38 four-company alternate query completed; no claim published or score established'
