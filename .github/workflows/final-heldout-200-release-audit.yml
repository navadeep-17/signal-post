name: Final Heldout 200 Release Audit

on:
  push:
    branches:
      - validation/final-heldout-200-release-audit
    paths:
      - '.github/workflows/final-heldout-200-release-audit.yml'

permissions:
  contents: read

jobs:
  heldout-release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked dependencies and run frozen regressions
        run: |
          uv sync --locked
          uv run --with pytest pytest -q

      - name: Download official BRREG bulk registry
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          test -s brreg-enheter.csv
          sha256sum brreg-enheter.csv > brreg-enheter.sha256

      - name: Download Builderr frozen universe
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://builderr.ai/signalpost-company-universe-2025.jsonl.gz' \
            --output signalpost-universe.jsonl.gz
          test -s signalpost-universe.jsonl.gz
          gzip -t signalpost-universe.jsonl.gz
          sha256sum signalpost-universe.jsonl.gz > signalpost-universe.sha256

      - name: Recreate and open only the predeclared heldout 200
        run: |
          uv run python select_entry_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --count 1000 \
            --seed 20260823 \
            --output entry-companies.jsonl
          test "$(wc -l < entry-companies.jsonl)" -eq 1000

          head -n 800 entry-companies.jsonl > nonheldout-800-seal-check.jsonl
          sed -n '801,1000p' entry-companies.jsonl > heldout-200.jsonl
          test "$(wc -l < nonheldout-800-seal-check.jsonl)" -eq 800
          test "$(wc -l < heldout-200.jsonl)" -eq 200

          HELD_SHA="$(sha256sum heldout-200.jsonl | cut -d' ' -f1)"
          test "$HELD_SHA" = 'fb81f7695ee91606d1af7eee00e8323a326ebc33b79b3cb1a4f046573ae3368f'
          printf '%s  %s\n' "$HELD_SHA" heldout-200.jsonl > heldout-200.sha256

          uv run python - <<'PY'
          import json
          from pathlib import Path

          def orgs(path):
              return {
                  str(json.loads(line)['organisation_number'])
                  for line in Path(path).read_text().splitlines()
                  if line.strip()
              }

          nonheld = orgs('nonheldout-800-seal-check.jsonl')
          held = orgs('heldout-200.jsonl')
          assert len(nonheld) == 800
          assert len(held) == 200
          assert not (nonheld & held), sorted(nonheld & held)[:10]
          print(json.dumps({
              'heldout_sha256': 'fb81f7695ee91606d1af7eee00e8323a326ebc33b79b3cb1a4f046573ae3368f',
              'heldout_count': len(held),
              'nonheldout_count': len(nonheld),
              'overlap_count': len(nonheld & held),
              'release_audit_opened': True,
          }, indent=2))
          PY

      - name: Run frozen production runner on heldout 200
        run: |
          uv run python scripts/run_signalpost_final.py \
            --organisations heldout-200.jsonl \
            --bulk brreg-enheter.csv \
            --output out/heldout-200-final.jsonl \
            --report out/heldout-200-report.json \
            --work-dir out/heldout-200-work \
            --run-id final-heldout-200-release-audit \
            --expected-count 200 \
            --workers 8 \
            --site-timeout 6 \
            --wikidata-timeout 8 \
            --max-challenge-requests 3604 \
            --max-third-party-cost-usd 0 \
            --max-wall-runtime-seconds 1200

      - name: Verify final heldout release invariants and extract verified sites
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('out/heldout-200-report.json').read_text())
          outputs = [json.loads(line) for line in Path('out/heldout-200-final.jsonl').read_text().splitlines() if line.strip()]
          profiles = [json.loads(line) for line in Path('out/heldout-200-work/profiles.jsonl').read_text().splitlines() if line.strip()]

          assert report['passed'] is True, report
          assert report['expected_count'] == 200
          assert report['final_objects'] == 200
          assert len(outputs) == 200
          assert len({row['organisation_number'] for row in outputs}) == 200
          assert all(row['run']['terminal_status'] == 'completed' for row in outputs)

          registry = report['registry']
          assert registry['requested'] == 200, registry
          assert registry['selected'] + registry['missing_count'] == 200, registry

          budget = report['request_budget']
          assert budget['shared_wikidata_logical_request_ceiling'] == 2, budget
          assert budget['shared_wikidata_logical_requests'] <= 2, budget
          assert budget['theoretical_logical_request_ceiling'] == 1802, budget
          assert budget['theoretical_challenge_request_charge_ceiling'] == 3604, budget
          assert budget['observed_conservative_challenge_request_charge'] <= 3604, budget

          assert report['source_policy']['third_party_cost_usd'] == 0.0
          assert report['source_policy']['search_api_requests'] == 0
          assert report['source_policy']['experimental_connectors_enabled'] is False
          assert report['runtime']['wall_runtime_seconds'] <= 1200
          assert report['contract_errors'] == []
          assert report['change_errors'] == []
          assert report['budget_errors'] == []

          verified = []
          for profile in profiles:
              website = ((profile.get('evidence') or {}).get('website') or {})
              value = website.get('value') or {}
              identity = value.get('identity_assessment') or {}
              if website.get('status') != 'available' or not identity.get('publishable'):
                  continue
              verified.append({
                  'organisation_number': profile['organisation_number'],
                  'name': profile.get('name'),
                  'website': value.get('final_url') or website.get('source_url'),
                  'source_type': website.get('source_type'),
                  'identity_score': identity.get('score'),
                  'identity_method': identity.get('method'),
                  'identity_reasons': identity.get('reasons') or [],
                  'source_url': website.get('source_url'),
                  'content_sha256': website.get('content_sha256'),
              })

          Path('out/heldout-verified-sites.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, separators=(',', ':')) + '\n' for row in verified),
              encoding='utf-8',
          )

          summary = {
              'passed': report['passed'],
              'final_objects': report['final_objects'],
              'registry_selected': registry['selected'],
              'registry_missing_count': registry['missing_count'],
              'registry_missing_orgs': registry['missing_organisation_numbers'],
              'verified_sites': report['site_discovery']['profiles_with_verified_site'],
              'extracted_verified_sites': len(verified),
              'site_sources': report['site_discovery']['selected_sources'],
              'wikidata': report['site_discovery']['wikidata'],
              'claims': report['claims'],
              'evidence_items': report['evidence_items'],
              'errors': report['errors'],
              'observed_logical_requests': budget['observed_logical_requests'],
              'observed_conservative_requests': budget['observed_conservative_challenge_request_charge'],
              'normalized_conservative_requests_per_100': budget['observed_conservative_challenge_request_charge'] / 2,
              'theoretical_conservative_ceiling': budget['theoretical_challenge_request_charge_ceiling'],
              'runtime_seconds': report['runtime']['wall_runtime_seconds'],
              'third_party_cost_usd': report['source_policy']['third_party_cost_usd'],
              'search_api_requests': report['source_policy']['search_api_requests'],
              'contract_errors': len(report['contract_errors']),
              'change_errors': len(report['change_errors']),
              'budget_errors': len(report['budget_errors']),
          }
          Path('out/heldout-200-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          print('VERIFIED_SITES_JSONL_BEGIN')
          print(Path('out/heldout-verified-sites.jsonl').read_text())
          print('VERIFIED_SITES_JSONL_END')
          PY

      - name: Upload final heldout release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-heldout-200-release-audit
          if-no-files-found: error
          retention-days: 90
          path: |
            signalpost-universe.sha256
            brreg-enheter.sha256
            heldout-200.sha256
            out/heldout-200-final.jsonl
            out/heldout-200-report.json
            out/heldout-200-summary.json
            out/heldout-verified-sites.jsonl
            out/heldout-200-work/profiles.jsonl
            out/heldout-200-work/internal-envelopes.jsonl
