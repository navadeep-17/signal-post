name: V9 Discovery Contract

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/v9-discovery-3
    paths:
      - src/norway_company_agent/v9_discovery.py
      - tests/test_v9_discovery.py
      - .github/workflows/v9-discovery-contract.yml

permissions:
  contents: read

jobs:
  discovery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run V9 discovery contract regressions
        run: |
          uv run --with pytest pytest -q             tests/test_v9_discovery.py             tests/test_search_discovery.py             tests/test_identity_org_conflict.py
