name: H1 Qualification Audit

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/h1-qualification
    paths:
      - '.github/workflows/h1-qualification.yml'
      - 'src/norway_company_agent/domain_discovery.py'
      - 'src/norway_company_agent/identity.py'
      - 'scripts/run_registry_email_domain_discovery.py'
      - 'tests/test_domain_discovery.py'

permissions:
  contents: read

jobs:
  h1-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Run H1 hard-negative tests
        run: uv run --with pytest pytest -q tests/test_domain_discovery.py

      - name: Download official BRREG bulk registry
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv' \
            --output brreg-enheter.csv
          test -s brreg-enheter.csv
          sha256sum brreg-enheter.csv > brreg-enheter.sha256

      - name: Download Builderr frozen universe
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://builderr.ai/signalpost-company-universe-2025.jsonl.gz' \
            --output signalpost-universe.jsonl.gz
          test -s signalpost-universe.jsonl.gz
          gzip -t signalpost-universe.jsonl.gz
          sha256sum signalpost-universe.jsonl.gz > signalpost-universe.sha256

      - name: Recreate deterministic 1,000-company manifest
        run: |
          uv run python select_entry_batch.py \
            --universe signalpost-universe.jsonl.gz \
            --count 1000 \
            --seed 20260823 \
            --output entry-companies.jsonl
          test "$(wc -l < entry-companies.jsonl)" -eq 1000

      - name: Freeze qualification and untouched held-out slices
        run: |
          sed -n '201,800p' entry-companies.jsonl > h1-qualification-600.jsonl
          sed -n '801,1000p' entry-companies.jsonl > h1-held-out-200.jsonl
          test "$(wc -l < h1-qualification-600.jsonl)" -eq 600
          test "$(wc -l < h1-held-out-200.jsonl)" -eq 200
          QUAL_SHA="$(sha256sum h1-qualification-600.jsonl | cut -d' ' -f1)"
          HELD_SHA="$(sha256sum h1-held-out-200.jsonl | cut -d' ' -f1)"
          test "$QUAL_SHA" = '5a910aadec1c1a7c453e34bc5cb31df2ab8c31e536d1753451609654d424181a'
          test "$HELD_SHA" = 'fb81f7695ee91606d1af7eee00e8323a326ebc33b79b3cb1a4f046573ae3368f'
          printf '%s  %s\n' "$QUAL_SHA" h1-qualification-600.jsonl > h1-qualification-manifests.sha256
          printf '%s  %s\n' "$HELD_SHA" h1-held-out-200.jsonl >> h1-qualification-manifests.sha256

      - name: Build registry-only qualification profiles with snapshot-drift accounting
        run: |
          mkdir -p out
          uv run python - <<'PY'
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path('src').resolve()))
          from norway_company_agent.batch import profiles_from_bulk, read_organisation_inputs
          from norway_company_agent.sampling import iter_bulk

          inputs = read_organisation_inputs('h1-qualification-600.jsonl')
          requested = [item['organisation_number'] for item in inputs]
          wanted = set(requested)
          present = set()
          for row in iter_bulk('brreg-enheter.csv'):
              org = row['organisation_number']
              if org in wanted:
                  present.add(org)
                  if len(present) == len(wanted):
                      break

          current_orgs = [org for org in requested if org in present]
          missing = [org for org in requested if org not in present]
          assert len(current_orgs) + len(missing) == 600
          assert len(current_orgs) >= 595, {'present': len(current_orgs), 'missing': missing}

          profiles, metadata = profiles_from_bulk('brreg-enheter.csv', current_orgs)
          assert len(profiles) == len(current_orgs)
          Path('out/h1-qualification-baseline-profiles.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, separators=(',', ':')) + '\n' for row in profiles),
              encoding='utf-8',
          )
          Path('out/h1-qualification-registry-report.json').write_text(
              json.dumps({
                  'manifest_profiles': 600,
                  'current_snapshot_present': len(current_orgs),
                  'current_snapshot_missing': missing,
                  'registry': metadata,
              }, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({'present': len(current_orgs), 'missing': missing}, indent=2))
          PY

      - name: Run H1 qualification audit
        run: |
          uv run python scripts/run_registry_email_domain_discovery.py \
            --input out/h1-qualification-baseline-profiles.jsonl \
            --output out/h1-qualification-enriched-profiles.jsonl \
            --predictions out/h1-qualification-predictions.jsonl \
            --report out/h1-qualification-report.json \
            --timeout 8 \
            --retry-timeout 15 \
            --workers 6 \
            --promote-verified

      - name: Extract promotions and review hard negatives
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          rows = [json.loads(line) for line in Path('out/h1-qualification-predictions.jsonl').read_text().splitlines() if line.strip()]
          promoted = [row for row in rows if row.get('publishable_by_gate')]
          reviews = []
          for row in rows:
              if row.get('publishable_by_gate'):
                  continue
              statuses = [((item.get('identity') or {}).get('status')) for item in row.get('candidate_results', [])]
              if 'review' in statuses:
                  reviews.append(row)
          def write(path, values):
              Path(path).write_text(
                  ''.join(json.dumps(row, ensure_ascii=False, separators=(',', ':')) + '\n' for row in values),
                  encoding='utf-8',
              )
          write('out/h1-qualification-promotions.jsonl', promoted)
          write('out/h1-qualification-review-cases.jsonl', reviews)
          print(json.dumps({'promotions': len(promoted), 'review_cases': len(reviews)}, indent=2))
          PY

      - name: Verify qualification invariants
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path('out/h1-qualification-registry-report.json').read_text())
          report = json.loads(Path('out/h1-qualification-report.json').read_text())
          assert registry['manifest_profiles'] == 600, registry
          assert report['input_profiles'] == registry['current_snapshot_present'], (registry, report)
          assert registry['current_snapshot_present'] + len(registry['current_snapshot_missing']) == 600, registry
          assert report['search_provider_used'] is False, report
          assert report['raw_search_results_persisted'] is False, report
          assert report['operations']['third_party_cost_usd'] == 0.0, report
          assert report['operations']['workers'] == 6, report
          assert report['operations']['requests'] < 1000, report
          assert report['operations']['wall_runtime_ms'] < 20 * 60 * 1000, report
          print(json.dumps({'registry': registry, 'h1': report}, indent=2, ensure_ascii=False))
          PY

      - name: Upload H1 qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h1-qualification-audit
          if-no-files-found: error
          retention-days: 30
          path: |
            h1-qualification-600.jsonl
            h1-held-out-200.jsonl
            h1-qualification-manifests.sha256
            brreg-enheter.sha256
            signalpost-universe.sha256
            out/h1-qualification-registry-report.json
            out/h1-qualification-baseline-profiles.jsonl
            out/h1-qualification-enriched-profiles.jsonl
            out/h1-qualification-predictions.jsonl
            out/h1-qualification-promotions.jsonl
            out/h1-qualification-review-cases.jsonl
            out/h1-qualification-report.json
