name: V9 M5 Full Suite Diagnostic

on:
  push:
    branches:
      - experiment/v9-m5-hiring-semantics-integrated
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Run verbose full suite with hard shell timeout
        run: |
          set -o pipefail
          timeout --signal=TERM 360s uv run --with pytest pytest -vv --maxfail=1 --durations=30 2>&1 | tee /tmp/m5-pytest.log

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-m5-full-suite-diagnostic
          retention-days: 7
          path: /tmp/m5-pytest.log
          if-no-files-found: warn
