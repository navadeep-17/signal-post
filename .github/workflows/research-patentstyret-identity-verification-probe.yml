name: Research Patentstyret Identity Verification Probe

on:
  push:
    branches:
      - research/bulk-exact-org-recall
    paths:
      - .github/workflows/research-patentstyret-identity-verification-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe full structured query shapes
        run: |
          mkdir -p out
          python - <<'PY'
          import json
          from pathlib import Path
          variants = {
              "common_full": {
                  "from":0,"size":50,"aggregation":{},"filters":[],
                  "commonSearch":"912355683"
              },
              "applicant": {
                  "from":0,"size":50,"aggregation":{},"filters":[],
                  "nameSearch":{
                      "nameInput":"912355683",
                      "matchApplicant":True,
                      "matchProprietor":False,
                      "matchInventor":False,
                      "matchDesigner":False
                  }
              },
              "proprietor": {
                  "from":0,"size":50,"aggregation":{},"filters":[],
                  "nameSearch":{
                      "nameInput":"912355683",
                      "matchApplicant":False,
                      "matchProprietor":True,
                      "matchInventor":False,
                      "matchDesigner":False
                  }
              },
              "applicant_proprietor": {
                  "from":0,"size":50,"aggregation":{},"filters":[],
                  "nameSearch":{
                      "nameInput":"912355683",
                      "matchApplicant":True,
                      "matchProprietor":True,
                      "matchInventor":False,
                      "matchDesigner":False
                  }
              },
          }
          for name,payload in variants.items():
              Path(f'out/{name}.query.json').write_text(json.dumps(payload,separators=(',',':')),encoding='utf-8')
          PY
          for DOMAIN in trademark design patent; do
            case "$DOMAIN" in
              trademark) URL='https://search.patentstyret.no/api/search/trademark/v2' ;;
              design) URL='https://search.patentstyret.no/api/search/design/v2' ;;
              patent) URL='https://search.patentstyret.no/api/search/v2' ;;
            esac
            for VARIANT in common_full applicant proprietor applicant_proprietor; do
              CODE="$(curl --silent --show-error --location --compressed \
                --user-agent 'Signalpost-research-source-screen/1.0' \
                --header 'Accept: application/json' \
                --header 'Content-Type: application/json' \
                --connect-timeout 10 --max-time 30 \
                --data-binary "@out/${VARIANT}.query.json" \
                --write-out '%{http_code}' "$URL" -o "out/${DOMAIN}-${VARIANT}.json" || true)"
              echo "=== ${DOMAIN} ${VARIANT} http=${CODE} ==="
              python - "${DOMAIN}" "${VARIANT}" <<'PY'
          import json,sys
          from pathlib import Path
          d,v=sys.argv[1:3]
          p=Path(f'out/{d}-{v}.json')
          text=p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
          print('bytes=',len(text))
          if not text:
              raise SystemExit
          try: data=json.loads(text)
          except Exception:
              print(text[:4000]); raise SystemExit
          if isinstance(data,dict):
              print('totalHits=',data.get('totalHits'),'keys=',sorted(data))
              for i,row in enumerate((data.get('results') or [])[:3]):
                  keep={k:row.get(k) for k in [
                      'id','idProc','applicationNumber','registrationNumber',
                      'applicants','proprietors','designers','inventors','agent',
                      'applicationDate','registrationDate','publicationDate',
                      'highLevelStatusCode','highLevelStatusToken'
                  ] if k in row}
                  print('RESULT',i,json.dumps(keep,ensure_ascii=False,sort_keys=True))
          else:
              print(type(data).__name__,str(data)[:4000])
          PY
            done
          done

      - name: Extract public detail API routes from bundle
        run: |
          curl --fail --location --compressed --user-agent 'Signalpost-research-source-screen/1.0' \
            'https://search.patentstyret.no/advanced/main.e56e868a50c47e49.js' -o out/main.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('out/main.js').read_text(encoding='utf-8',errors='replace')
          needles=['search-details','GetDesign','Design/','Trademark/','Patent/','applicationNumber','idProc','getCase','caseDetails','details']
          for needle in needles:
              pos=[m.start() for m in re.finditer(re.escape(needle),s,re.I)]
              print(f'\n=== {needle} count={len(pos)} ===')
              for idx in pos[:20]:
                  chunk=s[max(0,idx-1000):min(len(s),idx+2200)]
                  if 'apiClient' in chunk or 'http.' in chunk or 'urlApi' in chunk or 'searchTo' in chunk:
                      print(chunk)
                      print('---')
          PY

      - name: Probe conservative likely design detail routes
        run: |
          for PATHNAME in \
            '/api/Design/20200956' \
            '/api/design/20200956' \
            '/api/Search/Design/20200956' \
            '/api/Design/Get/20200956'; do
            URL="https://search.patentstyret.no${PATHNAME}"
            CODE="$(curl --silent --show-error --location --compressed \
              --user-agent 'Signalpost-research-source-screen/1.0' \
              --header 'Accept: application/json' \
              --connect-timeout 10 --max-time 20 \
              --write-out '%{http_code}' "$URL" -o out/detail.json || true)"
            echo "=== detail ${PATHNAME} http=${CODE} bytes=$(wc -c < out/detail.json 2>/dev/null || echo 0) ==="
            if [ "$CODE" = "200" ]; then head -c 24000 out/detail.json; echo; fi
          done

      - name: Cleanup
        if: always()
        run: rm -rf out
