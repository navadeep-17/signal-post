name: V7 M2C Production Apply

on:
  push:
    branches:
      - feature/v7-m2c-careers-production
    paths:
      - .github/workflows/v7-m2c-production-apply.yml

permissions:
  contents: write

jobs:
  diagnose-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run focused M2C regressions and capture output
        shell: bash
        run: |
          set +e
          uv run --with pytest pytest -q tests/test_v7_m2c_production.py > m2c-focused.log 2>&1
          status=$?
          cat m2c-focused.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add m2c-focused.log
            git commit -m "test(v7-m2c): capture focused regression failure"
            git push origin HEAD:feature/v7-m2c-careers-production
            exit "$status"
          fi

      - name: Run full repository regression suite
        run: uv run --with pytest pytest -q
