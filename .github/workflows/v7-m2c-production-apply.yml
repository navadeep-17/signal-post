name: V7 M2C Production Apply

on:
  push:
    branches:
      - feature/v7-m2c-careers-production
    paths:
      - scripts/apply_v7_m2c_production_patch.py
      - .github/workflows/v7-m2c-production-apply.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Apply isolated M2C production patch
        run: python scripts/apply_v7_m2c_production_patch.py

      - name: Preserve generated patch on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/norway_company_agent/homepage_careers_signal.py \
            src/norway_company_agent/final_site_discovery.py \
            src/norway_company_agent/output_contract.py \
            src/norway_company_agent/canonical_projection.py \
            src/norway_company_agent/synthesis.py \
            tests/test_v7_m2c_production.py \
            docs/V7_M2C_CAREERS_PRODUCTION.md
          git diff --cached --check
          git commit -m "feat(v7-m2c): promote zero-request careers signals"
          git push origin HEAD:feature/v7-m2c-careers-production

      - name: Run focused M2C regressions
        run: uv run --with pytest pytest -q tests/test_v7_m2c_production.py

      - name: Run full repository regression suite
        run: uv run --with pytest pytest -q
