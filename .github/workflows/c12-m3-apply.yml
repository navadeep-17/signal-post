          old = '''        if _publishable(registry_terminal):\n            total["selected_source"] = "registry_website"\n            total["promoted"] = True\n            return row, total\n'''
          new = '''        if _publishable(registry_terminal):\n            total["selected_source"] = "registry_website"\n            total["promoted"] = True\n            _attach_bounded_news_detail(\n                registry_terminal, evidence_map=evidence_map, total=total, timeout=timeout\n            )\n            return row, total\n'''
          assert old in text
