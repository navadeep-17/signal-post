name: C12 M3 Apply Patch

on:
  push:
    branches:
      - feature/c12-dated-first-party-news
    paths:
      - ".github/workflows/c12-m3-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/c12-dated-first-party-news
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Apply C12 M3 source and tests
        shell: bash
        run: |
