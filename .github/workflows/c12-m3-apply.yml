          new = '''                total["selected_source"] = "registry_email_domain"\n                total["promoted"] = True\n                _attach_bounded_news_detail(\n                    candidate_record, evidence_map=evidence_map, total=total, timeout=timeout\n                )\n                return row, total\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''                total["selected_source"] = "h1c_deterministic_domain"\n                total["promoted"] = True\n                return row, total\n'''
          new = '''                total["selected_source"] = "h1c_deterministic_domain"\n                total["promoted"] = True\n                _attach_bounded_news_detail(\n                    (row.get("evidence") or {}).get("website") or candidate_record,\n                    evidence_map=evidence_map,\n                    total=total,\n                    timeout=timeout,\n                )\n                return row, total\n'''
          assert old in text
