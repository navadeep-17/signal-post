name: C12 M3 Apply Patch

on:
  push:
    branches:
      - feature/c12-dated-first-party-news
    paths:
      - ".github/workflows/c12-m3-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/c12-dated-first-party-news
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Apply C12 M3 existing-file patch
        run: python -c 'import base64;exec(base64.b64decode(""))'

      - name: Run full regression suite
        run: |
          uv sync --locked
          uv run --with pytest pytest -q

      - name: Commit patch to feature branch
        run: |
          git config user.name "navadeep-17"
          git config user.email "navadeepthota17@gmail.com"
          git add src/norway_company_agent/final_site_discovery.py src/norway_company_agent/first_party_activity.py
          git commit -m "feat(c12): follow one bounded dated news detail"
          git push origin HEAD:feature/c12-dated-first-party-news
